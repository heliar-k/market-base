repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        # data/ 下 JSON 全部由 fetcher 写盘、程序消费：格式（compact 单行 or indent=1）
        # 归 fetcher 自己定，hook 不插手——pretty 展开会让 git diff 不可读且体积翻倍。
        # （尾部换行仍由 end-of-file-fixer 保证，fetcher 写盘时也已各自补上）
        exclude: '^data/'
      - id: check-added-large-files
        args: [--maxkb=10240]  # 分钟线 CSV 单品种可达数 MB，放宽到 10MB
      - id: check-ast

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: \.py$   # ruff 只扫 Python；html/js/css 由各自工具负责
      - id: ruff-format
        files: \.py$
