name: cme-connectivity-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CME quotes + Yahoo
        run: |
          echo "=== CME quotes API (CNH) ==="
          curl -s -m 30 -o /tmp/cme_cnh.json -w "HTTP %{http_code} %{size_download}B\n" \
            "https://www.cmegroup.com/CmeWS/mvc/Quotes/Future/CNH/G" \
            -H "User-Agent: Mozilla/5.0" || echo "CME failed"
          echo "=== Yahoo chart API (CNH=F) ==="
          curl -s -m 30 -o /tmp/yf.json -w "HTTP %{http_code} %{size_download}B\n" \
            "https://query1.finance.yahoo.com/v8/finance/chart/CNH%3DF?range=5d&interval=1d" \
            -H "User-Agent: Mozilla/5.0" || echo "Yahoo failed"
          echo "=== CME body ==="
          head -c 200 /tmp/cme_cnh.json 2>/dev/null || true
          echo ""
          echo "=== Yahoo body ==="
          head -c 200 /tmp/yf.json 2>/dev/null || true
