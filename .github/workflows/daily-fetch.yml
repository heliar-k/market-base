name: daily-fetch

# 每日自动拉取不依赖 IBKR 的数据源（美股收盘后，北京 05:00 = UTC 21:00；
# 周末也跑：crypto 源（OKX/Deribit/Coinglass/CME 等）7×24 有数据，非加密源周末幂等无更新）
# 产出自动 commit + push，本地 pull 即得最新数据。
# 依赖 IBKR 的 fetchers（ibkr/options/commodities/index/stock/rate_expectations）
# 不在 Actions 跑——需要 TWS 实盘连接，仍由本地 cron 负责。

on:
  schedule:
    - cron: "0 21 * * *"   # 每天 UTC 21:00（北京 05:00，覆盖美股收盘 + 周末 crypto 数据）
  workflow_dispatch: {}       # 支持手动触发

# 与其余数据 workflow（fast-refresh / fetch-refresh / crypto-refresh）共享同一 group，
# 串行化 push 防止 rebase 冲突（2026-09-28 手动 daily-fetch 与 fast-refresh 并发 push 冲突过）。
# cancel-in-progress 必须为 false：true 会让盘中班次取消正在跑的 19min 全量拉取。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  fetch:
    # 钉 24.04：本 workflow 有 playwright --with-deps（apt 装系统依赖），GitHub 2026-10-19 起
    # ubuntu-latest 换代到 Ubuntu 26，apt 包名/系统库漂移会静默弄坏 chromium 安装。
    # 解钉时机：playwright 官方声明支持 Ubuntu 26 且 Actions runner 镜像跟进后。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # 数据 commit 后显式 dispatch deploy-pages（见下方「部署」注释）
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖，uv sync 秒级恢复

      - name: Install deps
        run: uv sync

      # Barchart 走无头浏览器通道时需要（barchart_client 降级路径）；
      # 浏览器二进制按 lock 哈希缓存，命中时只剩 apt deps 安装
      - name: Cache playwright chromium
        uses: actions/cache@v6  # v4 声明 node20 已被 GitHub 强制迁移 node24（日志告警），v6 起原生 node24，输入参数不变
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install playwright chromium
        run: uv run playwright install --with-deps chromium

      - name: Fetch non-IBKR data sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YF_NO_PROXY: "1"        # Actions 无 socks5 代理，yfinance 直连
        run: |
          set +e  # 单个失败不阻断
          for f in fetch_fred fetch_fsi fetch_srf fetch_tsy fetch_cfets fetch_cboe fetch_shapiro fetch_sce fetch_treasury fetch_dts fetch_acm fetch_refunding fetch_yfinance fetch_barchart_futures fetch_cot fetch_metals_etf fetch_rate_expectations fetch_barchart_vol fetch_bgcr fetch_cgb fetch_fed fetch_analyst fetch_breadth fetch_financials fetch_sec fetch_finra fetch_insider fetch_fx fetch_etf fetch_crypto_derivatives fetch_crypto_basis fetch_coinglass fetch_cme_futures fetch_etf_flows fetch_etf_flows_eth fetch_btc_dominance fetch_polymarket; do
            echo "===== START $f ====="
            bash "bin/$f" || FAILED="$FAILED $f"
          done
          # TSM 6-K（FPI 季报 + 月度营收，按主文档名过滤；6-K 主文档只是封面，存完整提交文本）
          bash bin/fetch_sec --symbols TSM --forms 6-K --doc-pattern '^(tsm-[0-9]{8}x6k|tsm-fs|tsm-revenue)' || FAILED="$FAILED fetch_sec-tsm-6k"
          # 失败列表写入 job 级变量，最终汇总 step 统一判红
          # 不用 || echo FAIL：GitHub Actions 回显 run 块源码，字面 FAIL 会与运行时输出混淆难 grep
          [ -n "$FAILED" ] && echo "失败:$FAILED" && echo "FAILED_LIST=$FAILED" >> "$GITHUB_ENV"
          exit 0

      - name: 跨资产相关性（派生，依赖资产快照）
        run: |
          uv run python -m src.cross_asset || { echo "失败: cross_asset"; echo "FAILED_LIST=${FAILED_LIST} cross_asset" >> "$GITHUB_ENV"; }

      - name: 期权结构快照（13 标的 GEX/DEX/Vanna/Charm，yfinance 降级源；耗时 ~3min）
        env:
          YF_NO_PROXY: "1"      # options_structure 走 ensure_yf_proxy()，Actions 无代理需直连
        run: |
          uv run python -m src.options_structure || { echo "失败: options_structure"; echo "FAILED_LIST=${FAILED_LIST} options_structure" >> "$GITHUB_ENV"; }

      - name: 日频 Bill 占比（派生，依赖 MSPD + 拍卖）
        run: |
          uv run python -m src.bill_share || { echo "失败: bill_share"; echo "FAILED_LIST=${FAILED_LIST} bill_share" >> "$GITHUB_ENV"; }

      - name: Fetch OHLCV bars (yfinance, no TWS)
        env:
          YF_NO_PROXY: "1"
        run: |
          set +e
          for bs in 1d 5m 15m 1h 4h; do
            uv run python -m src.fetchers.ibkr_fetcher --bar-size $bs --yf-only || FAILED="$FAILED ohlcv-$bs"
          done
          [ -n "$FAILED" ] && echo "失败:$FAILED" && echo "FAILED_LIST=${FAILED_LIST} $FAILED" >> "$GITHUB_ENV"
          exit 0

      - name: LPI 快照（流动性压力指数日历历史，30 天+ 后用于分位校准）
        run: |
          uv run python -m src.liquidity_analysis --snapshot || { echo "失败: lpi_snapshot"; echo "FAILED_LIST=${FAILED_LIST} lpi_snapshot" >> "$GITHUB_ENV"; }

      - name: 数据时效断言（绿 ≠ 新鲜）
        # 不只看退出码：查产物末观测日期。失败只写进 FAILED_LIST（数据照常 commit），
        # 由末尾「失败汇总」统一标红。预算见 src/data_freshness.py。
        run: |
          uv run python -m src.data_freshness || { echo "失败: data_freshness"; echo "FAILED_LIST=${FAILED_LIST} data_freshness" >> "$GITHUB_ENV"; }

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            # 有数据源失败时写进 commit message：git pull 后 git log -1 即知，无需翻 Actions 日志
            NL=$'\n\n'
            MSG="data: daily auto-fetch ($(date -u +%F))"
            [ -n "$FAILED_LIST" ] && MSG="$MSG${NL}失败:$FAILED_LIST"
            git commit -m "$MSG"
            # 并发保护：远端有新 commit（如本地手动 push）时 rebase 再推，数据文件无冲突
            git pull --rebase origin main
            # PAT push 仅用于写入：GITHUB_TOKEN 与 PAT 都会被归到 github-actions[bot]
            # （App 身份），GitHub 递归保护不为其创建新 workflow run（实测 262 个 data
            # commit 只触发过 1 次部署，且那次是本地手动 push）—— 部署靠下一步显式 dispatch
            git push "https://x-access-token:${{ secrets.DATA_PUSH_TOKEN }}@github.com/heliar-k/market-base.git" HEAD:main
            echo "DATA_PUSHED=1" >> "$GITHUB_ENV"
          fi

      # 部署：数据 push 不触发 push 事件（见上），所以有数据变更时显式拉起 deploy-pages。
      # 无新观测 → 不 commit → 不 dispatch，空跑仍归零（当初删 workflow_run 触发的初衷）。
      # 位置在「失败汇总」之前：部分源失败时数据照常 commit、照常部署。
      # --ref main：workflow_dispatch 不传 sha 时取默认分支 HEAD，已含本次数据 commit。
      - name: 触发 Pages 部署
        if: env.DATA_PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}   # Actions 里 gh CLI 必须显式给 token（否则 exit 4）
        run: gh workflow run deploy-pages.yml --ref main

      # 所有拉取/派生步骤跑完后统一判红：数据照常 commit、Pages 照常部署，
      # 仅 job 标红便于发现；失败名列表 grep "失败:" 即得
      - name: 失败汇总（有失败则 job 红）
        if: env.FAILED_LIST != ''
        run: |
          echo "以下步骤失败，数据已照常 commit:$FAILED_LIST"
          exit 1

  # Pages 部署已拆为独立 workflow：.github/workflows/deploy-pages.yml
  # 由本 workflow push 数据 commit 自动触发（push paths 过滤 data/**），也可手动触发
