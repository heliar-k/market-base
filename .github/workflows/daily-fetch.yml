name: daily-fetch

# 每日自动拉取不依赖 IBKR 的数据源（美股收盘后，北京 05:00 = UTC 21:00）
# 产出自动 commit + push，本地 pull 即得最新数据。
# 依赖 IBKR 的 fetchers（ibkr/options/commodities/index/stock/rate_expectations）
# 不在 Actions 跑——需要 TWS 实盘连接，仍由本地 cron 负责。

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 周一~五 UTC 21:00（北京周二~六 05:00，覆盖周一~五美股收盘）
  workflow_dispatch: {}       # 支持手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false  # uv.lock 不入库，缓存永远无法命中 → 关闭避免警告

      - name: Install deps
        run: uv sync

      - name: Fetch non-IBKR data sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YF_NO_PROXY: "1"        # Actions 无 socks5 代理，yfinance 直连
        run: |
          set +e  # 单个失败不阻断
          for f in fetch_fred fetch_fsi fetch_srf fetch_tsy fetch_cfets fetch_cboe fetch_shapiro fetch_sce fetch_treasury fetch_acm fetch_refunding fetch_yfinance fetch_barchart_futures fetch_cot fetch_rate_expectations fetch_bgcr fetch_cgb fetch_fed fetch_analyst fetch_breadth fetch_financials fetch_sec fetch_finra fetch_insider; do
            echo "===== START $f ====="
            bash "bin/$f" || echo "===== FAIL  $f ====="
          done
          # TSM 6-K（FPI 季报 + 月度营收，按主文档名过滤；6-K 主文档只是封面，存完整提交文本）
          bash bin/fetch_sec --symbols TSM --forms 6-K --doc-pattern '^(tsm-[0-9]{8}x6k|tsm-fs|tsm-revenue)' || echo "===== FAIL  fetch_sec-tsm-6k ====="

      - name: 跨资产相关性（派生，依赖资产快照）
        run: |
          uv run python -m src.cross_asset || echo "===== FAIL cross_asset ====="

      - name: 日频 Bill 占比（派生，依赖 MSPD + 拍卖）
        run: |
          uv run python -m src.bill_share || echo "===== FAIL bill_share ====="

      - name: Fetch OHLCV bars (yfinance, no TWS)
        env:
          YF_NO_PROXY: "1"
        run: |
          set +e
          for bs in 1d 5m 15m 1h 4h; do
            uv run python -m src.fetchers.ibkr_fetcher --bar-size $bs --yf-only
          done

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "data: daily auto-fetch ($(date -u +%F))"
            # 并发保护：远端有新 commit（如本地手动 push）时 rebase 再推，数据文件无冲突
            git pull --rebase origin main
            git push
          fi

  # 网页静态站点：预渲染 API → site/ → GitHub Pages 部署
  # 首次启用需在仓库 Settings → Pages → Build and deployment → Source: GitHub Actions
  deploy-pages:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install deps
        run: uv sync

      - name: Build static site
        run: uv run python -m src.export_pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
