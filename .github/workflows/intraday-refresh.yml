name: intraday-refresh

# 盘中高频刷新（工作日每 15 分钟，UTC 13:07–21:52 = 美东盘前至收盘后 1h）。
# 尾班在收盘后 1h，用于确认指数收盘价入库：2026-10-13 事故里最后一班恰好落在
# 收盘那一分钟（UTC 20:00），拿到的仍是未结算价，且 Yahoo 指数日线迟更让
# 「同值 → 无 diff → 不 commit」把占位行固化到次日。
# 按数据变化节奏分层（2026-09-29 拆分）：
# - 价量快照（持续变，每班都拉）：yfinance 资产价 / CBOE VIX 族 / Barchart 波动率 30 指数 /
#   rate_expectations（ZQ 隐含 FOMC 概率）/ polymarket
# - FRED：发布高峰在美东上午（实测 ~14:18 UTC），只在 UTC 13-14 点的班次拉，之后跳过；
#   daily-full（21:00 UTC）与 evening-late（15:15 UTC）另有两道兜底
# - 加密 7×24 源（crypto_derivatives / coinglass / etf_flows）已拆去 crypto-hourly.yml
#   （每小时全天候，不再绑工作日盘中）
#
# 不跑：分钟线（yfinance 盘中拉 5m 全量太重）、IBKR 依赖源（本地 cron）、
# cross_asset/bill_share 与财报/SEC/拍卖等日更源。options_structure 只在 OI 发布窗后
# 回补上一收盘快照，不生成盘中快照。
#
# upsert 幂等：无新数据 → diff 为空 → 不 commit → 不触发部署，空跑零成本。
# 部署：数据 commit 后显式 gh workflow run deploy-pages.yml——PAT push 认证为
# github-actions[bot]（App 身份），GitHub 递归保护不为其创建 workflow run。
# 错峰：分钟取 7/22/37/52，避开整点 Actions schedule 排队高峰。

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch: {}

# 与其余数据 workflow 共享 group：串行化 push 防 rebase 冲突（见 daily-full.yml 注释）。
# 跑着的等完再执行，排队中的班次被更新的取代（幂等，丢班次无害）。
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  refresh:
    # 钉 24.04：本 workflow 有 playwright --with-deps（apt 装系统依赖），且 playwright 缓存 key
    # 只含 runner.os 不含镜像版本——ubuntu-latest 2026-10-19 换代到 Ubuntu 26 后会在 26 上
    # 恢复 24.04 构建的 chromium 缓存，静默漂移。解钉时机见 daily-full.yml 同位置注释。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # 数据 commit 后显式 dispatch deploy-pages（见下方「部署」注释）
    steps:
      - uses: actions/checkout@v5

      # 排队班次的基线是触发时 sha：actions/checkout 钉死 github.sha，并发组放行时
      # 上一班可能已 push 同源数据（2026-10-14/15 intraday 两次 rebase 冲突的根因）。
      # 此时无本地 commit，rebase = 纯 fast-forward，先对齐最新 main 再拉数据。
      - name: Sync to latest main
        run: git pull --rebase origin main

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖

      - name: Install deps
        run: uv sync

      # rate_expectations/barchart_vol 直连失败时降级无头浏览器（barchart_client）
      - name: Cache playwright chromium
        uses: actions/cache@v6  # v4 声明 node20 已被 GitHub 强制迁移 node24（日志告警），v6 起原生 node24，输入参数不变
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install playwright chromium
        run: uv run playwright install --with-deps chromium

      - name: Fetch intraday sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YF_NO_PROXY: "1"        # Actions 无 socks5 代理，yfinance 直连
        run: |
          set +e  # 单个失败不阻断，末尾统一判红
          for f in fetch_yfinance fetch_cboe fetch_barchart_vol fetch_rate_expectations fetch_polymarket; do
            echo "===== START $f ====="
            bash "bin/$f" || FAILED="$FAILED $f"
          done
          # 尾班（收盘后）额外拉 ETF 精选池日线：fetch_etf 全量版（含 Nasdaq 清单）只在
          # daily-full 跑，这里 --pool-only 补池子收盘时效（观测日 upsert，同日覆盖幂等）
          if [ "$(date -u +%H)" -ge 21 ]; then
            echo "===== START fetch_etf --pool-only ====="
            bash bin/fetch_etf --pool-only || FAILED="$FAILED fetch_etf_pool"
          fi
          # FRED 发布高峰在美东上午（实测 ~14:18 UTC），只拉 UTC 13-14 点的班次，之后跳过省空跑
          if [ "$(date -u +%H)" -le 14 ]; then
            echo "===== START fetch_fred ====="
            bash bin/fetch_fred || FAILED="$FAILED fetch_fred"
          fi
          [ -n "$FAILED" ] && echo "失败:$FAILED" && echo "FAILED_LIST=$FAILED" >> "$GITHUB_ENV"
          exit 0

      - name: 回补上一收盘快照 OI 并重建 Wheel
        env:
          YF_NO_PROXY: "1"
        run: |
          # 14:52 UTC 起覆盖冬夏令时 OI 发布窗；若班次延迟，后续班次会重试。
          if [ "$(date -u +%H%M)" -ge 1452 ]; then
            set +e
            OUT=$(uv run python -m src.options_structure --finalize-oi 2>&1)
            RC=$?
            set -e
            echo "$OUT"
            if [ "$RC" -ne 0 ]; then
              echo "FAILED_LIST=${FAILED_LIST} options_oi_finalize" >> "$GITHUB_ENV"
            fi
            # OI 已完成但上一班 Wheel 重建失败时，这里也会继续重试。
            uv run python -m src.wheel_scanner --dump || {
              echo "FAILED_LIST=${FAILED_LIST} wheel_board_oi_finalize" >> "$GITHUB_ENV";
            }
          fi

      - name: 数据时效断言（尾班收尾，占位行检测在此重试闭环）
        # 全量断言由 daily-full/evening-late 收尾把关，这里防的是占位行固化：
        # 窗口内标红 → 15 分钟后的下一班自然重试。
        # 值维断言经 ensure_yf_proxy 拉交叉 ETF：Actions 无代理需直连
        env:
          YF_NO_PROXY: "1"
        run: |
          uv run python -m src.data_freshness || { echo "失败: data_freshness"; echo "FAILED_LIST=${FAILED_LIST} data_freshness" >> "$GITHUB_ENV"; }

      - name: 多源共识层（盘中临时值，不覆盖定稿行）
        run: |
          uv run python -m src.consensus --intraday || { echo "失败: consensus"; echo "FAILED_LIST=${FAILED_LIST} consensus" >> "$GITHUB_ENV"; }

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            NL=$'\n\n'
            MSG="data: fast refresh ($(date -u "+%F %H:%M") UTC)"
            [ -n "$FAILED_LIST" ] && MSG="$MSG${NL}失败:$FAILED_LIST"
            git commit -m "$MSG"
            # fetch 期间仍可能有组外 push（本地 cron/手动）落库：rebase 冲突则干净放弃，
            # 下一班幂等重拉补上（upsert 同日重复零风险，丢班无害）
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            # PAT push 仅用于写入：commit 认证为 github-actions[bot]（App 身份），
            # GitHub 的递归保护不为其创建新 workflow run —— 部署靠下一步显式 dispatch
            git push "https://x-access-token:${{ secrets.DATA_PUSH_TOKEN }}@github.com/heliar-k/market-base.git" HEAD:main
            echo "DATA_PUSHED=1" >> "$GITHUB_ENV"
          fi

      # 部署：数据 push 不触发 push 事件（见上），所以有数据变更时显式拉起 deploy-pages。
      # 无新观测 → 不 commit → 不 dispatch，空跑仍归零（当初删 workflow_run 触发的初衷）。
      # --ref main：workflow_dispatch 不传 sha 时取默认分支 HEAD，已含本次数据 commit。
      - name: 触发 Pages 部署
        if: env.DATA_PUSHED == '1'
        env:
          GH_TOKEN: ${{ github.token }}   # Actions 里 gh CLI 必须显式给 token（否则 exit 4）
        run: gh workflow run deploy-pages.yml --ref main

      - name: 失败汇总（有失败则 job 红）
        if: env.FAILED_LIST != ''
        run: |
          echo "以下步骤失败，数据已照常 commit:$FAILED_LIST"
          exit 1

  # 部署由本 job 的「触发 Pages 部署」步骤显式 dispatch（数据 push 不产生 workflow run）
