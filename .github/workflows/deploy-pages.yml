name: deploy-pages

# 静态站点预渲染 + Cloudflare Pages 部署（独立于数据拉取，可单独触发）：
# - 数据 workflow（daily-fetch / fetch-refresh / fast-refresh / crypto-refresh）
#   用 PAT（DATA_PUSH_TOKEN）push 数据 commit → push 事件 + paths: data/** 触发
#   （PAT push 正常触发 push 事件，不像 GITHUB_TOKEN 受递归触发限制；
#   无数据变更时不 commit → 不 push → 不触发，空跑部署归零）
# - 手动 push 前端/后端改动 → 同一 push 事件自动触发
# - 手动触发：gh workflow run deploy-pages.yml --ref <分支>
#
# 部署链（工单 #11，ADR-0003）：export_pages 产 API JSON → frontend/public/api/
# → astro build（public/ 原样拷贝 + 编译 .astro 页）→ frontend/dist
# → wrangler pages deploy（内容哈希增量上传，未变更文件不重传，部署秒级）。
# 站点：https://market-base.pages.dev （根路径）。GitHub Pages 已下线（冻结备份）。
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# 数据 push 与手动 push 接近时串行执行，避免两个部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_dispatch 指定分支时构建该分支；push 触发时 github.ref 即 main
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖

      - name: Install deps
        run: uv sync

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      # API JSON 直落 frontend/public/api/（astro build 拷进 dist/）
      - name: Export API JSON
        env:
          PAGES_JSON_ONLY: "1"
        run: uv run python -m src.export_pages

      - name: Build frontend (astro)
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy frontend/dist --project-name=market-base
