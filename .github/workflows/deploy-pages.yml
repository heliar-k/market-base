name: deploy-pages

# 静态站点预渲染 + Cloudflare Pages 部署（独立于数据拉取，可单独触发）：
# - 数据 workflow（daily-fetch / fetch-refresh / fast-refresh / crypto-refresh）
#   用 PAT（DATA_PUSH_TOKEN）push 数据 commit → push 事件 + paths: data/** 触发
#   （PAT push 正常触发 push 事件，不像 GITHUB_TOKEN 受递归触发限制；
#   无数据变更时不 commit → 不 push → 不触发，空跑部署归零）
# - 手动 push static/src 改动 → 同一 push 事件自动触发
# - 手动触发：gh workflow run deploy-pages.yml
#
# 2026-09-28：GitHub Pages 部署已下线（原站 heliar-k.github.io/market-base 停在最后一次
# 部署，仅作冻结备份）。CF 侧走根路径（PAGES_BASE=""），wrangler 按内容哈希增量上传，
# 未变更文件不重传，部署秒级。
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "static/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# 数据 push 与手动 push 接近时串行执行，避免两个部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run 事件默认检出触发时的 main；显式指定避免部署旧 commit
          ref: main

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖

      - name: Install deps
        run: uv sync

      # CF Pages 走根路径，无 /market-base 子路径前缀
      - name: Build static site
        env:
          PAGES_BASE: ""
        run: uv run python -m src.export_pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy site --project-name=market-base
