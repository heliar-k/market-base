name: deploy-pages

# 静态站点预渲染 + GitHub Pages 部署（独立于 daily-fetch，可单独触发）：
# - daily-fetch / fetch-refresh 跑完 → workflow_run 触发（渲染最新数据）
#   注意：daily-fetch 的数据 push 用的是 GITHUB_TOKEN，GitHub 不会为它再触发 push 事件
#   （recursive workflow trigger 限制），所以必须用 workflow_run，光靠 paths: data/** 不生效
# - 手动 push static/src 改动 → push 事件自动触发（无需重跑数据拉取）
# - 手动触发：gh workflow run deploy-pages.yml
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "static/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["daily-fetch", "fetch-refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# 数据 push 与手动 push 接近时串行执行，避免两个部署互相覆盖
concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run 事件默认检出触发时的 main；显式指定避免部署旧 commit
          ref: main

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install deps
        run: uv sync

      - name: Build static site
        run: uv run python -m src.export_pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
