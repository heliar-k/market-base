name: deploy-pages

# 静态站点预渲染 + Cloudflare Pages 部署（独立于数据拉取，可单独触发）：
# - 数据 workflow（daily-fetch / fetch-refresh / fast-refresh / crypto-refresh）
#   commit 后显式 `gh workflow run deploy-pages.yml --ref main` 拉起部署。
#   不能靠 push 事件：数据 push 无论用 GITHUB_TOKEN 还是 DATA_PUSH_TOKEN，
#   都认证为 github-actions[bot]（App 身份），GitHub 递归保护不为其创建新 run
#  （实测 262 个 data commit 只触发过 1 次，且那次是本地手动 push）。
#   无数据变更时不 commit → 不 dispatch，空跑部署仍归零。
# - 手动 push 前端/后端改动 → push 事件 + paths 过滤自动触发
# - 手动触发：gh workflow run deploy-pages.yml --ref <分支>
#
# 部署链（工单 #11，ADR-0003）：export_pages 产 API JSON → frontend/public/api/
# → astro build（public/ 原样拷贝 + 编译 .astro 页）→ frontend/dist
# → wrangler pages deploy（内容哈希增量上传，未变更文件不重传，部署秒级）。
# 站点：https://market-base.pages.dev （根路径）。GitHub Pages 已下线（冻结备份）。
on:
  push:
    branches: [main]
    paths:
      # data/** 保留：人工本地提交数据时仍能自动部署（自动链靠上面的 dispatch）
      - "data/**"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# 数据 push 与手动 push 接近时串行执行，避免两个部署互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

jobs:
  deploy-pages:
    # 钉 24.04：消除 ubuntu-latest 2026-10-19 换代（Ubuntu 26）告警，与其余 workflow 统一；
    # 工具链已由 .nvmrc/package-lock/uv.lock 钉死，本 workflow 无 apt 步骤，风险低。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_dispatch 指定分支时构建该分支；push 触发时 github.ref 即 main
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖

      - name: Install deps
        run: uv sync

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      # API JSON 直落 frontend/public/api/（astro build 拷进 dist/；工单 #12 起
      # export_pages 仅剩 JSON 导出这一条链，PAGES_JSON_ONLY env 已退役）
      - name: Export API JSON
        run: uv run python -m src.export_pages

      - name: Build frontend (astro)
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4  # v3 声明 node20 已被 GitHub 强制迁移 node24（日志告警）；v4 原生 node24，默认 wrangler 升 v4；但 v4 新加了 accountId 的 env 覆写，见下方注释
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # 必须走 input，不能只靠上面的 workflow 级 env：v4 新增
          # `process.env.CLOUDFLARE_ACCOUNT_ID = getInput('accountId')`（v3.15 的 src 里没这行），
          # 不传 input 就会把继承来的真值覆成空串 → wrangler v4 只能走 auto-retrieve，
          # 报 "Failed to automatically retrieve account IDs for the logged in user"（run 36955755862）。
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=market-base
