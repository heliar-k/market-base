name: crypto-refresh

# 加密数据独立刷新（每小时全天候 7×24，UTC 每小时 12 分错峰）：
# OKX/Deribit/CME 衍生品、Coinglass 聚合快照、BTC 现货 ETF 资金流（Farside 日更，幂等空跑无害）。
# 从 fast-refresh 拆出（2026-09-29）：加密市场 7×24 交易，不该绑在「工作日盘中」的 cron 上——
# 之前周末/夜间只有 daily-fetch 一天一次，现在每小时均匀覆盖。
# daily-fetch 仍会兜底跑同三源（幂等）。
#
# 不需要 playwright（三源均为 API / Jina 抓取，无 Barchart 浏览器降级通道）。
# upsert 幂等：无新数据 → 不 commit → 不触发部署，空跑零成本。
# 部署：数据 commit 后显式 gh workflow run deploy-pages.yml——PAT push 认证为
# github-actions[bot]（App 身份），GitHub 递归保护不为其创建 workflow run（实测
# 262 个 data commit 只触发过 1 次，且那次是本地手动 push）。

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch: {}

# 与其余数据 workflow 共享 group：串行化 push 防 rebase 冲突（见 daily-fetch.yml 注释）
concurrency:
  group: data-fetch
  cancel-in-progress: false

jobs:
  refresh:
    # 钉 24.04：与 daily-fetch/fast-refresh 同一批数据 workflow，统一镜像版本避免
    # ubuntu-latest 2026-10-19 换代（Ubuntu 26）后行为不一致；本 workflow 无 apt 步骤，风险低。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # 数据 commit 后显式 dispatch deploy-pages（见下方「部署」注释）
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true   # uv.lock 已入库，按 lock 哈希缓存依赖

      - name: Install deps
        run: uv sync

      - name: Fetch crypto sources
        env:
          YF_NO_PROXY: "1"        # Actions 无 socks5 代理，yfinance 直连
        run: |
          set +e  # 单个失败不阻断，末尾统一判红
          for f in fetch_crypto_derivatives fetch_coinglass fetch_etf_flows; do
            echo "===== START $f ====="
            bash "bin/$f" || FAILED="$FAILED $f"
          done
          [ -n "$FAILED" ] && echo "失败:$FAILED" && echo "FAILED_LIST=$FAILED" >> "$GITHUB_ENV"
          exit 0

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes, skip commit"
          else
            NL=$'\n\n'
            MSG="data: crypto refresh ($(date -u "+%F %H:%M") UTC)"
            [ -n "$FAILED_LIST" ] && MSG="$MSG${NL}失败:$FAILED_LIST"
            git commit -m "$MSG"
            git pull --rebase origin main
            # PAT push 仅用于写入：commit 认证为 github-actions[bot]（App 身份），
            # GitHub 的递归保护不为其创建新 workflow run —— 部署靠下一步显式 dispatch
            git push "https://x-access-token:${{ secrets.DATA_PUSH_TOKEN }}@github.com/heliar-k/market-base.git" HEAD:main
            echo "DATA_PUSHED=1" >> "$GITHUB_ENV"
          fi

      # 部署：数据 push 不触发 push 事件（见上），所以有数据变更时显式拉起 deploy-pages。
      # 无新观测 → 不 commit → 不 dispatch，空跑仍归零（当初删 workflow_run 触发的初衷）。
      # --ref main：workflow_dispatch 不传 sha 时取默认分支 HEAD，已含本次数据 commit。
      - name: 触发 Pages 部署
        if: env.DATA_PUSHED == '1'
        run: gh workflow run deploy-pages.yml --ref main

      - name: 失败汇总（有失败则 job 红）
        if: env.FAILED_LIST != ''
        run: |
          echo "以下步骤失败，数据已照常 commit:$FAILED_LIST"
          exit 1
