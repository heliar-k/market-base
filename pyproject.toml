[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "market-base"
version = "0.1.0"
description = "Financial data pipeline + analysis base — stocks, indices, macro, options, futures with TUI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ib-insync>=0.9.86",
    "pandas>=3.0.3",
    "pandas-ta-classic>=0.6.52",
    "pyarrow>=17.0.0",
    "rich>=15.0.0",
    "fredapi>=0.5.1",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "yfinance>=0.2.40",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pysocks>=1.7.1",
    "xlrd>=2.0.2",
    "playwright>=1.62.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
