<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>债券 — 观澜台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script type="module" src="/js/site-nav.js"></script>
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>债券</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div id="cards" class="re-cards"></div>
  <div id="chart"></div>
  <div id="recent"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/echarts-theme.js"></script>
<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/assets/bonds');
  const cards = (d.cards || []).map(i => ({
    label: i.name,
    value: fmt(i.last),
    sub: `${chg(i.chg_pct)} · ${i.date}`,
  }));
  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="re-card"><div class="re-corridor-label">${c.label}</div>
    <div class="re-corridor-value">${c.value}</div><div class="re-card-sub">${c.sub}</div></div>`).join('');
  if (d.cards && d.cards.length) document.getElementById('re-as-of').textContent = R.asOf(d.cards[0].date);

  // 20 日相对涨跌图（期初=0%）+ 绝对值明细表
  const rc = d.recent || { dates: [], series: {} };
  const names = ['20年+国债ETF', '7-10年国债ETF', '投资级债券ETF', '高收益债券ETF'];
  const keys = Object.keys(rc.series);
  const shortNames = { TLT: 'TLT', IEF: 'IEF', LQD: 'LQD', HYG: 'HYG' };
  // recent 为最新在前倒序（明细表口径）；图改时间正序，并把绝对价归一为期初=0% 的相对涨跌，
  // 否则 TLT(~90) 与 HYG(~80) 的绝对价曲线挤在一起看不出相对强弱
  const cdates = [...rc.dates].reverse();
  const norm = k => {
    const arr = [...(rc.series[k] || [])].reverse();
    const base = arr.find(v => v != null && v !== 0);
    return arr.map(v => (v == null || base == null) ? null : +(((v / base) - 1) * 100).toFixed(2));
  };
  const csec = document.createElement('div');
  csec.className = 're-section';
  csec.innerHTML = '<h2>近期相对涨跌（最近 20 个交易日，期初 = 0%）</h2><div class="chart" id="bond-chart" style="height:280px"></div>';
  document.getElementById('chart').appendChild(csec);
  R.mkChart('bond-chart', colors => R.lineOption({
    tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '—' : Number(v).toFixed(2) + '%' },
    // 图例色标由 reSyncLegend 按 series 线型自动出（实/虚/点/点划线），无需手写
    legend: { data: keys, top: 0, itemGap: 10 },
    grid: { left: 44, right: 16, top: 28, bottom: 28 },
    xAxis: { type: 'category', data: cdates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 10 } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, fontSize: 11, formatter: v => v + '%' }, splitLine: { lineStyle: { color: colors.grid } } },
    series: keys.map((k, i) => ({
      name: k, type: 'line', data: norm(k), showSymbol: false, smooth: true,
      // 顶层 color 同步给图例 icon（icon 不读 lineStyle.color，只读 series.color）
      color: [colors.blue, colors.orange, colors.green, colors.red][i % 4],
      // 线型差异（实线/虚线/点线/点划线）+ 粗细分层，不依赖颜色也能区分（色盲友好）
      lineStyle: { width: [2.5, 2, 2, 2][i], type: ['solid', 'dashed', 'dotted', [6, 3, 2, 3]][i], color: [colors.blue, colors.orange, colors.green, colors.red][i % 4] },
      // 0% 基准线（只挂第一个 series，避免图例重复）
      ...(i === 0 ? { markLine: { silent: true, symbol: 'none', label: { show: false }, data: [{ yAxis: 0 }], lineStyle: { color: colors.border, type: 'dashed' } } } : {}),
    })),
  }, colors));

  const rows = rc.dates.map((dt, i) => {
    const row = { 日期: dt };
    keys.forEach(k => { row[k] = rc.series[k][i]; });
    return row;
  });
  const rsec = document.createElement('div');
  rsec.className = 're-section';
  rsec.innerHTML = '<h2>收盘价明细</h2>';
  const fmts = { 日期: v => v };
  keys.forEach(k => { fmts[k] = v => fmt(v); });
  rsec.appendChild(R.table(['日期'].concat(keys), rows, fmts));
  document.getElementById('recent').appendChild(rsec);

  document.getElementById('re-gen').textContent = '数据源：Yahoo Finance 日频快照 · 口径为收盘价';
}

function fmt(v) { return v == null ? '—' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function chg(v) { return v == null ? '—' : `<span style="color:${v >= 0 ? 'var(--color-up)' : 'var(--color-down)'}">${v >= 0 ? '▲ +' : '▼ '}${Number(v).toFixed(2)}%</span>`; }

load().catch(e => R.fail(['cards', 'chart', 'recent'], e));
</script>
<script type="module" src="/js/nav.js"></script>
</body>
</html>
