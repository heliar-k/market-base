<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="观澜台 — 美股与宏观研究平台：K 线技术面、GEX 期权墙、利率/流动性/信用/通胀专题仪表盘。">
<meta property="og:type" content="website">
<meta property="og:title" content="观澜台 — US Macro 研究平台">
<meta property="og:description" content="每日更新的美股/指数/期权/期货技术面与宏观专题研判。">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111217" media="(prefers-color-scheme: dark)">
<title>观澜台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 异步加载字体：同步 stylesheet 在 fonts.googleapis.com 不可达时会阻塞首屏到 TCP 超时
     （同 TopicLayout，理由与回退链说明见那边） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/app.css">
<style>
/* 首屏「今日一句话」结论层（issue #21，渲染在 js/dashboard.js 的 renderLines）。
   页面私有样式块（不动 css/*.css）；颜色一律走变量，color: 只用文字档。 */
.dash-lines .dash-card { gap: 2px; padding: 12px 16px; }
.dash-line {
  display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; gap: 8px;
  align-items: baseline; padding: 4px 0;
  border-bottom: 1px solid var(--border-light); font-size: 13px; text-decoration: none;
}
.dash-line:last-child { border-bottom: none; }
a.dash-line:hover { background: var(--surface-hover); }
a.dash-line:hover .dash-line-text { text-decoration: underline; }
.dash-line-label { color: var(--text-secondary); font-weight: 600; }
.dash-line-text { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dash-line-go { color: var(--text-dim); }
.dash-line-empty { font-size: 13px; color: var(--text-secondary); }
.dash-line-empty code { font-family: var(--font-mono); }
</style>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/js/echarts-theme.js"></script>
<script src="/js/rates-common.js"></script>
<script type="module" src="/js/site-nav.js"></script>
</head>
<body>
<!-- 主题提前应用（修 SPA 首屏白闪）：app.js 是 type="module"（deferred），其 applyTheme 要等文档
     解析完才执行 → 暗色用户每次先白一下。这里在 body 开标签后立刻打 dark class（CSS 钩子是
     body.dark，head 里 document.body 还不存在，故不能前移到 head）。
     判定与 TopicLayout.astro 的提前脚本同源（同 DARK_KEY、同 body.dark 钩子）：顶层页跟随系统
     prefers-color-scheme（app.js 初始也是这个口径，manual 仅会话内生效、刷新恢复自动），
     app.js 稍后再应用一次值一致不闪；它同时写 localStorage 以同步内嵌专题 iframe。 -->
<script>
document.body.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
</script>

<a class="skip-link" href="#app-main">跳过导航，直达主区</a>

<!-- 全局左侧导航（macro-view.js 渲染） -->
<button id="macro-nav-toggle" title="展开导航">☰</button>
<div class="macro-nav" id="macro-nav"><div class="loading">加载中…</div></div>
<div class="macro-nav-backdrop" id="macro-nav-backdrop"></div>

<div class="app" data-view="dashboard">
  <!-- Left sidebar (tech only) -->
  <div class="sidebar">
    <div class="sidebar-content">
      <div class="symbol-list" id="symbol-list"><div class="loading">加载中…</div></div>
    </div>
  </div>
  <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="收起/展开标的列表">◀</button>

  <!-- Center -->
  <div class="center" id="app-main" tabindex="-1">
    <!-- Dashboard -->
    <div class="dashboard-view">
      <div class="loading">加载中…</div>
    </div>

    <!-- Tech view -->
    <div class="tech-view" style="flex-direction:column;gap:8px;flex:1">
      <div class="controls" id="controls">
        <label><input type="checkbox" data-ma="MA5" checked> <span style="color:var(--chart-cyan)">MA5</span></label>
        <label><input type="checkbox" data-ma="MA10" checked> <span style="color:var(--color-brand)">MA10</span></label>
        <label><input type="checkbox" data-ma="MA20" checked> <span style="color:var(--color-warn)">MA20</span></label>
        <label><input type="checkbox" data-ma="MA60" checked> <span style="color:var(--chart-purple)">MA60</span></label>
        <label><input type="checkbox" data-ma="MA120"> <span style="color:var(--color-neutral)">MA120</span></label>
        <label><input type="checkbox" data-ma="BB" checked> <span style="color:var(--chart-slate)">BB</span></label>
        <label><input type="checkbox" data-ma="ST"> <span style="color:var(--chart-pink)">SuperTrend</span></label>
        <span class="range-controls">
          <button class="range-btn active" data-range="365">365天</button>
          <button class="range-btn" data-range="90">90天</button>
          <button class="range-btn" data-range="0">全部</button>
        </span>
      </div>
      <div class="chart-card"><div id="main-chart"></div></div>
      <div class="chart-card"><div id="rsi-chart"></div></div>
      <div class="chart-card"><div id="macd-chart"></div></div>
    </div>

    <!-- Macro view -->
    <div class="macro-view" style="flex:1;flex-direction:column">
      <div class="chart-card" id="macro-chart-card" style="flex:1;display:flex;flex-direction:column"><div class="loading">加载中…</div></div>
    </div>

    <!-- Correlation view -->
    <div class="correlation-view" style="flex:1;flex-direction:column">
      <div class="chart-card" id="correlation-card" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
    </div>
  </div>

  <!-- Right panel (tech only) -->
  <div class="panel collapsed" id="diag-panel">
    <div class="panel-header" id="diag-header">诊断分析 <span class="toggle-icon">◀</span></div>
    <div id="diag-content"><div class="loading">请选择标的</div></div>
  </div>
</div>

<div class="status-bar">
  <span id="status-symbol">—</span>
  <span id="status-range"></span>
  <span id="status-count"></span>
  <span id="status-refresh"></span>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
