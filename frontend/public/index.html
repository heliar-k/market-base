<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="观澜台 — 美股与宏观研究平台：K 线技术面、GEX 期权墙、利率/流动性/信用/通胀专题仪表盘。">
<meta property="og:type" content="website">
<meta property="og:title" content="观澜台 — US Macro 研究平台">
<meta property="og:description" content="每日更新的美股/指数/期权/期货技术面与宏观专题研判。">

<title>观澜台</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 异步加载字体：同步 stylesheet 在 fonts.googleapis.com 不可达时会阻塞首屏到 TCP 超时
     （同 TopicLayout，理由与回退链说明见那边） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/app.css">
<style>
/* 仪表盘 B 方案「每日头版」私有样式（不动 css/*.css）；颜色一律走变量，color: 只用文字档。
   DOM 顺序 = 手机阅读优先级；桌面 ≥1024 由 .dash-flow 的 areas 图重排成
   「头条 → 叙事×数据双栏 → 快照大表 → 自选」。 */

/* ── 头版 flow：DOM 顺序 = 手机阅读优先级（hero → vol → snap → lines → watch）。
   <1024：列容器 display:contents 溶解，用 order 恢复优先级；
   ≥1024：两个列容器实化 —— 左 60% = 叙事+快照，右 40% = 波动率+自选，
   高度各自堆叠不留洞（grid 行高取 max 的洞问题用 flex 列规避） ── */
.dash-flow { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.dash-col { display: contents; }
.dash-hero { order: 0; }
.dash-vol-sec { order: 1; }
.dash-snap-sec { order: 2; }
.dash-lines-sec { order: 3; }
.dash-watch-sec { order: 4; }
@media (min-width: 1024px) {
  .dash-flow { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 26px 24px; }
  .dash-hero { order: 0; flex: 1 1 100%; }
  .dash-col { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
  .dash-col-a { order: 1; flex: 1 1 calc(60% - 24px); }
  .dash-col-b { order: 2; flex: 1 1 calc(40% - 24px); }
  /* 列内按 DOM 序堆叠，清掉 <1024 的 order 优先级（否则一句话沉底） */
  .dash-col > * { order: 0; }
}

/* ── 头条区：结论与证据分层。状态一行 15px（cons-state 色档单源，不再大字），
   投票降为两行文本链（名字次色 + 语义色勾叉），无胶囊无多余边框 ── */
.dash-hero { display: flex; flex-direction: column; gap: 10px; }
.dash-hero-status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.dash-hs small { font-size: 12.5px; font-weight: 400; color: var(--text-secondary); margin-right: 5px; }
.dash-hs-sep { color: var(--text-dim); }
.dash-hero-votes { display: flex; flex-direction: column; gap: 2px; }
.dash-hv-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.dash-hv-group > small { font-size: 11px; color: var(--text-dim); margin-right: 2px; }
.dash-hv-member { font-size: 11.5px; color: var(--text-secondary); text-decoration: none; padding: 5px 2px; }
.dash-hv-member:hover { color: var(--accent-ink); }
.dash-hv-member i { font-style: normal; font-weight: 700; margin-left: 3px; }
.dash-hv-member--on i { color: var(--up); }
.dash-hv-member--off i { color: var(--down); }
.dash-hv-member--abst i { color: var(--text-dim); }
.dash-hv-member--absent { opacity: .45; }
.dash-hv-member--absent i { color: var(--text-dim); }
.dash-hero-na { font-size: 13px; color: var(--text-secondary); }
.dash-hero-scen { font-size: 14px; font-weight: 600; color: var(--text); }
.dash-hero-scen.hot { color: var(--warning); }
.dash-hero-alert { font-size: 12.5px; color: var(--warning); }
/* 背景行：弱化脚注，分隔点由 ::before 统一画（空段自动隐藏） */
.dash-hero-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--text-dim); }
.dash-hero-meta > *:empty { display: none; }
.dash-hero-meta > * + *:not(:empty)::before { content: '·'; margin-right: 10px; opacity: .55; }
.dash-hero-meta a { color: var(--text-dim); text-decoration: none; padding: 2px 0; }
.dash-hero-meta a:hover { color: var(--accent-ink); }
/* 背景行内部（FOMC/衰退/入口）与两段之间统一由 ::before 画分隔点 */
#dash-hero-bg > * + *::before { content: '·'; margin-right: 10px; opacity: .55; }

/* ── 节头（波动率 / 市场快照 / 今日一句话 / 自选 共用）── */
.dash-sec-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); padding: 0 2px; }
.dash-sec-link { font-size: 12px; font-weight: 400; color: var(--text-dim); text-decoration: none; padding: 5px 0; }
.dash-sec-link:hover { color: var(--accent-ink); }

/* ── 波动率列：KPI 2×2（R.cards 行的作用域换行，不另造卡片）+ 信号列表 ── */
.dash-vol-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dash-vol-sec .re-cards { flex-wrap: wrap; }
.dash-vol-sec .re-card { flex: 1 1 calc(50% - 6px); max-width: none; }
.dash-sig-list { display: flex; flex-direction: column; }
.dash-sig { display: flex; flex-direction: column; gap: 4px; padding: 10px 2px; }
.dash-sig + .dash-sig { border-top: 1px solid var(--border-light); }
.dash-sig-title { font-size: 13px; font-weight: 600; color: var(--text); }
.dash-sig-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; }
.dash-sig-advice { font-size: 11.5px; font-style: italic; color: var(--text-dim); }

/* ── 市场快照单表：报纸行情栏（分栏 + 栏间线，板块不跨栏断开）。
   注意必须 display:block：dash-card 的 flex 会吃掉 multicol ── */
.dash-snap-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dash-snap-table { display: block; padding: 4px 20px 10px; columns: 1; }
@media (min-width: 768px) {
  .dash-snap-table { columns: 2; column-gap: 36px; column-rule: 1px solid var(--border-light); }
}
.dash-board { break-inside: avoid; padding: 10px 0 12px; }
.dash-board + .dash-board { border-top: 1px solid var(--border-light); }
.dash-board-head { display: flex; align-items: baseline; gap: 8px; padding: 0 4px 4px; }
.dash-board-t { font-size: 13px; font-weight: 700; color: var(--text); text-decoration: none; }
a.dash-board-t:hover { color: var(--accent-ink); }
.dash-board-more { display: flex; align-items: center; min-height: 24px; font-size: 11.5px; color: var(--text-dim); text-decoration: none; padding: 4px 2px 0; margin-top: 6px; }
.dash-board-more:hover { color: var(--accent-ink); }

/* ── 今日一句话：hot 卡（保留语义色竖条）+ 平稳弱化索引 ── */
.dash-lines-sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dash-lines { display: flex; flex-direction: column; gap: 10px; }
.dash-line-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
  gap: 12px; align-items: start;
}
.dash-line-card {
  display: flex; flex-direction: column; gap: 6px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-light); border-radius: 8px;
  text-decoration: none; transition: background .15s, border-color .15s;
}
.dash-line-card.hot { border-left-color: var(--color-warn); }
.dash-line-card.hot .dash-line-card-t { color: var(--warning); }
.dash-line-card:hover { background: var(--surface-hover); border-color: var(--accent-ink); }
.dash-line-card:hover .dash-line-card-x { text-decoration: underline; }
.dash-line-card-t { font-size: 13px; font-weight: 600; color: var(--text); }
.dash-line-card-x { font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); }
.dash-line-card-go { font-size: 11px; color: var(--text-dim); margin-top: auto; padding-top: 4px; }
.dash-line-empty { font-size: 13px; color: var(--text-secondary); }
.dash-line-empty code { font-family: var(--font-mono); }

/* ── 自选清单：chips 一行（点击进技术分析，× 删除）── */
.dash-watch-sec { display: flex; flex-direction: column; gap: 8px; }
.dash-watch-add-wrap select { font-size: 12px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; }
.dash-watch-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px; }
.dash-watch-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 8px 5px 12px; border: 1px solid var(--border); border-radius: 999px;
  font-size: 12.5px; background: var(--surface); cursor: pointer; transition: background .15s, border-color .15s;
}
.dash-watch-chip:hover { border-color: var(--accent-ink); background: var(--surface-hover); }
.dash-watch-chip-sym { font-weight: 600; color: var(--text); }
.dash-watch-chip-price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
.dash-watch-x {
  width: 22px; height: 22px; border: none; border-radius: 50%;
  background: transparent; color: var(--text-dim); font-size: 14px; line-height: 1;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.dash-watch-x:hover { background: var(--surface-hover); color: var(--down); }
@media (hover: none) { .dash-watch-x { width: 24px; height: 24px; } }
.dash-watch-empty { font-size: 12.5px; color: var(--text-dim); padding: 4px 2px; }

/* ── 手机端 sticky 细条：滚过头条后滑入（桌面隐藏）── */
.dash-sticky { position: sticky; top: 0; z-index: 30; height: 0; overflow: visible; }
@media (min-width: 1024px) { .dash-sticky { display: none; } }
.dash-sticky-in {
  display: flex; align-items: center; gap: 12px;
  margin: 0 -4px; padding: 8px 16px; font-size: 12px;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  transform: translateY(-110%); transition: transform .25s ease;
}
.dash-sticky.show .dash-sticky-in { transform: translateY(0); }
.dash-sticky-in .cons-state { font-size: 12.5px; font-weight: 700; }
#dash-sticky-verdict { display: inline-flex; align-items: baseline; gap: 6px; }
.dash-sticky-macro, .dash-sticky-alert { color: var(--text-secondary); }
.dash-sticky-vix { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text); }
</style>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/vendor/echarts.min.js"></script>
<script src="/js/echarts-theme.js"></script>
<script src="/js/rates-common.js"></script>
<script type="module" src="/js/site-nav.js"></script>
</head>
<body>
<!-- 主题提前应用（修 SPA 首屏白闪）：app.js 是 type="module"（deferred），其 applyTheme 要等文档
     解析完才执行 → 暗色用户每次先白一下。这里在 body 开标签后立刻打 dark class（CSS 钩子是
     body.dark，head 里 document.body 还不存在，故不能前移到 head）。
     判定与 TopicLayout.astro 的提前脚本同源（同 DARK_KEY、同 body.dark 钩子）：顶层页跟随系统
     prefers-color-scheme（app.js 初始也是这个口径，manual 仅会话内生效、刷新恢复自动），
     app.js 稍后再应用一次值一致不闪；它同时写 localStorage，供整页跳过去的专题页延续手动主题。 -->
<script>
document.body.classList.toggle('dark', window.matchMedia('(prefers-color-scheme: dark)').matches);
</script>

<a class="skip-link" href="#app-main">跳过导航，直达主区</a>

<!-- 全局左侧导航（macro-view.js 渲染） -->
<button id="macro-nav-toggle" title="展开导航">☰</button>
<div class="macro-nav" id="macro-nav"><div class="loading">加载中…</div></div>
<div class="macro-nav-backdrop" id="macro-nav-backdrop"></div>

<div class="app" data-view="dashboard">
  <!-- Left sidebar (tech only) -->
  <div class="sidebar">
    <div class="sidebar-content">
      <div class="symbol-list" id="symbol-list"><div class="loading">加载中…</div></div>
    </div>
  </div>
  <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" title="收起/展开标的列表">◀</button>

  <!-- Center -->
  <div class="center" id="app-main" tabindex="-1">
    <!-- Dashboard -->
    <div class="dashboard-view">
      <div class="loading">加载中…</div>
    </div>

    <!-- Tech view -->
    <div class="tech-view" style="flex-direction:column;gap:8px;flex:1">
      <div class="controls" id="controls">
        <label><input type="checkbox" data-ma="MA5" checked> <span style="color:var(--chart-cyan)">MA5</span></label>
        <label><input type="checkbox" data-ma="MA10" checked> <span style="color:var(--color-brand)">MA10</span></label>
        <label><input type="checkbox" data-ma="MA20" checked> <span style="color:var(--color-warn)">MA20</span></label>
        <label><input type="checkbox" data-ma="MA60" checked> <span style="color:var(--chart-purple)">MA60</span></label>
        <label><input type="checkbox" data-ma="MA120"> <span style="color:var(--color-neutral)">MA120</span></label>
        <label><input type="checkbox" data-ma="BB" checked> <span style="color:var(--chart-slate)">BB</span></label>
        <label><input type="checkbox" data-ma="ST"> <span style="color:var(--chart-pink)">SuperTrend</span></label>
        <span class="range-controls">
          <button class="range-btn active" data-range="365">365天</button>
          <button class="range-btn" data-range="90">90天</button>
          <button class="range-btn" data-range="0">全部</button>
        </span>
      </div>
      <div class="chart-card"><div id="main-chart"></div></div>
      <div class="chart-card"><div id="rsi-chart"></div></div>
      <div class="chart-card"><div id="macd-chart"></div></div>
    </div>

    <!-- Correlation view -->
    <div class="correlation-view" style="flex:1;flex-direction:column">
      <div class="chart-card" id="correlation-card" style="flex:1;display:flex;flex-direction:column;overflow:hidden"></div>
    </div>
  </div>

  <!-- Right panel (tech only) -->
  <div class="panel collapsed" id="diag-panel">
    <div class="panel-header" id="diag-header">诊断分析 <span class="toggle-icon">◀</span></div>
    <div id="diag-content"><div class="loading">请选择标的</div></div>
  </div>
</div>

<div class="status-bar">
  <span id="status-symbol">—</span>
  <span id="status-range"></span>
  <span id="status-count"></span>
  <span id="status-refresh"></span>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
