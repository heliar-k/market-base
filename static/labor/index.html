<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就业 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>就业</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div id="cards"></div>
  <div id="re-signals"></div>
  <div id="history"></div>
  <div id="indicators"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/labor/overview');
  document.getElementById('re-as-of').textContent = '数据截至 ' + d.as_of;

  // ── 卡片行 ──
  const c = d.cards;
  document.getElementById('cards').appendChild(R.cards([
    { label: '失业率', value: c.unrate.value + '%', sub: c.unrate.as_of + (c.unrate.chg_3m !== null ? ` · 3M ${c.unrate.chg_3m > 0 ? '+' : ''}${c.unrate.chg_3m}pp` : '') + (c.unrate.sahm !== null ? ` · Sahm ${c.unrate.sahm}` : ''), accent: true },
    { label: '新增非农（近月）', value: c.nfp.value + 'K', sub: c.nfp.as_of + ` · 3M 均值 ${c.nfp.avg_3m}K` },
    { label: '初请失业金（周）', value: c.icsa.value + 'K', sub: c.icsa.as_of + ` · 4W 均值 ${c.icsa.avg_4w}K` },
    { label: 'JOLTS 职位空缺', value: (c.jolts.value ?? '—') + 'M', sub: (c.jolts.as_of || '') + (c.jolts.vu !== null ? ` · V/U ${c.jolts.vu}` : '') },
  ]));

  // ── 研判（三段式） ──
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>就业研判</h2>';
  (d.signals || []).forEach(s => {
    const b = document.createElement('div');
    b.className = 'sig-block';
    b.innerHTML = `<div class="sig-title">${s.title}</div><p>${s.text}</p>`;
    sec.appendChild(b);
  });
  sec.innerHTML += '<div class="note">rule-based · no direct price forecast</div>';
  document.getElementById('re-signals').appendChild(sec);

  // ── NFP bar + 失业率 line ──
  const hsec = document.createElement('div');
  hsec.className = 're-section';
  hsec.innerHTML = '<h2>非农月度新增 vs 失业率（近 3 年）</h2><div id="nfp-chart" style="height:340px"></div>';
  document.getElementById('history').appendChild(hsec);
  const h = d.nfp_history;
  R.mkChart('nfp-chart', (colors) => ({
    legend: { top: 4, right: 8, textStyle: { color: colors.text } },
    grid: { left: '3%', right: '3%', bottom: 24, top: 36, containLabel: true },
    xAxis: { type: 'time', axisLabel: { color: colors.text } },
    yAxis: [
      { type: 'value', name: 'NFP (K)', axisLabel: { color: colors.text }, splitLine: { lineStyle: { color: colors.grid } } },
      { type: 'value', name: '失业率', min: 3, max: 6, axisLabel: { color: colors.text, formatter: '{value}%' }, splitLine: { show: false } },
    ],
    tooltip: { trigger: 'axis' },
    series: [
      { name: 'NFP', type: 'bar', data: h.dates.map((dt, i) => [dt, h.nfp[i]]), itemStyle: { color: colors.blue } },
      { name: '失业率', type: 'line', yAxisIndex: 1, showSymbol: false, data: h.dates.map((dt, i) => [dt, h.unrate[i]]), lineStyle: { width: 1.5 }, itemStyle: { color: colors.orange } },
    ],
  }));

  // ── 指标明细 ──
  const tsec = document.createElement('div');
  tsec.className = 're-section';
  tsec.innerHTML = '<h2>就业指标明细</h2><p style="margin:0">初请为周频（较 4 周前），ECI 为季频（较上季），其余月频（较上月）。</p>';
  tsec.appendChild(R.table(['指标', '最新', '较上期', '数据日期'],
    d.indicators.map(x => ({ 指标: x.name, 最新: x.value, 较上期: x.chg, 数据日期: x.as_of, unit: x.unit })),
    {
      最新: (v, r) => `${v.toLocaleString()}${r.unit === '指数' ? '' : r.unit}`,
      较上期: v => v === null ? '—' : `${v > 0 ? '+' : ''}${v.toLocaleString()}`,
    }, ['指标', '最新', '较上期', '数据日期']));
  document.getElementById('indicators').appendChild(tsec);

  document.getElementById('re-gen').textContent = `研判由规则引擎生成（${d.generator}）· ${d.as_of} · NFP = PAYEMS 一阶差分；V/U = JOLTS 空缺 / 失业人数`;
}
load().catch(e => R.fail(['cards', 're-signals', 'history', 'indicators'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
