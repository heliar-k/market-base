<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美元流动性压力指数 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>美元流动性压力指数</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>
  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc"></div>

  <div id="re-score"></div>
  <div id="re-layers"></div>
  <div class="re-h2" id="sec-history">压力指数历史走势（近 30 个快照）</div>
  <div class="re-chart" id="history_chart" style="height:220px"></div>
  <div class="re-h2" id="sec-confirm">升级为系统性压力的确认条件</div>
  <div id="re-confirm"></div>
  <div class="re-h2" id="sec-offshore">离岸美元压力 &amp; 外部冲击</div>
  <div id="re-offshore"></div>
  <div class="re-h2" id="sec-evidence">证据层：传导链拆解</div>
  <div id="re-evidence"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
const BAND_COLORS = { 宽松: '#26a69a', 中性: '#3b82f6', 警戒观察: '#ff9800', 压力确认: '#ef5350' };
const bandBadge = (band) => {
  const [label, colorKey] = band;
  const c = BAND_COLORS[label] || '#999';
  return `<span style="display:inline-block;padding:2px 12px;border-radius:999px;border:1px solid ${c}66;background:${c}18;color:${c};font-size:13px;margin-left:14px">${label}</span>`;
};
const scoreCell = v => (v == null ? '—' : `<b>${v}</b>`);

async function load() {
  document.getElementById('page-toc').innerHTML = [
    ['指数', 're-score'], ['三层评分', 're-layers'], ['历史走势', 'sec-history'], ['确认条件', 'sec-confirm'],
    ['离岸/外部', 'sec-offshore'], ['证据层', 'sec-evidence'],
  ].map(([t, id]) => `<a href="#${id}">${t}</a>`).join('');

  const d = await R.get('/api/liquidity/transmission-chain');
  document.getElementById('re-as-of').textContent = d.data_date ? `数据截至 ${d.data_date}` : '';

  // ── 主评分卡 ──
  const score = document.createElement('div');
  score.className = 'score-card';
  score.innerHTML = `
    <div>
      <div class="label">规则型美元流动性压力指数 LPI</div>
      <div class="value" style="color:${BAND_COLORS[d.band[0]] || 'var(--text)'}">${d.score ?? '—'}<span style="font-size:20px;color:var(--text-dim)">/10</span></div>
      ${bandBadge(d.band)}
      <div style="font-size:12px;color:var(--text-dim);margin-top:8px">结构性缓冲 45% + 融资市场确认 35% + 风险资产传导 20%${d.pctile_30d != null ? ' · 过去 30 天第 ' + d.pctile_30d + ' 分位' : ''}</div>
    </div>
    <div style="flex:1;min-width:260px;font-size:13px;line-height:1.7;color:var(--text-secondary)">
      评分边界：0-3 宽松 · 3-5 中性 · 5-7 警戒观察 · 7+ 压力确认。
      LPI 是规则型监测指数而非危机概率模型；总分受融资市场与风险资产确认约束，
      能源/地缘仅作外部冲击输入。阈值与权重为研究规则，尚未做完整历史统计校准——优势是透明、可解释、可复盘。
    </div>`;
  document.getElementById('re-score').appendChild(score);

  // ── 三层评分 ──
  const layers = d.layers || {};
  const layerCard = (key, title, desc) => {
    const L = layers[key] || {};
    const pct = (L.weight * 100).toFixed(0);
    const parts = (L.parts || []).map(p =>
      `<div class="oas-card" style="flex:1;min-width:150px">
        <div class="label">${p.name}</div>
        <div class="value">${scoreCell(p.score)}<span class="unit">/10</span></div>
        <div class="pcts">${p.value == null ? '—' : (typeof p.value === 'number' ? p.value.toFixed(2) : p.value)}</div>
      </div>`).join('');
    const c = L.score >= 7 ? '#ef5350' : L.score >= 5 ? '#ff9800' : L.score >= 3 ? '#3b82f6' : '#26a69a';
    return `<div class="oas-row" style="margin-bottom:12px">
      <div style="grid-column:1/-1">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:14px;font-weight:700">${title} <span style="color:var(--text-dim);font-weight:400">(${pct}%)</span></span>
          <span style="font-size:18px;font-weight:700;color:${c}">${L.score ?? '—'}<span style="font-size:12px;color:var(--text-dim)">/10</span></span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;margin:6px 0 12px">
          <div style="height:6px;width:${(L.score || 0) * 10}%;background:${c};border-radius:3px"></div>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">${desc}</div>
        <div class="oas-row">${parts}</div>
      </div>
    </div>`;
  };
  document.getElementById('re-layers').innerHTML =
    layerCard('structure', '结构性缓冲压力', '系统水位是不是变薄？准备金 / 净流动性 / TGA-RRP 缓冲') +
    layerCard('funding', '融资市场确认', '缺钱有没有出现在融资市场？Repo 定价 / SRF / 离岸美元 basis') +
    layerCard('transmission', '风险资产传导', '市场有没有开始承认压力？VIX / MOVE / 信用利差 / NFCI');

  // ── LPI 历史走势（快照积累，<2 点显示占位）──
  const hist = d.history || [];
  if (hist.length >= 2) {
    R.mkChart('history_chart', c => ({
      xAxis: { type: 'time', axisLabel: { color: c.muted } },
      yAxis: { type: 'value', min: 0, max: 10, axisLabel: { color: c.muted }, splitLine: { lineStyle: { color: c.grid } } },
      grid: { left: 40, right: 20, bottom: 28, top: 20 },
      tooltip: { trigger: 'axis' },
      series: [{ type: 'line', data: hist.map(p => [p.date, p.value]),
        lineStyle: { color: c.orange, width: 2 }, itemStyle: { color: c.orange }, symbolSize: 6 }],
    }));
  } else {
    document.getElementById('history_chart').innerHTML =
      `<div class="re-error">快照积累中（当前 ${hist.length} 条）—— daily-fetch 每日自动写入，2 条后显示走势、10 条后显示分位。</div>`;
  }

  // ── 确认条件 ──
  const conf = d.confirmations || [];
  document.getElementById('re-confirm').innerHTML =
    `<div class="re-section">` + conf.map(x =>
      `<div style="display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:13px">
        <span style="color:${x.met ? '#26a69a' : '#9ca3af'};font-weight:700">${x.met ? '●' : '○'}</span>
        <span style="color:var(--text)">${x.title}</span>
        <span style="color:var(--text-dim);font-size:12px">${x.detail || ''}</span>
      </div>`).join('') +
      `<p style="margin:8px 0 0;font-size:12px;color:var(--text-dim)">以上任一条件满足即说明压力从结构性偏紧升级为系统性；当前全部未确认 → 更适合等待确认信号，而不是直接按危机交易。</p></div>`;

  // ── 离岸 + 外部 ──
  const off = d.offshore || {};
  const PAIR_DISPLAY = { USDJPY: 'USD/JPY', USDCNH: 'USD/CNH', EURUSD: 'EUR/USD', GBPUSD: 'GBP/USD', USDCHF: 'USD/CHF' };
  const offRows = Object.entries(off).map(([pair, v]) => ({ pair: PAIR_DISPLAY[pair] || pair, ...v }));
  const fmtPips = v => (v == null ? '—' : v.toFixed(1));
  const offWrap = document.createElement('div');
  const t = R.table(
    ['货币对', '1W', '1M', '3M', '6M', '1Y'],
    offRows,
    { '1W': fmtPips, '1M': fmtPips, '3M': fmtPips, '6M': fmtPips, '1Y': fmtPips },
    ['pair', '1W', '1M', '3M', '6M', '1Y'],
  );
  const note = document.createElement('div');
  note.className = 're-section';
  note.style.marginTop = '12px';
  note.innerHTML = `<h2>外部冲击输入</h2><p style="margin:0">WTI ${(d.external?.wti ?? 0).toFixed(2)} 美元 · 能源与地缘为外生冲击层：通过通胀预期、保证金和离岸美元需求给系统加压，但不是美元融资压力本身，调整系数 +${d.external?.adjust ?? 0.0}（不参与加权）。${d.external?.note || ''}</p>`;
  const ws = document.createElement('div');
  ws.className = 're-section';
  ws.innerHTML = `<h2>离岸美元压力基底</h2><p style="margin:0">负值 = 美元融资成本高于本币（美元稀缺）｜正值 = 美元相对充裕。当前离岸评分 <b>${d.layers?.funding?.parts?.[3]?.score ?? '—'}</b>/10；多货币对同时转弱才说明美元稀缺在扩散。</p>`;
  ws.appendChild(t);
  offWrap.append(ws, note);
  document.getElementById('re-offshore').appendChild(offWrap);

  // ── 证据层 ──
  const e = d.evidence || {};
  const evSection = (title, html) =>
    `<div class="re-section" style="margin-bottom:12px"><h2>${title}</h2>${html}</div>`;
  let ev = '';
  if (e.balancesheet) {
    ev += evSection('银行资产负债表', `<p style="margin:0">银行准备金 <b>${e.balancesheet.reserves_b ?? '—'}</b> 十亿（4周 ${(e.balancesheet.reserves_4w_pct ?? 0) >= 0 ? '+' : ''}${(e.balancesheet.reserves_4w_pct ?? 0).toFixed(2)}%）；净流动性 <b>${e.balancesheet.net_liquidity_b ?? '—'}</b> 十亿；10Y 国债 ${(e.balancesheet.dgs10 ?? 0).toFixed(2)}%。缓冲垫在变薄 ≠ 银行体系缺钱。</p>`);
  }
  if (e.repo) {
    ev += evSection('在岸 Repo 市场', `<p style="margin:0">SOFR <b>${(e.repo.sofr ?? 0).toFixed(2)}%</b>；SOFR−IORB <b>${e.repo.sofr_iorb_bp ?? '—'}bp</b>（${(e.repo.sofr_iorb_bp ?? 0) < 0 ? '充裕' : '偏紧'}）；RRP 余额 ${e.repo.rrp_b ?? '—'} 十亿；SRF 使用 ${e.repo.srf_m ?? 0} 百万。Repo 是最直接的确认层：只有 SOFR−IORB 转正、SRF 使用或尾部 SOFR 抬升才代表真实融资压力。</p>`);
  }
  if (e.energy) {
    ev += evSection('能源（外生）', `<p style="margin:0">WTI <b>${(e.energy.wti ?? 0).toFixed(2)}</b>（5日 ${(e.energy.wti_5d_pct ?? 0) >= 0 ? '+' : ''}${(e.energy.wti_5d_pct ?? 0).toFixed(1)}%）；天然气 ${e.energy.ng ?? '—'}。先看油价是否站上关键位、波动是否维持，再看冲击是否传到 CNH/JPY basis。</p>`);
  }
  if (e.intermediary) {
    ev += evSection('中介能力', `<p style="margin:0">VIX <b>${(e.intermediary.vix ?? 0).toFixed(2)}</b>；MOVE <b>${(e.intermediary.move ?? 0).toFixed(0)}</b>；HY OAS(BB) <b>${(e.intermediary.bb_oas ?? 0).toFixed(0)}bp</b>；IG OAS <b>${(e.intermediary.ig_oas ?? 0).toFixed(0)}bp</b>；NFCI <b>${e.intermediary.nfci ?? '—'}</b>（${(e.intermediary.nfci ?? 1) < 0 ? '宽松' : '收紧'}）。该层分数低说明风险资产还没承认上游压力。</p>`);
  }
  if (e.prices) {
    ev += evSection('资产价格反应', `<p style="margin:0">SPX <b>${(e.prices.spx ?? 0).toLocaleString()}</b>；10Y <b>${(e.prices.dgs10 ?? 0).toFixed(2)}%</b>；DXY <b>${(e.prices.dxy ?? 0).toFixed(2)}</b>；黄金 <b>${(e.prices.gold ?? 0).toLocaleString()}</b>；BTC <b>${(e.prices.btc ?? 0).toLocaleString()}</b>。资产价格是结果层，不参与加权，用于验证压力是否已传导。</p>`);
  }
  document.getElementById('re-evidence').innerHTML = ev;

  document.getElementById('re-gen').textContent =
    '数据源：FRED（H.4.1 / SOFR 分位 / ICE BofA OAS / NFCI）· NY Fed SRF · CFETS 掉期点 · CBOE VIX · yfinance（MOVE/WTI/SPX/DXY）· 评分规则透明可复盘';
}
load().catch(e => R.fail(['re-score', 're-layers', 're-confirm', 're-offshore', 're-evidence'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
