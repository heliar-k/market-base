<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流动性 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>流动性</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc"></div>

  <div id="re-cards"></div>
  <div id="re-eval"></div>
  <div class="re-h2">子页面</div>
  <div class="link-grid" id="re-links">
    <a class="link-card" href="transmission-chain.html">
      <span class="icon">⛓️</span>
      <span><span class="t">压力指数</span><br><span class="d">规则型美元流动性压力指数 LPI</span></span>
    </a>
    <a class="link-card" href="fed-balance-sheet.html">
      <span class="icon">🏦</span>
      <span><span class="t">资产负债表</span><br><span class="d">美联储总资产、国债与 MBS 持仓</span></span>
    </a>
    <a class="link-card" href="operations.html">
      <span class="icon">🛒</span>
      <span><span class="t">公开市场操作</span><br><span class="d">RMP 准备金管理购买 / SOMA 持仓 / Repo</span></span>
    </a>
    <a class="link-card" href="rrp-tga.html">
      <span class="icon">💸</span>
      <span><span class="t">RRP &amp; TGA</span><br><span class="d">隔夜逆回购余额与财政部账户</span></span>
    </a>
    <a class="link-card" href="reserves.html">
      <span class="icon">🏛️</span>
      <span><span class="t">准备金</span><br><span class="d">银行体系超额准备金余额</span></span>
    </a>
    <a class="link-card" href="global-dollar.html">
      <span class="icon">🌐</span>
      <span><span class="t">全球美元</span><br><span class="d">美元流动性与全球美元供应</span></span>
    </a>
    <a class="link-card" href="subsurface.html">
      <span class="icon">🔬</span>
      <span><span class="t">次表层资金流</span><br><span class="d">SOFR 尾部 / 成交量异常 / SRF / 央行互换</span></span>
    </a>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
function fmtT(v) {
  if (v == null) return '—';
  return (v / 1e6).toFixed(2) + ' 万亿';
}
function fmtB(v) {
  // RRPONTSYD 原始单位是十亿美元（0.25 = 2.5 亿），不要再除 1000
  if (v == null) return '—';
  return v.toFixed(1) + ' 十亿';
}
const pctHtml = p => (p == null ? '<span style="color:#999">—</span>'
  : `<span class="${p > 0 ? 'up' : p < 0 ? 'down' : ''}">${p > 0 ? '+' : ''}${(p * 100).toFixed(1)}%</span>`);

async function load() {
  document.getElementById('page-toc').innerHTML = [
    ['概览', 're-cards'], ['流动性评估', 're-eval'], ['子页面', 're-links'],
  ].map(([t, id]) => `<a href="#${id}">${t}</a>`).join('');

  const d = await R.get('/api/liquidity/snapshot');
  const dt = d.data_date ? `数据日期: ${d.data_date}` : '';
  document.getElementById('re-as-of').textContent = dt;

  // ── 指标卡片 ──
  const c = d.cards || {};
  const card = (key, fmt, accent) => {
    const s = c[key] || {};
    return {
      label: s.label || key, accent,
      value: (key === 'RRPONTSYD' ? fmtB : fmtT)(s.value),
      sub: `1M ${pctHtml(s.change_1m)} · 1Y ${pctHtml(s.change_1y)}`,
    };
  };
  document.getElementById('re-cards').appendChild(R.cards([
    card('WALCL', fmtT), card('RRPONTSYD', fmtB), card('WTREGEN', fmtT), card('NET_LIQUIDITY', fmtT, true),
  ]));

  // ── 流动性评估（三段叙事）──
  const ev = d.evaluation || {};
  const box = document.createElement('div');
  [ev.net_liquidity, ev.outlook, ev.reserves].forEach(sec => {
    if (!sec || !sec.text) return;
    const s = document.createElement('div');
    s.className = 're-section';
    s.style.marginBottom = '12px';
    s.innerHTML = `<h2>${sec.title}</h2><p style="margin:0">${sec.text.replace(/。/g, '。')}</p>`;
    box.appendChild(s);
  });
  box.insertAdjacentHTML('afterbegin',
    `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">${R.genText(d.generator || ev.generator)} · 规则模板生成，基准数据见下方子页</div>`);
  document.getElementById('re-eval').appendChild(box);

  document.getElementById('re-gen').textContent =
    '数据源 FRED（H.4.1 / 利率走廊 / NFCI）· DTS 日度现金流 · Treasury 拍卖 · CFETS 掉期点 · 央行互换（SWPT）· 金额单位：百万美元（原始），前端换算万亿/十亿';
}
load().catch(e => R.fail(['re-cards', 're-eval'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
