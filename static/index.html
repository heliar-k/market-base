<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K线分析</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<!-- Tab bar -->
<nav class="tab-bar">
  <button class="tab-btn" data-tab="dashboard">仪表盘</button>
  <button class="tab-btn" data-tab="tech">技术</button>
  <button class="tab-btn" data-tab="macro">宏观</button>
  <button class="tab-btn" data-tab="correlation">关联</button>
  <button class="tab-btn" data-tab="liquidity">流动性</button>
  <button class="tab-btn" data-tab="stock">个股</button>
</nav>

<div class="app" data-view="dashboard">
  <!-- Left sidebar (tech only) -->
  <div class="sidebar">
    <div class="sidebar-content">
      <div class="symbol-list" id="symbol-list"><div class="loading">加载中…</div></div>
    </div>
  </div>

  <!-- Center -->
  <div class="center">
    <!-- Dashboard -->
    <div class="dashboard-view placeholder">
      <div class="placeholder-icon">📊</div>
      <div class="placeholder-text">仪表盘 · 即将上线</div>
    </div>

    <!-- Tech view -->
    <div class="tech-view" style="flex-direction:column;gap:8px;flex:1">
      <div class="controls" id="controls">
        <label><input type="checkbox" data-ma="MA5"> <span style="color:#00bcd4">MA5</span></label>
        <label><input type="checkbox" data-ma="MA10"> <span style="color:#2196f3">MA10</span></label>
        <label><input type="checkbox" data-ma="MA20"> <span style="color:#ff9800">MA20</span></label>
        <label><input type="checkbox" data-ma="MA60"> <span style="color:#9c27b0">MA60</span></label>
        <label><input type="checkbox" data-ma="MA120"> <span style="color:#9e9e9e">MA120</span></label>
        <label><input type="checkbox" data-ma="BB"> <span style="color:#78909c">BB</span></label>
        <label><input type="checkbox" data-ma="ST"> <span style="color:#e91e63">SuperTrend</span></label>
      </div>
      <div class="chart-card"><div id="main-chart"></div></div>
      <div class="chart-card"><div id="rsi-chart"></div></div>
      <div class="chart-card"><div id="macd-chart"></div></div>
    </div>

    <!-- Macro view -->
    <div class="macro-view" style="flex:1;flex-direction:column">
      <div class="chart-card" id="macro-chart-card" style="flex:1;display:flex;flex-direction:column"><div class="loading">加载中…</div></div>
    </div>

    <!-- Correlation view -->
    <div class="correlation-view" style="flex:1;flex-direction:column">
      <div class="chart-card" id="correlation-card" style="flex:1;display:flex;flex-direction:column"></div>
    </div>

    <!-- Liquidity view -->
    <div class="liquidity-view" id="liquidity-view" style="flex:1;flex-direction:column"></div>
    <div class="stock-view" id="stock-view" style="flex:1;flex-direction:column"></div>
  </div>

  <!-- Right panel (tech only) -->
  <div class="panel collapsed" id="diag-panel">
    <div class="panel-header" id="diag-header">诊断分析 <span class="toggle-icon">◀</span></div>
    <div id="diag-content"><div class="loading">请选择标的</div></div>
  </div>
</div>

<div class="status-bar">
  <span id="status-symbol">—</span>
  <span id="status-range"></span>
  <span id="status-count"></span>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
