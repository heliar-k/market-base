<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹰鸽追踪 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/fed.css">
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>鹰鸽派追踪</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav">
    <a href="/fed/">美联储</a>
    <a href="/fed/statements.html">FOMC 声明</a>
    <a href="/fed/speeches.html">官员演讲</a>
    <a href="/rates/">利率</a>
    <a href="/volatility/">波动率</a>
    <a href="/">← 仪表盘</a>
  </div>

  <div class="re-section">
    <h2>2026 年 FOMC 投票成员立场分布 <span style="font-weight:400;font-size:12px;color:var(--text-dim)">红 = 鹰，绿 = 鸽，灰 = 无近期演讲</span></h2>
    <div class="fed-chart" id="chart-roster"></div>
  </div>

  <div class="re-section">
    <h2>鹰鸽立场时间线 <span style="font-weight:400;font-size:12px;color:var(--text-dim)">纵轴 +5 = 极鹰，-5 = 极鸽，0 = 中性</span></h2>
    <div class="fed-chart-tall" id="chart-timeline"></div>
  </div>

  <div class="re-section">
    <h2>FOMC 理事一览（2026 年）</h2>
    <div id="re-roster"></div>
  </div>

  <div class="re-section">
    <h2>各官员最新立场</h2>
    <div id="re-stances"></div>
  </div>

  <div class="re-gen" id="re-gen"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/js/rates-common.js"></script>
<script>
function badge(label) {
  const cls = /鹰/.test(label) ? 'hawk' : (/鸽/.test(label) ? 'dove' : 'mid');
  return `<span class="fed-badge ${cls}">${label}</span>`;
}

async function load() {
  const data = await R.get('/api/fed/overview');
  const tl = data.timeline;
  const roster = data.roster || [];
  document.getElementById('re-as-of').textContent =
    `${roster.length} 位投票成员 · ${tl.length} 个评分点`;
  document.getElementById('re-gen').textContent =
    `鹰鸽评分：${data.generator === 'llm' ? 'LLM' : '规则引擎（LLM 预留）'}`;

  // ── 投票成员立场分布（横向条形，按分数排序）──
  const rv = (score) => (score > 0 ? score : 0);
  const sorted = [...roster].sort((a, b) => a.score - b.score);
  R.mkChart('chart-roster', (c) => ({
    backgroundColor: 'transparent',
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: 110, right: 30, top: 8, bottom: 8 },
    xAxis: {
      type: 'value', min: -5, max: 5,
      splitLine: { lineStyle: { color: c.grid } },
      axisLabel: { color: c.text, formatter: (v) => (v > 0 ? '+' + v : v) },
    },
    yAxis: {
      type: 'category', inverse: true,
      data: sorted.map(r => `${r.name_zh}${r.votes ? '·' : ''}`),
      axisLabel: { color: c.text, fontSize: 11 },
      axisLine: { show: false }, axisTick: { show: false },
    },
    series: [{
      type: 'bar', barWidth: 14,
      data: sorted.map(r => ({
        value: r.score,
        itemStyle: { color: r.score > 0 ? c.red : r.score < 0 ? c.green : c.gray, borderRadius: 3 },
      })),
      label: {
        show: true, position: 'right', color: c.text, fontSize: 10,
        formatter: (p) => p.value > 0 ? '+' + p.value : p.value,
      },
    }],
  }));

  // ── 时间线：声明（红方块）+ 演讲（蓝点）散点，0 轴参考线 ──
  const mk = (type) => tl.filter(x => x.type === type).map(x => ({
    name: x.name, value: [x.date, x.score],
  }));
  R.mkChart('chart-timeline', (c) => ({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: (p) => `${p.data.name}<br>${p.data.value[0]} · ${p.data.value[1] > 0 ? '+' : ''}${p.data.value[1]}`,
    },
    grid: { left: 40, right: 16, top: 20, bottom: 40 },
    xAxis: {
      type: 'category',
      data: [...new Set(tl.map(x => x.date))],
      axisLabel: { color: c.text, fontSize: 10 },
      axisLine: { lineStyle: { color: c.border } },
    },
    yAxis: {
      type: 'value', min: -5, max: 5,
      splitLine: { lineStyle: { color: c.grid } },
      axisLabel: { color: c.text, formatter: (v) => (v > 0 ? '+' + v : v) },
    },
    series: [
      { name: '声明', type: 'scatter', symbol: 'rect', symbolSize: 9, itemStyle: { color: c.red }, data: mk('statement') },
      { name: '演讲', type: 'scatter', symbolSize: 6, itemStyle: { color: c.blue }, data: mk('speech') },
    ],
  }));

  // ── FOMC 理事一览表 ──
  const rows = roster.map(r => ({
    name: `${r.name_zh} ${r.speaker}`,
    role: r.role,
    votes: r.votes ? '投票' : '—',
    label: r.label,
    score: r.score > 0 ? `+${r.score}` : String(r.score),
    date: r.date || '暂无近期发言',
  }));
  document.getElementById('re-roster').appendChild(R.table(
    ['姓名', '职位', '投票权', '倾向', '评分', '最近发言'],
    rows,
  ));

  // ── 各官员最新立场表（有演讲者）──
  const rows = data.stances.map(s => ({
    speaker: s.speaker,
    score: s.score > 0 ? `+${s.score}` : String(s.score),
    label: s.label,
    date: s.date,
    title: s.title,
  }));
  document.getElementById('re-stances').appendChild(R.table(
    ['官员', '立场', '评分', '最新日期', '最新演讲'],
    rows,
    { label: (v) => v, score: (v) => v },
  ));
}

load().catch(e => R.fail(['chart-timeline', 'chart-roster', 're-stances', 're-roster'], e));
</script>
</body>
</html>
