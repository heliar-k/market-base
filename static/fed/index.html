<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美联储 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<link rel="stylesheet" href="/css/fed.css">
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>美联储</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc"></div>

  <div id="cards"></div>
  <div id="sec-stmts"></div>
  <div id="sec-speeches"></div>
  <div id="sec-hawk"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/vendor/echarts.min.js"></script>
<script src="/js/rates-common.js"></script>
<script>
const KIND_LABEL = { statement: '声明', minutes: '会议纪要', sep: '经济预测', discount: '贴现率纪要', other: '其他' };
const KIND_ORDER = ['statement', 'minutes', 'sep', 'discount', 'other'];

function badge(label) {
  const cls = /鹰/.test(label) ? 'hawk' : (/鸽/.test(label) ? 'dove' : 'mid');
  return `<span class="fed-badge ${cls}">${label}</span>`;
}

function docCard(d, href) {
  const el = document.createElement('div');
  el.className = 'fed-doc';
  el.innerHTML = `
    <div class="fed-doc-head">
      <span class="fed-doc-meta">${d.date}</span>${badge(d.label)}
      <a class="fed-doc-title" href="${href}" target="_blank">${d.title}</a>
    </div>
    <div class="fed-doc-excerpt">${d.excerpt}</div>`;
  return el;
}

// 分类过滤条（声明 kind / 演讲 speaker 共用）
function mkFilter(bar, labels, onPick) {
  bar.innerHTML = '';
  Object.entries(labels).forEach(([label, key]) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = label;
    a.style.cssText = 'color:var(--accent);text-decoration:none;padding:2px 8px;border:1px solid var(--btn-border);border-radius:4px';
    a.onclick = (e) => { e.preventDefault(); onPick(key); };
    bar.appendChild(a);
  });
}

function renderStatements(root, data) {
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>FOMC 货币政策声明</h2><div id="re-filter" style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px"></div><div id="re-list"></div>';
  root.appendChild(sec);
  const ALL = data.statements;
  const list = sec.querySelector('#re-list');
  const render = (filter = 'all') => {
    list.innerHTML = '';
    for (const d of ALL) {
      if (filter !== 'all' && d.kind !== filter) continue;
      const el = docCard(d, d.url);
      el.querySelector('.fed-doc-head').insertAdjacentHTML('beforeend',
        `<span class="fed-doc-meta">${KIND_LABEL[d.kind] || d.kind}</span>`);
      if (d.hits.length) el.innerHTML += `<div class="fed-doc-hits">信号词: ${d.hits.join(' · ')}</div>`;
      list.appendChild(el);
    }
  };
  const labels = { ['全部 (' + ALL.length + ')']: 'all' };
  for (const k of KIND_ORDER) {
    const n = ALL.filter(x => x.kind === k).length;
    if (n) labels[`${KIND_LABEL[k]} (${n})`] = k;
  }
  mkFilter(sec.querySelector('#re-filter'), labels, render);
  render();
}

function renderSpeeches(root, data) {
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>美联储官员演讲</h2><div id="sp-filter" style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px"></div><div id="sp-list"></div>';
  root.appendChild(sec);
  const ALL = data.speeches;
  const list = sec.querySelector('#sp-list');
  const render = (filter = 'all') => {
    list.innerHTML = '';
    for (const d of ALL) {
      if (filter !== 'all' && d.speaker !== filter) continue;
      const el = docCard(d, d.url);
      el.querySelector('.fed-doc-head').insertAdjacentHTML('beforeend',
        `<span class="fed-doc-meta">${d.speaker}</span>`);
      list.appendChild(el);
    }
  };
  const speakers = [...new Set(ALL.map(d => d.speaker))];
  const labels = { ['全部 (' + ALL.length + ')']: 'all' };
  speakers.forEach(s => { labels[s] = s; });
  mkFilter(sec.querySelector('#sp-filter'), labels, render);
  render();
}

function renderHawkish(root, data) {
  const wrap = document.createElement('div');
  root.appendChild(wrap);  // 先挂文档再建图（R.mkChart 按 id 查 DOM，detached 时查不到）
  const tl = data.timeline;
  const roster = data.roster || [];

  // ── 投票成员立场分布：表格呈现（12 人小样本，表格比条形图信息密度高；
  //    着色评分列 + 标题鹰鸽计数替代图形的扫视优势）──
  const s1 = document.createElement('div');
  s1.className = 're-section';
  const hawkN = roster.filter(r => r.score > 0).length;
  const doveN = roster.filter(r => r.score < 0).length;
  const midN = roster.length - hawkN - doveN;
  const hdColor = (v) => v > 0 ? '#ef5350' : v < 0 ? '#26a69a' : '#9ca3af';
  s1.innerHTML = `<h2>2026 年 FOMC 投票成员立场分布
    <span style="font-weight:400;font-size:12px;color:var(--text-dim)">${hawkN} 鹰 · ${doveN} 鸽 · ${midN} 中性（红 = 鹰，绿 = 鸽，灰 = 无近期演讲）</span></h2>`;
  wrap.appendChild(s1);
  const sorted = [...roster].sort((a, b) => b.score - a.score);
  s1.appendChild(R.table(
    ['姓名', '职位', '投票权', '倾向', '评分', '最近发言'],
    sorted.map(r => ({
      name: r.name_zh + (r.votes ? '·' : ''),
      role: r.role,
      votes: r.votes ? '投票' : '—',
      label: r.label,
      score: r.score > 0 ? `+${r.score}` : String(r.score),
      date: r.date || '暂无近期发言',
    })),
    {
      label: (v) => {
        const cls = /鹰/.test(v) ? 'hawk' : (/鸽/.test(v) ? 'dove' : 'mid');
        return `<span class="fed-badge ${cls}">${v}</span>`;
      },
      score: (v) => `<span style="color:${hdColor(Number(v))};font-weight:700">${v}</span>`,
      votes: (v) => v === '投票' ? `<span style="color:var(--accent)">投票</span>` : v,
    },
    null, true));

  // ── 时间线：声明（红方块）+ 演讲（蓝点）散点 ──
  const s2 = document.createElement('div');
  s2.className = 're-section';
  s2.innerHTML = '<h2>鹰鸽立场时间线 <span style="font-weight:400;font-size:12px;color:var(--text-dim)">纵轴 +5 = 极鹰，-5 = 极鸽，0 = 中性</span></h2><div class="fed-chart-tall" id="chart-timeline"></div>';
  wrap.appendChild(s2);
  const mk = (type) => tl.filter(x => x.type === type).map(x => ({
    name: x.name, value: [x.date, x.score],
  }));
  R.mkChart('chart-timeline', (c) => ({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      formatter: (p) => `${p.data.name}<br>${p.data.value[0]} · ${p.data.value[1] > 0 ? '+' : ''}${p.data.value[1]}`,
    },
    grid: { left: 40, right: 16, top: 20, bottom: 40 },
    xAxis: {
      type: 'category',
      data: [...new Set(tl.map(x => x.date))],
      axisLabel: { color: c.text, fontSize: 10, rotate: 45, hideOverlap: true },
      axisLine: { lineStyle: { color: c.border } },
    },
    yAxis: {
      type: 'value', min: -5, max: 5,
      splitLine: { lineStyle: { color: c.grid } },
      axisLabel: { color: c.text, formatter: (v) => (v > 0 ? '+' + v : v) },
    },
    series: [
      { name: '声明', type: 'scatter', symbol: 'rect', symbolSize: 9, itemStyle: { color: c.red }, data: mk('statement') },
      { name: '演讲', type: 'scatter', symbolSize: 6, itemStyle: { color: c.blue }, data: mk('speech') },
    ],
  }));

  // ── 各官员最新立场表 ──
  const s4 = document.createElement('div');
  s4.className = 're-section';
  s4.innerHTML = '<h2>各官员最新立场</h2>';
  s4.appendChild(R.table(
    ['官员', '立场', '评分', '最新日期', '最新演讲'],
    data.stances.map(s => ({
      speaker: s.speaker,
      score: s.score > 0 ? `+${s.score}` : String(s.score),
      label: s.label,
      date: s.date,
      title: s.title,
    })),
    { label: (v) => v, score: (v) => v },
  ));
  wrap.appendChild(s4);
}

async function load() {
  // 小节锚点导航（长页快速跳转；sticky 见 special.css .page-toc）
  document.getElementById('page-toc').innerHTML = [
    ['概览', 'cards'], ['声明', 'sec-stmts'], ['演讲', 'sec-speeches'], ['鹰鸽追踪', 'sec-hawk'],
  ].map(([t, id]) => `<a href="#${id}">${t}</a>`).join('');

  const [data, cal] = await Promise.all([
    R.get('/api/fed/overview'),
    R.get('/api/fomc/calendar'),
  ]);
  const ind = data.indicator;
  document.getElementById('re-as-of').textContent =
    `数据截至 ${data.statements[0]?.date.slice(0,4)}-${data.statements[0]?.date.slice(4,6)}-${data.statements[0]?.date.slice(6)}`;
  document.getElementById('re-gen').textContent =
    `鹰鸽评分：${data.generator === 'llm' ? 'LLM' : '规则引擎（LLM 预留）'}`;

  // 下次 FOMC 会议倒计时
  const nx = cal.next;
  const latestStmt = data.statements.find(s => s.kind === 'statement');
  let days = '—';
  if (nx) {
    const target = new Date(nx.year, nx.month - 1, nx.start_day);
    days = Math.ceil((target - new Date()) / 86400000);
  }
  const nextTxt = nx ? `${nx.month} 月 ${nx.start_day}-${nx.end_day} 日` : '—';

  // ── 统计卡 ──
  document.getElementById('cards').replaceChildren(R.cards([
    { label: '鹰鸽指示器', value: `${ind.score > 0 ? '+' : ''}${ind.score} 分`, sub: `${ind.label} · 范围 -5 鸽 ~ +5 鹰（最近 ${ind.sample} 条）`, accent: true },
    { label: '下次 FOMC', value: days > 0 ? `${days} 天` : '会议中', sub: nextTxt },
    { label: '目标利率', value: `${Number(cal.target_lower).toFixed(2)}–${Number(cal.target_upper).toFixed(2)}%`, sub: '联邦基金目标区间' },
    { label: '最新声明', value: latestStmt?.label, sub: latestStmt?.date },
    { label: '最新演讲', value: data.speeches[0]?.label, sub: data.speeches[0]?.speaker },
  ]));

  renderStatements(document.getElementById('sec-stmts'), data);
  renderSpeeches(document.getElementById('sec-speeches'), data);
  renderHawkish(document.getElementById('sec-hawk'), data);
}

load().catch(e => R.fail(['cards', 'sec-stmts', 'sec-speeches', 'sec-hawk'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
