<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMC 声明 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<link rel="stylesheet" href="/css/fed.css">
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>FOMC 货币政策声明</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div id="re-filter" style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px"></div>
  <div id="re-list"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="/js/rates-common.js"></script>
<script>
const KIND_LABEL = { statement: '声明', minutes: '会议纪要', sep: '经济预测', discount: '贴现率纪要', other: '其他' };
const KIND_ORDER = ['statement', 'minutes', 'sep', 'discount', 'other'];
let ALL = [];

function badge(label) {
  const cls = /鹰/.test(label) ? 'hawk' : (/鸽/.test(label) ? 'dove' : 'mid');
  return `<span class="fed-badge ${cls}">${label}</span>`;
}

function render(filter = 'all') {
  const root = document.getElementById('re-list');
  root.innerHTML = '';
  for (const d of ALL) {
    if (filter !== 'all' && d.kind !== filter) continue;
    const el = document.createElement('div');
    el.className = 'fed-doc';
    el.innerHTML = `
      <div class="fed-doc-head">
        <span class="fed-doc-meta">${d.date}</span>${badge(d.label)}
        <span class="fed-doc-meta">${KIND_LABEL[d.kind] || d.kind}</span>
        <a class="fed-doc-title" href="${d.url}" target="_blank">${d.title}</a>
      </div>
      <div class="fed-doc-excerpt">${d.excerpt}</div>
      ${d.hits.length ? `<div class="fed-doc-hits">信号词: ${d.hits.join(' · ')}</div>` : ''}`;
    root.appendChild(el);
  }
}

async function load() {
  const data = await R.get('/api/fed/overview');
  ALL = data.statements;
  document.getElementById('re-as-of').textContent = `共 ${ALL.length} 条`;
  document.getElementById('re-gen').textContent =
    `鹰鸽评分：${data.generator === 'llm' ? 'LLM' : '规则引擎（LLM 预留）'}`;

  // 分类过滤按钮
  const bar = document.getElementById('re-filter');
  const mk = (label, key) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = label;
    a.style.cssText = 'color:var(--accent);text-decoration:none;padding:2px 8px;border:1px solid var(--btn-border);border-radius:4px';
    a.onclick = (e) => { e.preventDefault(); render(key); };
    bar.appendChild(a);
  };
  mk('全部', 'all');
  for (const k of KIND_ORDER) {
    const n = ALL.filter(x => x.kind === k).length;
    if (n) mk(`${KIND_LABEL[k]} (${n})`, k);
  }
  render();
}

load().catch(e => R.fail(['re-list'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
