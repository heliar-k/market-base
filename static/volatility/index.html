<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波动率 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>波动率</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div id="vix-row"></div>
  <div id="re-signals"></div>
  <div class="link-grid">
    <a class="link-card" href="https://www.barchart.com/options/volatility-index" target="_blank">
      <span class="icon">📡</span>
      <div>
        <div class="t">波动率全景</div>
        <div class="d">实时跨资产波动率仪表盘（Barchart）</div>
      </div>
    </a>
    <a class="link-card" href="/volatility/vix.html">
      <span class="icon">🌊</span>
      <div>
        <div class="t">VIX</div>
        <div class="d">标普500隐含波动率指数</div>
      </div>
    </a>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const data = await R.get('/api/volatility/analysis');
  const v = data.vix;
  document.getElementById('re-as-of').textContent = '数据截至 ' + data.as_of;

  // 卡片行：VIX 最新值 + 徽章 | VIX 水平参考
  const chg1d = v.chg_1d_pct === null ? '' : `${v.chg_1d_pct > 0 ? '▲' : '▼'} ${Math.abs(v.chg_1d_pct).toFixed(2)}% 日 · `;
  const chg1w = v.chg_1w_pct === null ? '' : `${v.chg_1w_pct > 0 ? '▲' : '▼'} ${Math.abs(v.chg_1w_pct).toFixed(2)}% 周`;
  const row = document.createElement('div');
  row.className = 'vix-row';
  row.innerHTML = `
    <div class="vix-card">
      <span class="vix-label">VIX（恐慌指数）</span>
      <span class="vix-value">${v.value.toFixed(2)}</span>
      <span class="vix-badge" style="color:${v.zone_color};border-color:${v.zone_color}66;background:${v.zone_color}1a">${v.zone}区间 · ${v.percentile_1y}% 分位</span>
      <span class="vix-date">${chg1d}${chg1w} &nbsp;·&nbsp; ${v.as_of}</span>
    </div>
    <div class="vix-card vix-legend">
      <div class="title">VIX 水平参考</div>
      <div class="scale">
        <span style="color:#34d399">＜15 平静</span>
        <span style="color:#f59e0b">15-25 正常</span>
        <span style="color:#f97316">25-35 警戒</span>
        <span style="color:#f87171">＞35 恐慌</span>
      </div>
    </div>`;
  document.getElementById('vix-row').appendChild(row);

  // 波动率信号（三段）
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>波动率信号</h2>';
  data.signals.forEach(s => {
    const b = document.createElement('div');
    b.className = 'sig-block';
    b.innerHTML = `<div class="sig-title">${s.title}</div><p>${s.text}</p>`;
    sec.appendChild(b);
  });
  document.getElementById('re-signals').appendChild(sec);

  document.getElementById('re-gen').textContent = `研判由规则引擎生成（${data.generator}）· ${data.as_of}`;
}
load().catch(e => R.fail(['vix-row', 're-signals'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
