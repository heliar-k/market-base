<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波动率 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  .re-root { max-width: 960px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .re-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .re-header h1 { font-size: 20px; font-weight: 700; }
  .re-as-of { font-size: 13px; color: var(--text-dim); }
  .re-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .re-nav a { color: var(--accent); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--btn-border); border-radius: 4px; }
  .re-nav a:hover { background: var(--surface-hover); }
  .re-section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 14px 18px; }
  .re-section h2 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .re-section p { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .re-gen { font-size: 11px; color: var(--text-dim); text-align: right; }
  .re-loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
  .re-error { text-align: center; padding: 40px 20px; color: #ef5350; }
  /* VIX 卡片 */
  .vix-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vix-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .vix-card a { color: var(--accent); text-decoration: none; }
  .vix-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); }
  .vix-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .vix-date { font-size: 11px; color: var(--text-dim); }
  .vix-badge { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: 1px solid; background: var(--surface-hover); }
  .vix-legend { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .vix-legend .title { font-size: 14px; font-weight: 700; }
  .vix-legend .scale { display: flex; gap: 12px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
  .sig-block { margin-bottom: 14px; }
  .sig-block:last-child { margin-bottom: 0; }
  .sig-block .sig-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--accent); opacity: .8; margin-bottom: 6px; }
  .sig-block p { margin: 0; }
  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .link-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 16px 18px; text-decoration: none; display: flex; gap: 12px; align-items: flex-start; }
  .link-card:hover { border-color: var(--accent); background: var(--surface-hover); }
  .link-card .icon { font-size: 22px; }
  .link-card .t { font-size: 14px; font-weight: 600; color: var(--text); }
  .link-card .d { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  @media (max-width: 640px) { .vix-row, .link-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>波动率</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav">
    <a href="/volatility/vix.html">VIX</a>
    <a href="/rates/">利率</a>
    <a href="/fed/">美联储</a>
    <a href="/">← 仪表盘</a>
  </div>

  <div id="vix-row"></div>
  <div id="re-signals"></div>
  <div class="link-grid">
    <a class="link-card" href="https://www.barchart.com/options/volatility-index" target="_blank">
      <span class="icon">📡</span>
      <div>
        <div class="t">波动率全景</div>
        <div class="d">实时跨资产波动率仪表盘（Barchart）</div>
      </div>
    </a>
    <a class="link-card" href="/volatility/vix.html">
      <span class="icon">🌊</span>
      <div>
        <div class="t">VIX</div>
        <div class="d">标普500隐含波动率指数</div>
      </div>
    </a>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const data = await R.get('/api/volatility/analysis');
  const v = data.vix;
  document.getElementById('re-as-of').textContent = '数据截至 ' + data.as_of;

  // 卡片行：VIX 最新值 + 徽章 | VIX 水平参考
  const chg1d = v.chg_1d_pct === null ? '' : `${v.chg_1d_pct > 0 ? '▲' : '▼'} ${Math.abs(v.chg_1d_pct).toFixed(2)}% 日 · `;
  const chg1w = v.chg_1w_pct === null ? '' : `${v.chg_1w_pct > 0 ? '▲' : '▼'} ${Math.abs(v.chg_1w_pct).toFixed(2)}% 周`;
  const row = document.createElement('div');
  row.className = 'vix-row';
  row.innerHTML = `
    <div class="vix-card">
      <span class="vix-label">VIX（恐慌指数）</span>
      <span class="vix-value">${v.value.toFixed(2)}</span>
      <span class="vix-badge" style="color:${v.zone_color};border-color:${v.zone_color}66;background:${v.zone_color}1a">${v.zone}区间 · ${v.percentile_1y}% 分位</span>
      <span class="vix-date">${chg1d}${chg1w} &nbsp;·&nbsp; ${v.as_of}</span>
    </div>
    <div class="vix-card vix-legend">
      <div class="title">VIX 水平参考</div>
      <div class="scale">
        <span style="color:#34d399">＜15 平静</span>
        <span style="color:#f59e0b">15-25 正常</span>
        <span style="color:#f97316">25-35 警戒</span>
        <span style="color:#f87171">＞35 恐慌</span>
      </div>
    </div>`;
  document.getElementById('vix-row').appendChild(row);

  // 波动率信号（三段）
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>波动率信号</h2>';
  data.signals.forEach(s => {
    const b = document.createElement('div');
    b.className = 'sig-block';
    b.innerHTML = `<div class="sig-title">${s.title}</div><p>${s.text}</p>`;
    sec.appendChild(b);
  });
  document.getElementById('re-signals').appendChild(sec);

  document.getElementById('re-gen').textContent = `研判由规则引擎生成（${data.generator}）· ${data.as_of}`;
}
load().catch(e => R.fail(['vix-row', 're-signals'], e));
</script>
</body>
</html>
