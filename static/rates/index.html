<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>利率 — 观澜台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/js/site-nav.js"></script>
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>利率</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc"></div>

  <div class="re-badges" id="re-badges"></div>
  <div id="re-cards"></div>
  <div class="re-h2" id="sec-shape">曲线快照（当前 / 1周前 / 1月前 / 3月前）</div>
  <div class="re-chart" id="yc_compare"></div>
  <div id="re-sections"></div>

  <div class="link-grid" id="re-links">
    <a class="link-card" href="fed-funds.html">
      <span class="icon">🏦</span>
      <div>
        <div class="t">联邦基金利率</div>
        <div class="d">EFFR/SOFR 走廊、成交量与 5 年政策周期</div>
      </div>
    </a>
    <a class="link-card" href="yield-curve.html">
      <span class="icon">📈</span>
      <div>
        <div class="t">收益率曲线</div>
        <div class="d">曲线形态研判、全期限明细与全球长端对照</div>
      </div>
    </a>
    <a class="link-card" href="pricing.html">
      <span class="icon">🎯</span>
      <div>
        <div class="t">利率定价</div>
        <div class="d">FOMC 会议概率与名义/实际/BEI 长端分解</div>
      </div>
    </a>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/echarts-theme.js"></script>
<script src="/js/rates-common.js"></script>
<script>
async function load() {
  // EFFR 卡片值/1周变动由 analysis 的 overview.effr 提供，不再拉整个 fed-funds（~84KB）
  const data = await R.get('/api/rates/analysis');
  document.getElementById('re-as-of').textContent = R.asOf(data.overview.as_of);
  document.getElementById('re-gen').textContent =
    `研判生成：${R.genText(data.generator)}`;

  const d = data.yield_curve;

  // ── 形态徽章行（与收益率曲线页同款定调）──
  document.getElementById('re-badges').innerHTML = R.curveBadges(d);

  // ── 统计卡（变动着色：涨绿跌红，与全站一致）──
  const t = Object.fromEntries(d.tenors.map(x => [x.tenor, x]));
  const tips10 = d.tips.find(x => x.tenor === '10Y');
  const s = d.spreads;
  const chgSub = (v, label) => v === null || v === undefined ? ''
    : `<span style="color:${v > 0 ? 'var(--color-up)' : v < 0 ? 'var(--color-down)' : 'var(--color-neutral)'}">${v > 0 ? '▲ +' : v < 0 ? '▼ ' : ''}${Number(v).toFixed(0)}bp</span> · ${label}`;
  const effr = data.overview.effr || {};
  document.getElementById('re-cards').replaceChildren(R.cards([
    { label: '联邦基金有效利率', value: R.fmtPct(effr.value), sub: chgSub(effr.chg_1w, '1周'), accent: true },
    { label: '2Y', value: R.fmtPct(t['2Y'].current), sub: chgSub(t['2Y'].chg_1w, '1周') },
    { label: '10Y', value: R.fmtPct(t['10Y'].current), sub: chgSub(t['10Y'].chg_1w, '1周') },
    { label: '30Y', value: R.fmtPct(t['30Y'].current), sub: chgSub(t['30Y'].chg_1w, '1周') },
    { label: '10Y-2Y', value: R.fmtBp(s['2s10s']), sub: chgSub(s['2s10s_1m_chg'], '1月') },
    { label: '10Y 实际利率', value: R.fmtPct(tips10?.real), sub: 'TIPS' },
  ]));

  // ── 曲线四线快照（tenors 自带 1周/1月/3月前，零新请求）──
  R.curveCompare('yc_compare', d.tenors);

  // ── 四段研判 ──
  const root = document.getElementById('re-sections');
  root.innerHTML = '';
  data.overview.sections.forEach((sec, i) => {
    const div = document.createElement('div');
    div.className = 're-section';
    div.id = `re-sec-${i}`;
    div.innerHTML = `<h2>${sec.title}</h2><p></p>`;
    div.querySelector('p').textContent = sec.body;
    root.appendChild(div);
  });

  // ── 小节锚点导航：页面不长，四段研判合并为一项 ──
  const tocItems = [['概览', 're-cards'], ['曲线快照', 'sec-shape'], ['研判', 're-sections'], ['子页入口', 're-links']];
  document.getElementById('page-toc').innerHTML =
    tocItems.map(([label, id]) => `<a href="#${id}">${label}</a>`).join('');
}

load().catch(e => R.fail(['re-cards', 're-sections'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
