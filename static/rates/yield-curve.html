<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收益率曲线 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>收益率曲线</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc">
    <a href="#re-badges">概览</a><a href="#sec-compare">曲线对比</a><a href="#sec-global">全球长端</a><a href="#sec-change">月度变化</a><a href="#sec-spreads">关键利差</a><a href="#sec-tips">名义/实际</a><a href="#sec-tenors">期限明细</a>
  </div>

  <div class="re-badges" id="re-badges"></div>

  <div class="re-h2" id="sec-compare">收益率曲线对比（当前 / 1周前 / 1月前 / 3月前）</div>
  <div class="re-chart" id="yc_compare"></div>
  <div class="re-h2" id="sec-global">全球长端利率对照（10Y benchmark）</div>
  <div id="re-global"></div>
  <div class="re-h2" id="sec-change">收益率变化（当前 vs 1月前，bp）</div>
  <div class="re-chart" id="yc_change"></div>
  <div class="re-h2" id="sec-spreads">关键利差时间序列（2s10s / 3m10s / 5s30s，近 6 个月）</div>
  <div class="re-chart" id="yc_spreads"></div>
  <div class="re-h2" id="sec-tips">名义 vs 实际(TIPS) vs 盈亏平衡通胀（按期限）</div>
  <div class="re-chart" id="yc_tips"></div>

  <div class="re-analysis" id="re-analysis"></div>

  <div class="re-h2" id="sec-tenors">各期限收益率明细</div>
  <div id="re-tenors"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d0 = await R.get('/api/rates/yield-curve');
  const d = d0.yield_curve;
  document.getElementById('re-as-of').textContent = `数据截至 ${d.as_of}`;

  // ── 形态徽章 + 利差 ──
  const badges = document.getElementById('re-badges');
  const shapeCls = d.shape.includes('熊') ? 'bear' : d.shape.includes('牛') ? 'bull' : 'flat';
  const s = d.spreads;
  badges.innerHTML = `
    <span class="re-badge ${shapeCls}">${d.shape} · ${d.driver}</span>
    <span class="re-spread">2s10s: ${R.fmtBp(s['2s10s'])}bp</span>
    <span class="re-spread">3m10s: ${R.fmtBp(s['3m10s'])}bp</span>
    <span class="re-spread">5s30s: ${R.fmtBp(s['5s30s'])}bp</span>
    <span class="re-spread">确认度 ${d.confidence}</span>`;

  // ── 四线对比 ──
  const tenors = d.tenors;
  R.mkChart('yc_compare', (colors) => ({
    legend: { data: ['当前', '1周前', '1月前', '3月前'], top: 4, right: 8, textStyle: { color: colors.text, fontSize: 11 } },
    tooltip: { trigger: 'axis', valueFormatter: v => `${Number(v).toFixed(2)}%` },
    grid: { top: 36, left: 48, right: 16, bottom: 24 },
    xAxis: { type: 'category', data: tenors.map(t => t.tenor), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, formatter: '{value}%' }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      { name: '当前', type: 'line', data: tenors.map(t => t.current), symbol: 'circle', symbolSize: 6, lineStyle: { color: colors.blue, width: 2 }, itemStyle: { color: colors.blue }, connectNulls: true },
      { name: '1周前', type: 'line', data: tenors.map(t => t.prev_1w), symbol: 'none', lineStyle: { color: colors.gray, type: 'dashed', width: 1.5 }, connectNulls: true },
      { name: '1月前', type: 'line', data: tenors.map(t => t.prev_1m), symbol: 'none', lineStyle: { color: colors.orange, type: 'dashed', width: 1.5 }, connectNulls: true },
      { name: '3月前', type: 'line', data: tenors.map(t => t.prev_3m), symbol: 'none', lineStyle: { color: colors.red, type: 'dashed', width: 1.5 }, connectNulls: true },
    ],
  }));

  // 全局长端对照表：显式 keys（6 列头 ↔ 6 键），
  // 修复 Object.keys 取列时第 6 列“来源”错渲染成 spread30 的问题（审计 P1-③）
  document.getElementById('re-global').replaceChildren(R.table(
    ['市场', '说明', '10Y 收益率', '30Y 收益率', '美国 − 该市场 (bp)', '来源'],
    d.global_long_end.map(g => ({
      market: g.market, note: g.note, rate: g.rate, rate30: g.rate30,
      spread: g.spread_vs_us, source: g.source,
    })),
    {
      rate: R.fmtPct, rate30: R.fmtPct,
      spread: (v) => (v === null || v === undefined ? '—' : `${v > 0 ? '+' : ''}${v.toFixed(0)}`),
    },
    ['market', 'note', 'rate', 'rate30', 'spread', 'source'],
  ));

  // ── 1 月变化柱状图 ──
  R.mkChart('yc_change', (colors) => ({
    tooltip: { trigger: 'axis', valueFormatter: v => `${v} bp` },
    grid: { top: 28, left: 48, right: 16, bottom: 24, containLabel: false },
    // 顶部留 16px 防柱顶标签裁切（含 grid.top 合计 ≥ 柱高+标签）
    xAxis: { type: 'category', data: tenors.map(t => t.tenor), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', axisLabel: { color: colors.muted, formatter: '{value} bp' }, scale: true, splitLine: { lineStyle: { color: colors.grid } }, max: v => v.max + (v.max - v.min) * 0.12 },
    series: [{
      type: 'bar', barMaxWidth: 36,
      data: tenors.map(t => ({ value: t.chg_1m, itemStyle: { color: (t.chg_1m || 0) >= 0 ? colors.green : colors.red } })),
      label: { show: true, position: 'top', fontSize: 10, color: colors.muted, formatter: p => (p.value === null || p.value === undefined ? '' : p.value) },
    }],
  }));

  // ── 利差时序 ──
  const sh = d0.yield_curve.spreads_history;
  R.mkChart('yc_spreads', (colors) => ({
    legend: { data: ['2s10s', '3m10s', '5s30s'], top: 4, right: 8, textStyle: { color: colors.text, fontSize: 11 } },
    tooltip: { trigger: 'axis', valueFormatter: v => `${v} bp` },
    grid: { top: 36, left: 48, right: 16, bottom: 56 },
    dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 8, height: 18 }],
    xAxis: { type: 'category', data: R.ts(sh['2s10s']), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', axisLabel: { color: colors.muted, formatter: '{value} bp' }, scale: true, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      { name: '2s10s', type: 'line', data: R.vs(sh['2s10s']), symbol: 'none', lineStyle: { color: colors.blue, width: 2 } },
      { name: '3m10s', type: 'line', data: R.vs(sh['3m10s']), symbol: 'none', lineStyle: { color: colors.orange, width: 1.5 } },
      { name: '5s30s', type: 'line', data: R.vs(sh['5s30s']), symbol: 'none', lineStyle: { color: colors.purple, width: 1.5 } },
    ],
  }));

  // ── 名义 vs TIPS vs 盈亏平衡 ──
  const tips = d.tips;
  R.mkChart('yc_tips', (colors) => ({
    legend: { data: ['名义收益率', 'TIPS 实际利率', '盈亏平衡通胀'], top: 4, right: 8, textStyle: { color: colors.text, fontSize: 11 } },
    tooltip: { trigger: 'axis', valueFormatter: v => `${Number(v).toFixed(2)}%` },
    grid: { top: 36, left: 48, right: 16, bottom: 24 },
    xAxis: { type: 'category', data: tips.map(t => t.tenor), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, formatter: '{value}%' }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      { name: '名义收益率', type: 'line', data: tips.map(t => t.nominal), symbol: 'circle', symbolSize: 6, lineStyle: { color: colors.blue, width: 2 }, itemStyle: { color: colors.blue } },
      { name: 'TIPS 实际利率', type: 'line', data: tips.map(t => t.real), symbol: 'circle', symbolSize: 6, lineStyle: { color: colors.orange, width: 2 }, itemStyle: { color: colors.orange } },
      { name: '盈亏平衡通胀', type: 'line', data: tips.map(t => t.breakeven), symbol: 'circle', symbolSize: 6, lineStyle: { color: colors.green, width: 2 }, itemStyle: { color: colors.green } },
    ],
  }));

  // ── 解读：形态 / 驱动 / 关键利差信号 / 验证指标 / 交易含义 / 失效条件 / 时间框架 ──
  const a = document.getElementById('re-analysis');
  a.innerHTML = `
    <h3>【曲线形态】</h3><p>${d.shape}：10Y 1月 ${R.fmtBp(d.spreads['10y_1m_chg'])}bp，2Y ${R.fmtBp(d.spreads['2y_1m_chg'])}bp，2s10s ${R.fmtBp(d.spreads['2s10s_1m_chg'])}bp。</p>
    <h3>【变动驱动】</h3><p>${d.driver}。</p>
    <h3>【关键利差信号】</h3><ul>${d.spread_notes.map(n => `<li>${n}</li>`).join('')}</ul>
    <h3>【验证指标】</h3>
    ${d.validation.map(v => `<div class="re-check"><span class="${v.ok ? 'ok' : 'no'}">${v.ok ? '✓' : '✗'}</span><span>${v.name} ${v.value}</span><span class="note">— ${v.note}</span></div>`).join('')}
    <p style="margin-top:4px">确认度：${d.confidence}</p>
    <h3>【交易含义】</h3><ul>${d.trades.map(t => `<li>${t}</li>`).join('')}</ul>
    <h3>【失效条件】</h3><ul>${d.invalidation.map(t => `<li>${t}</li>`).join('')}</ul>
    <h3>【时间框架】</h3><p>${d.time_frame}</p>`;

  // ── 明细表 ──
  const bpHtml = v => v === null || v === undefined ? '—'
    : `<span style="color:${v > 0 ? '#26a69a' : v < 0 ? '#ef5350' : '#9ca3af'}">${Number(v) > 0 ? '+' : ''}${Number(v).toFixed(1)}</span>`;
  document.getElementById('re-tenors').replaceChildren(R.table(
    ['期限', '当前', '1周前', '1月前', '3月前', 'vs 1周', 'vs 1月', 'vs 3月'],
    tenors.map(t => ({ t: t.tenor, cur: t.current, w1: t.prev_1w, m1: t.prev_1m, m3: t.prev_3m, c1: t.chg_1w, c2: t.chg_1m, c3: t.chg_3m })),
    { cur: R.fmtPct, w1: R.fmtPct, m1: R.fmtPct, m3: R.fmtPct, c1: bpHtml, c2: bpHtml, c3: bpHtml },
    null, true,
  ));
}

load().catch(e => R.fail(['re-badges', 're-global', 're-analysis', 're-tenors'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
