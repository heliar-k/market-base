<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实际利率 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  .re-root { max-width: 960px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .re-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .re-header h1 { font-size: 20px; font-weight: 700; }
  .re-as-of { font-size: 13px; color: var(--text-dim); }
  .re-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .re-nav a { color: var(--accent); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--btn-border); border-radius: 4px; }
  .re-nav a:hover { background: var(--surface-hover); }
  .re-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .re-card { padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .re-card-accent { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; }
  .re-card-accent .re-corridor-label { color: rgba(255,255,255,.7); }
  .re-corridor-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; opacity: .7; }
  .re-corridor-value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .re-card-sub { font-size: 11px; opacity: .7; margin-top: 4px; }
  .re-chart { height: 300px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .re-h2 { font-size: 15px; font-weight: 700; }
  .re-explain { font-size: 12px; color: var(--text-dim); line-height: 1.6; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .re-loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
  .re-error { text-align: center; padding: 40px 20px; color: #ef5350; }
</style>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>实际利率</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav">
    <a href="/rates/">← 利率</a>
    <a href="/volatility/">波动率</a>
    <a href="/rates/fed-funds.html">联邦基金利率</a>
    <a href="/rates/yield-curve.html">收益率曲线</a>
    <a href="/rates/auctions.html">国债拍卖</a>
    <a href="/rates/expectations/">利率预期</a>
  </div>

  <div id="re-cards"></div>
  <div class="re-h2">10Y 名义 / 实际(TIPS) / 盈亏平衡通胀（近 1 年）</div>
  <div class="re-chart" id="triple_chart"></div>
  <div class="re-h2">2Y vs 10Y 收益率（近 1 年）</div>
  <div class="re-chart" id="spread_2_10_chart"></div>
  <div class="re-h2">10Y-2Y 利差（近 1 年）</div>
  <div class="re-chart" id="spread_chart"></div>

  <div class="re-explain">
    读图：名义 = 实际 + 盈亏平衡。若收益率上行主要由实际利率推动 → 金融条件收紧（紧缩交易）；
    若主要由盈亏平衡推动 → 通胀交易。盈亏平衡通胀 = DGS10 − DFII10（本地计算）。
  </div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/rates/real-rates');
  document.getElementById('re-as-of').textContent = `数据截至 ${d.as_of}`;

  const last = (arr) => (arr.length ? arr[arr.length - 1].value : null);
  const card = (label, value, sub, accent = false) => ({ label, value: R.fmtPct(value), sub, accent });
  document.getElementById('re-cards').replaceChildren(R.cards([
    card('10Y 名义利率', last(d.nominal_10y), 'DGS10', true),
    card('10Y 实际利率(TIPS)', last(d.real_10y), 'DFII10'),
    card('10Y 盈亏平衡通胀', last(d.breakeven_10y), '名义 − 实际'),
    card('2Y 国债收益率', last(d.y2), 'DGS2'),
    card('10Y-2Y 利差', last(d.spread_2s10), '(10Y−2Y) %'),
  ]));

  // ── 三线 ──
  R.mkChart('triple_chart', (colors) => ({
    legend: { data: ['10Y 名义利率', '10Y 实际利率(TIPS)', '10Y 盈亏平衡通胀'], top: 4, right: 8, textStyle: { color: colors.text, fontSize: 11 } },
    tooltip: { trigger: 'axis', valueFormatter: v => `${Number(v).toFixed(2)}%` },
    grid: { top: 36, left: 48, right: 16, bottom: 56 },
    dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 8, height: 18 }],
    xAxis: { type: 'category', data: R.ts(d.nominal_10y), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, formatter: '{value}%' }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      { name: '10Y 名义利率', type: 'line', data: R.vs(d.nominal_10y), symbol: 'none', lineStyle: { color: colors.blue, width: 2 } },
      { name: '10Y 实际利率(TIPS)', type: 'line', data: R.vs(d.real_10y), symbol: 'none', lineStyle: { color: colors.orange, width: 2 } },
      { name: '10Y 盈亏平衡通胀', type: 'line', data: R.vs(d.breakeven_10y), symbol: 'none', lineStyle: { color: colors.green, width: 2 } },
    ],
  }));

  // ── 2Y vs 10Y ──
  R.mkChart('spread_2_10_chart', (colors) => ({
    legend: { data: ['2Y', '10Y'], top: 4, right: 8, textStyle: { color: colors.text, fontSize: 11 } },
    tooltip: { trigger: 'axis', valueFormatter: v => `${Number(v).toFixed(2)}%` },
    grid: { top: 36, left: 48, right: 16, bottom: 56 },
    dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 8, height: 18 }],
    xAxis: { type: 'category', data: R.ts(d.y2), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, formatter: '{value}%' }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      { name: '2Y', type: 'line', data: R.vs(d.y2), symbol: 'none', lineStyle: { color: colors.orange, width: 1.5 } },
      { name: '10Y', type: 'line', data: R.vs(d.nominal_10y), symbol: 'none', lineStyle: { color: colors.blue, width: 2 } },
    ],
  }));

  // ── 2s10s 利差 ──
  R.mkChart('spread_chart', (colors) => ({
    tooltip: { trigger: 'axis', valueFormatter: v => `${Number(v).toFixed(2)}%` },
    grid: { top: 16, left: 48, right: 16, bottom: 56 },
    dataZoom: [{ type: 'inside' }, { type: 'slider', bottom: 8, height: 18 }],
    xAxis: { type: 'category', data: R.ts(d.spread_2s10), axisLabel: { color: colors.muted, fontSize: 10 }, axisLine: { lineStyle: { color: colors.border } } },
    yAxis: { type: 'value', axisLabel: { color: colors.muted, formatter: '{value}%' }, scale: true, splitLine: { lineStyle: { color: colors.grid } } },
    series: [{
      type: 'line', data: R.vs(d.spread_2s10), symbol: 'none', lineStyle: { color: colors.blue, width: 2 },
      areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(59,130,246,0.15)' }, { offset: 1, color: 'rgba(59,130,246,0)' }] } },
      markLine: { data: [{ yAxis: 0 }], label: { show: false }, lineStyle: { color: colors.muted, type: 'dashed', width: 1 }, silent: true, symbol: 'none' },
    }],
  }));
}

load().catch(e => R.fail(['re-cards'], e));
</script>
</body>
</html>
