<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>美股</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div id="indices" class="re-cards"></div>
  <div id="index-chart"></div>
  <div id="breadth"></div>
  <div id="abv-chart"></div>
  <div id="analysis"></div>
  <div id="analyst"></div>
  <div id="radar"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/assets/equities');
  const idx = d.indices || [];

  // ── 指数卡片 ──
  const cards = idx.map(i => ({
    label: i.name,
    value: Number(i.last).toLocaleString(undefined, { maximumFractionDigits: 2 }),
    sub: `${i.chg_pct === null || i.chg_pct === undefined ? '—' : (i.chg_pct >= 0 ? '▲ +' : '▼ ') + Number(i.chg_pct).toFixed(2) + '%'} · ${i.date}`,
  }));
  document.getElementById('indices').innerHTML = cards.map(c => `
    <div class="re-card"><div class="re-corridor-label">${c.label}</div>
    <div class="re-corridor-value">${c.value}</div><div class="re-card-sub">${c.sub}</div></div>`).join('');

  if (idx.length) document.getElementById('re-as-of').textContent = '数据截至 ' + idx[0].date;

  // ── 指数归一化走势 ──
  const ch = d.chart || {};
  if (ch.dates && ch.dates.length) {
    const csec = document.createElement('div');
    csec.className = 're-section';
    csec.innerHTML = '<h2>美股指数走势（归一化 %）</h2><div class="chart" id="idx-chart-el" style="height:300px"></div>';
    document.getElementById('index-chart').appendChild(csec);
    const names = { SPX: '标普500', NDX: '纳斯达克100', DJI: '道琼斯', RUT: '罗素2000' };
    R.mkChart('idx-chart-el', colors => ({
      tooltip: { trigger: 'axis', valueFormatter: v => v == null ? '—' : Number(v).toFixed(2) + '%' },
      legend: { top: 0, data: Object.keys(ch.series).map(k => names[k] || k), textStyle: { color: colors.text }, icon: 'rect', itemWidth: 12, itemHeight: 3, itemGap: 10 },
      grid: { left: 48, right: 20, top: 32, bottom: 28 },
      xAxis: { type: 'category', data: ch.dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', axisLabel: { color: colors.muted, fontSize: 11, formatter: v => v + '%' }, splitLine: { lineStyle: { color: colors.grid } } },
      series: Object.keys(ch.series).map(k => ({
        name: names[k] || k, type: 'line', data: ch.series[k], showSymbol: false, smooth: true,
        lineStyle: { width: 1.6 }, emphasis: { focus: 'series' },
      })),
    }));
  }

  // ── 市场广度 ──
  const b = d.breadth || {};
  const bsec = document.createElement('div');
  bsec.className = 're-section';
  bsec.innerHTML = '<h2>市场广度与动能集中度</h2>';
  const label = b.abv200 >= 60 ? '广度健康' : (b.abv200 == null ? '—' : '广度偏弱');
  bsec.innerHTML += `
    <div class="re-badges" style="margin-bottom:8px">
      <span class="re-badge ${b.abv200 >= 60 ? 'bull' : 'bear'}">${label}</span>
      <span class="re-spread">${b.verdict || '—'}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
      <div class="re-card"><div class="re-corridor-label">标普500 · 20日</div>
        <div class="re-corridor-value">${b.spx_20d == null ? '—' : (b.spx_20d >= 0 ? '+' : '') + Number(b.spx_20d).toFixed(2) + '%'}</div>
        <div class="re-card-sub">大盘权重股累计涨跌</div></div>
      <div class="re-card"><div class="re-corridor-label">罗素2000 · 20日</div>
        <div class="re-corridor-value">${b.rut_20d == null ? '—' : (b.rut_20d >= 0 ? '+' : '') + Number(b.rut_20d).toFixed(2) + '%'}</div>
        <div class="re-card-sub">中小盘广度代表累计涨跌</div></div>
      <div class="re-card"><div class="re-corridor-label">SPX − RUT 差距</div>
        <div class="re-corridor-value">${b.gap == null ? '—' : (b.gap >= 0 ? '+' : '') + Number(b.gap).toFixed(2) + ' pp'}</div>
        <div class="re-card-sub">正值 = 大盘领涨 / 广度差</div></div>
      <div class="re-card"><div class="re-corridor-label">200 日均线上方占比</div>
        <div class="re-corridor-value">${b.abv200 == null ? '—' : Number(b.abv200).toFixed(1) + '%'}</div>
        <div class="re-card-sub">标普成分股 · 低于 60% = 内部走弱</div></div>
      <div class="re-card"><div class="re-corridor-label">50 日均线上方占比</div>
        <div class="re-corridor-value">${b.abv50 == null ? '—' : Number(b.abv50).toFixed(1) + '%'}</div>
        <div class="re-card-sub">标普成分股</div></div>
    </div>`;
  document.getElementById('breadth').appendChild(bsec);

  // ── ABV 走势图 ──
  if (b.abv200_series && b.abv200_series.length) {
    const csec = document.createElement('div');
    csec.className = 're-section';
    csec.innerHTML = '<h2>标普500 成分股在均线上方占比走势</h2><div class="chart" id="abv-chart-el" style="height:280px"></div>';
    document.getElementById('abv-chart').appendChild(csec);
    R.mkChart('abv-chart-el', colors => ({
      tooltip: { trigger: 'axis' },
      legend: { data: ['ABV50', 'ABV200'], textStyle: { color: colors.text }, top: 0 },
      grid: { left: 44, right: 16, top: 28, bottom: 28 },
      xAxis: { type: 'category', data: b.abv_dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', min: 40, max: 80, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
      series: [
        { name: 'ABV50', type: 'line', data: b.abv50_series, showSymbol: false, smooth: true, lineStyle: { width: 2, color: colors.orange } },
        { name: 'ABV200', type: 'line', data: b.abv200_series, showSymbol: false, smooth: true, lineStyle: { width: 2, color: colors.blue } },
      ],
    }));
  }

  // ── 分析（3 段）──
  const asec = document.createElement('div');
  asec.className = 're-section';
  asec.innerHTML = '<h2>AI 分析 · 动能集中度</h2>';
  Object.entries(d.analysis || {}).forEach(([k, v]) => {
    if (!v || !v.text) return;
    const blk = document.createElement('div');
    blk.className = 'sig-block';
    blk.innerHTML = `<div class="sig-title">${v.title}</div><p>${v.text}</p>`;
    asec.appendChild(blk);
  });
  document.getElementById('analysis').appendChild(asec);

  // ── Nasdaq 100 分析师目标价 ──
  const a = d.analyst || {};
  if (a.rows > 10) {
    const sec = document.createElement('div');
    sec.className = 're-section';
    sec.innerHTML = `<h2>Nasdaq 100 分析师目标价</h2>
      <div class="src-note">基于 Yahoo Finance / yfinance 的 12 个月分析师共识目标价，日频缓存展示。
        source: Yahoo Finance / yfinance · fetch date ${a.date} · 等权平均，不按市值加权</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
        <div class="re-card"><div class="re-corridor-value">${a.coverage_pct == null ? '—' : a.coverage_pct + '%'}</div>
          <div class="re-card-sub">${a.rows}/${a.total} 有共识目标价</div></div>
        <div class="re-card"><div class="re-corridor-value">${(a.avg_upside >= 0 ? '+' : '') + a.avg_upside + '%'}</div>
          <div class="re-card-sub">等权平均</div></div>
        <div class="re-card"><div class="re-corridor-value">${(a.trim_upside >= 0 ? '+' : '') + a.trim_upside + '%'}</div>
          <div class="re-card-sub">去极值后的典型股票</div></div>
        <div class="re-card"><div class="re-corridor-value">${a.above_share}%</div>
          <div class="re-card-sub">${a.above_cnt}/${a.rows} 目标价高于现价</div></div>
        <div class="re-card"><div class="re-corridor-value">${a.avg_analysts}</div>
          <div class="re-card-sub">平均分析师数 · 样本越高噪音越低</div></div>
      </div>`;
    ['tops', 'bottoms', 'divs'].forEach((k, i) => {
      const [title, hint] = [['上行空间 Top 10', ''], ['下行风险 Top 10', ''], ['目标价分歧 Top 10', '最高 − 最低']][i];
      sec.innerHTML += `<div class="re-col3"><div class="re-colbox">
        <div class="re-colbox-title">${title}</div>
        ${a[k].map(r => `<div class="rk-row"><span class="rk-t">${r.ticker}</span>
          <span class="rk-n">${r.company}</span>
          <span class="rk-v">${fp(r.upside)}${k === 'divs' ? ' · ' + id(r.high) + ' - ' + id(r.low) : ''}</span></div>`).join('')}
      </div></div>`;
    });
    sec.innerHTML += `
      <div class="re-table-wrap"><div class="re-table-title">行业目标价空间</div>
      <table class="re-table"><thead><tr>
        <th>行业</th><th>覆盖</th><th>平均空间</th><th>中位空间</th><th>平均分析师数</th>
      </tr></thead><tbody>
      ${a.industries.map(r => `<tr><td>${r.industry}</td><td>${r.coverage}/${a.total}</td>
        <td>${(r.avg >= 0 ? '+' : '') + r.avg + '%'}</td><td>${(r.med >= 0 ? '+' : '') + r.med + '%'}</td>
        <td>${r.analysts}</td></tr>`).join('')}
      </tbody></table></div>`;
    sec.innerHTML += `
      <div class="re-table-wrap"><div class="re-table-title">完整目标价表</div>
      <div class="src-note">平均/最高/最低目标价来自分析师共识；隐含空间 = 平均目标价相对当前价。</div>
      <table class="re-table"><thead><tr>
        <th>Ticker</th><th>公司</th><th>行业</th><th>现价</th><th>平均目标</th><th>最高</th><th>最低</th>
        <th>隐含空间</th><th>分析师</th><th>评级</th>
      </tr></thead><tbody>
      ${a.table.map(r => `<tr><td class="mono">${r.ticker}</td><td>${r.company}</td><td>${r.industry}</td>
        <td>${id(r.price)}</td><td>${id(r.mean)}</td><td>${id(r.high)}</td><td>${id(r.low)}</td>
        <td>${fp(r.upside)}</td><td>${r.analysts ?? '—'}</td>
        <td>${r.rating ?? '—'}</td></tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById('analyst').appendChild(sec);
  }

  // ── Nasdaq 100 成分股雷达 ──
  const r = d.radar || {};
  if (r.rows > 10) {
    const sec = document.createElement('div');
    sec.className = 're-section';
    sec.innerHTML = `<h2>Nasdaq 100 成分股雷达</h2>
      <div class="src-note">source: Wikipedia Nasdaq-100 current components · price date ${r.date}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px">
        <div class="re-card"><div class="re-corridor-value">${r.price_share}%</div>
          <div class="re-card-sub">${r.rows}/${r.total} ticker 有价格</div></div>
        <div class="re-card"><div class="re-corridor-value">${r.today_up_pct}%</div>
          <div class="re-card-sub">${r.today_up}/${r.rows} 当日上涨</div></div>
        <div class="re-card"><div class="re-corridor-value">${r.above50_pct}%</div>
          <div class="re-card-sub">短中期内部动能（50DMA+）</div></div>
        <div class="re-card"><div class="re-corridor-value">${r.above200_pct}%</div>
          <div class="re-card-sub">长期趋势健康度（200DMA+）</div></div>
        <div class="re-card"><div class="re-corridor-value">${(r.avg20 >= 0 ? '+' : '') + r.avg20 + '%'}</div>
          <div class="re-card-sub">去权重后的典型股票表现（20D）</div></div>
      </div>`;
    sec.innerHTML += `
      <div class="re-table-wrap"><div class="re-table-title">行业强弱</div>
      <div class="src-note">按成分股等权计算，重点看 20 日表现与 50 日均线上方占比。</div>
      <table class="re-table"><thead><tr><th>行业</th><th>覆盖</th><th>1D</th><th>20D</th><th>50DMA+</th></tr></thead><tbody>
      ${r.industries.map(x => `<tr><td>${x.industry}</td><td>${x.coverage}</td>
        <td>${fp(x.chg1)}</td><td>${fp(x.chg20)}</td>
        <td>${x.above50}%</td></tr>`).join('')}
      </tbody></table></div>`;
    sec.innerHTML += `<div class="re-col3">
      <div class="re-colbox"><div class="re-colbox-title">20D 最强</div>
        ${r.strong20.map(x => `<div class="rk-row"><span class="rk-t">${x.ticker}</span><span class="rk-n">${x.company}</span><span class="rk-v">${fp(x.chg20)}</span></div>`).join('')}
      </div><div class="re-colbox"><div class="re-colbox-title">20D 最弱</div>
        ${r.weak20.map(x => `<div class="rk-row"><span class="rk-t">${x.ticker}</span><span class="rk-n">${x.company}</span><span class="rk-v">${fp(x.chg20)}</span></div>`).join('')}
      </div></div>`;
    sec.innerHTML += `
      <div class="re-table-wrap"><div class="re-table-title">完整成分股行情</div>
      <div class="src-note">日线收盘价，不是实时 tick。</div>
      <table class="re-table"><thead><tr>
        <th>Ticker</th><th>公司</th><th>行业</th><th>收盘</th><th>1D</th><th>5D</th><th>20D</th><th>60D</th><th>50D</th><th>200D</th>
      </tr></thead><tbody>
      ${r.table.map(x => `<tr><td class="mono">${x.ticker}</td><td>${x.company}</td><td>${x.industry}</td>
        <td>${id(x.price)}</td>
        <td>${fp(x.chg1)}</td><td>${fp(x.chg5)}</td><td>${fp(x.chg20)}</td><td>${fp(x.chg60)}</td>
        <td>${x.above50 ? '<span class="re-badge bull">上方</span>' : '<span class="re-badge bear">下方</span>'}</td>
        <td>${x.above200 === null ? '—' : (x.above200 ? '<span class="re-badge bull">上方</span>' : '<span class="re-badge bear">下方</span>')}</td>
        </tr>`).join('')}
      </tbody></table></div>`;
    sec.innerHTML += `
      <div class="re-table-wrap"><div class="re-table-title">近期收盘价（最近 20 个交易日）</div>
      <table class="re-table"><thead><tr><th>日期</th><th>标普500</th><th>纳斯达克100</th><th>道琼斯</th><th>罗素2000</th></tr></thead><tbody>
      ${r.recent.map(x => `<tr><td class="mono">${x.date}</td><td>${id(x.SPX)}</td><td>${id(x.NDX)}</td><td>${id(x.DJI)}</td><td>${id(x.RUT)}</td></tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById('radar').appendChild(sec);
  }

  document.getElementById('re-gen').textContent = '规则引擎生成（LLM 预留）· 广度 source: yfinance 批量 / 目标价 source: yfinance / 成分股 source: Wikipedia';
}

function id(v) { return v == null ? '—' : Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function fp(v) { return v == null ? '—' : (Number(v) >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }

load().catch(e => R.fail(['indices', 'index-chart', 'breadth', 'abv-chart', 'analysis', 'analyst', 'radar'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
