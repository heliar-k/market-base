<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权市场结构 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>期权市场结构</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <p class="opt-note">期权链快照口径。OI/GEX 按最近可得未平仓数据计算；GEX/DEX/Vanna 为模型估算，非交易所官方利用率或持仓方向。</p>

  <div id="detail"></div>

  <div id="board"></div>

  <div class="opt-tabs" id="opt-tabs"></div>
  <div class="opt-panel" id="opt-panel"></div>

  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
let D = null;
let S = 'SPY';
let charts = [];

const TABS = ['GEX 分布', 'DEX', 'IV 期限结构', 'Skew', 'Vanna / Charm', 'OI 热力', '结构解读'];
let curTab = TABS[0];

const REGIME_INFO = {
  pp: { label: '正 Gamma + 正 Delta', desc: '现价在 Gamma Flip 上方，波动偏被压制，多头 delta 占优。' },
  pn: { label: '正 Gamma + 负 Delta', desc: '现价在 Gamma Flip 上方，但 delta 偏空。' },
  np: { label: '负 Gamma + 正 Delta', desc: '现价在 Gamma Flip 下方，波动易放大，多头 delta 占优。' },
  nn: { label: '负 Gamma + 负 Delta', desc: '现价在 Gamma Flip 下方，delta 偏空，双重压力。' },
};
const BUCKET_NAMES = { '0DTE': '0DTE · 当日', '本周': '本周 · 1-7d', '月度': '月度 · 8-35d', '季度+': '季度+ · >35d' };

function fmtNum(v, d = 2) {
  return v === null || v === undefined ? '—' : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
}
function chgSpan(v) {
  return Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function disposeCharts() { charts.forEach(c => { try { c.dispose(); } catch (e) {} }); charts = []; }
function mk(id, option) {
  const el = document.getElementById(id);
  if (!el) return;
  const c = R.mkChart(id, option);
  if (c) charts.push(c);
}

async function load() {
  D = await R.get('/api/assets/equities-options');
  if (!D || !D.symbols) { R.fail(['detail', 'board'], new Error('无期权结构快照')); return; }
  document.getElementById('re-as-of').textContent = '快照时间 · ' + (D.date || '');

  renderRegime();
  renderBoard();
  renderTabs();
  renderPanel();
  document.getElementById('re-gen').textContent = 'GEX/DEX/Vanna/Charm 为模型估算（BSM，yfinance 降级源），非交易所官方持仓方向。真实 OI + IV。';
}

// ── Regime 大卡 + 4 指标卡（timsun 复刻） ──
// Regime 的 Gamma 正负 = 局部（现价 vs Gamma Flip），不是 Net GEX 符号；
// Net GEX 仅是全部合约强度参考——timsun 同款判定（SPY：Flip 下方 34.7% 但 GEX 为负 → 正 Gamma）。
function regimeKey(v) {
  const localPos = v.flip_dist == null ? v.net_gex >= 0 : v.flip_dist >= 0;
  return (localPos ? 'p' : 'n') + (v.net_dex >= 0 ? 'p' : 'n');
}

function renderRegime() {
  const v = D.symbols[S];
  if (!v) return;
  const key = regimeKey(v);
  const ri = REGIME_INFO[key];
  // 全部期权净 GEX 与现价附近 Gamma 状态相反 → 短线提示（timsun 同款）
  const localPos = v.flip_dist != null && v.flip_dist >= 0;
  const flipText = v.flip_dist == null ? null : Math.abs(v.flip_dist).toFixed(1);
  const flipSign = v.flip_dist == null || v.flip_dist >= 0 ? '高' : '低';
  const opposite = localPos !== (v.net_gex >= 0);
  const d = document.getElementById('detail');
  d.innerHTML = `
  <div class="opt-regime">
    <div class="rg-label">${S} · 期权结构 REGIME</div>
    <div class="rg-top">
      <div>
        <div class="rg-title ${key}">${ri.label}</div>
        <div class="rg-sub">现价 ${fmtNum(v.spot)} · ${localPos ? '局部正 Gamma' : '局部负 Gamma'} · ${v.net_dex >= 0 ? '正 Delta' : '负 Delta'}</div>
      </div>
      <div class="rg-gex">
        <div><div class="k">NET GEX</div><div class="v" style="color:${v.net_gex >= 0 ? '#26a69a' : '#ef5350'}">${v.net_gex >= 0 ? '+' : ''}${fmtNum(v.net_gex)} B</div></div>
        <div><div class="k">NET DEX</div><div class="v" style="color:${v.net_dex >= 0 ? '#26a69a' : '#ef5350'}">${v.net_dex >= 0 ? '+' : ''}${fmtNum(v.net_dex)} B</div></div>
      </div>
    </div>
    <div class="rg-desc">${ri.desc}${flipText ? ` 距 Gamma Flip ${flipDistText(v)}。` : ''}${opposite ? '全部期权合约合计的 Net GEX 与现价附近的 Gamma 状态相反，短线判断优先看现价附近的 Gamma 状态。' : ''}</div>
  </div>
  <div class="re-cards" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:12px">
    <div class="re-card"><div class="re-corridor-label">Gamma Flip</div>
      <div class="re-corridor-value">${v.gamma_flip == null ? '—' : fmtNum(v.gamma_flip, 1)}</div>
      <div class="re-card-sub">现价 ${flipSign} ${flipText || '—'}%</div></div>
    <div class="re-card"><div class="re-corridor-label">Call Wall · 阻力</div>
      <div class="re-corridor-value">${fmtNum(v.call_wall?.strike, 1)}</div>
      <div class="re-card-sub">${v.call_wall ? '+' + fmtNum(v.call_wall.per_point_m, 1) + ' M / 点' : '—'}</div></div>
    <div class="re-card"><div class="re-corridor-label">Put Wall · 支撑</div>
      <div class="re-corridor-value">${fmtNum(v.put_wall?.strike, 1)}</div>
      <div class="re-card-sub">${v.put_wall ? fmtNum(v.put_wall.per_point_m, 1) + ' M / 点' : '—'}</div></div>
    <div class="re-card"><div class="re-corridor-label">25Δ Skew</div>
      <div class="re-corridor-value">${v.skew == null ? '—' : fmtNum(v.skew)}</div>
      <div class="re-card-sub">${v.skew_dte || '—'}D · P ${v.skew_put_iv ?? '—'}% / C ${v.skew_call_iv ?? '—'}%</div></div>
  </div>`;
}

function flipDistText(v) {
  return `${Math.abs(v.flip_dist).toFixed(2)}%`;
}

// ── 13 标的看板 ──
function renderBoard() {
  const syms = D.symbols;
  const groups = [
    ['指数 / ETF', ['SPY', 'QQQ', 'IWM']],
    ['Mag 7', ['NVDA', 'AAPL', 'MSFT', 'AMZN', 'META', 'TSLA', 'GOOGL']],
    ['重点个股', ['AVGO', 'BRK-B', 'JPM']],
  ];
  const board = document.getElementById('board');
  board.innerHTML = '<h2 class="re-h2" style="margin:0 0 8px">13 标的看板</h2>';
  groups.forEach(([title, list]) => {
    const sec = document.createElement('div');
    sec.className = 're-section';
    sec.style.marginBottom = '12px';
    sec.innerHTML = `<h2 style="white-space:nowrap">${title}</h2>`;
    const rows = list.filter(s => syms[s]).map(s => {
      const v = syms[s];
      return { symbol: s, spot: v.spot, gex: v.net_gex, key: regimeKey(v), _sym: s };
    });
    sec.appendChild(R.table(['标的', '现价', 'Net GEX (B)', 'Regime'], rows, {
      symbol: (v2, row) => `<a href="javascript:pick('${row._sym}')" style="color:var(--accent)">${v2}</a>`,
      gex: v2 => `<span style="color:${v2 >= 0 ? '#26a69a' : '#ef5350'}">${v2 >= 0 ? '+' : ''}${fmtNum(v2)}</span>`,
      key: v2 => `<span class="opt-chip ${v2}">${REGIME_INFO[v2].label}</span>`,
    }, ['symbol', 'spot', 'gex', 'key'], true));
    board.appendChild(sec);
  });
  board.insertAdjacentHTML('beforeend', '<p class="re-source">列：标的 · 现价 · Net GEX (B) · Regime。点击任意标的切换主视图。</p>');
}

function pick(s) { S = s; renderRegime(); renderPanel(); }

// ── 板块 Tab ──
function renderTabs() {
  const el = document.getElementById('opt-tabs');
  el.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    b.className = t === curTab ? 'active' : '';
    b.addEventListener('click', () => { curTab = t; renderTabs(); renderPanel(); });
    el.appendChild(b);
  });
}

function renderPanel() {
  disposeCharts();
  const panel = document.getElementById('opt-panel');
  panel.innerHTML = '';
  const v = D.symbols[S];
  if (!v) return;
  ({ 'GEX 分布': pGex, 'DEX': pDex, 'IV 期限结构': pIv, 'Skew': pSkew, 'Vanna / Charm': pVanna, 'OI 热力': pOi, '结构解读': pNarrative })[curTab](panel, v);
  if (curChartOpt) {
    panel.querySelectorAll('.chart').forEach(el => mk(el.id, curChartOpt));
    curChartOpt = null;
  }
}

// ── GEX 分布 tab ──
function pGex(panel, v) {
  panel.innerHTML = `
    <h3>${S} · GEX 按行权价分布</h3>
    <p style="margin:0 0 10px;font-size:12px;color:var(--text-secondary)">绿色 = Call GEX × OI（dealer 净多，压制波动）；红色 = Put GEX × OI（dealer 净空，放大波动）；黑色曲线 = 累计 GEX（右轴，穿越 0 线即 Gamma Flip）。蓝线 = 现价。</p>
    <div class="chart" id="gex-chart" style="height:300px"></div>
    <h3 style="margin-top:16px">到期日 Gamma 集中度</h3>
    <div id="buckets"></div>
    <p class="re-source" style="margin:8px 0 0">GEX 分布较均衡，walls 在多个时间尺度上都有部分约束力。</p>`;
  curChartOpt = colors => {
    const g0 = (v.wall && v.wall.length ? v.wall : (v.gex_dist || [])).slice().sort((a, b) => a.strike - b.strike);
    // timsun 同款：只画有效区间（|gex| 显著的行权价，两端 0 值远端不挤占 x 轴）
    const significant = g0.filter(x => Math.abs(x.gex_m || 0) >= 0.5);
    const g = (significant.length ? significant : g0).slice();
    const ss = g.map(x => x.strike);
    const axisIdx = x => {
      if (!ss.length) return 0;
      if (x <= ss[0]) return 0;
      if (x >= ss[ss.length - 1]) return ss.length - 1;
      let lo = 0, hi = ss.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ss[mid] < x) lo = mid; else hi = mid; }
      return lo + (x - ss[lo]) / (ss[hi] - ss[lo]);
    };
    const vmax = Math.max(...g.map(x => Math.abs(x.call_gex_m || 0)), ...g.map(x => Math.abs(x.put_gex_m || 0)), 10);
    // 累计 GEX（按行权价升序，穿越 0 点即 Gamma Flip 所在区间）
    let acc = 0;
    const cum = g.map(x => { acc += (x.call_gex_m || 0) + (x.put_gex_m || 0); return Math.round(acc * 10) / 10; });
    const cumMax = Math.max(...cum.map(Math.abs), 10);
    return {
      tooltip: { trigger: 'axis' },
      legend: { data: ['Call GEX', 'Put GEX', '累计 GEX'], orient: 'vertical', right: 4, top: 'middle', textStyle: { color: colors.text, fontSize: 11 }, itemWidth: 14, itemHeight: 8 },
      grid: { left: 52, right: 84, top: 28, bottom: 52 },
      xAxis: { type: 'category', data: ss, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 10, rotate: 0 }, name: '行权价', nameLocation: 'middle', nameGap: 32, nameTextStyle: { color: colors.muted, fontSize: 10 } },
      yAxis: [
        { type: 'value', min: -vmax, max: vmax, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
        { type: 'value', min: -cumMax, max: cumMax, position: 'right', splitLine: { show: false }, axisLabel: { color: colors.muted, fontSize: 11 } },
      ],
      series: [
        {
          name: 'Call GEX', type: 'bar', data: g.map(x => x.call_gex_m),
          itemStyle: { color: '#26a69a' },
          markLine: {
            silent: true, symbol: 'none',
            data: [
              { xAxis: axisIdx(v.spot), lineStyle: { color: colors.blue, width: 2 }, label: { show: true, formatter: '现价', color: colors.muted, fontSize: 10 } },
              ...(v.gamma_flip ? [{ xAxis: axisIdx(v.gamma_flip), lineStyle: { color: colors.gray, type: 'dashed', width: 1.5 }, label: { show: true, formatter: 'Flip', color: colors.muted, fontSize: 10 } }] : []),
            ],
          },
        },
        { name: 'Put GEX', type: 'bar', data: g.map(x => x.put_gex_m), itemStyle: { color: '#ef5350' } },
        // 累计 GEX 曲线（右轴）：穿越 0 线 = 累计翻正，即 Gamma Flip 所在区间
        { name: '累计 GEX', type: 'line', yAxisIndex: 1, data: cum,
          showSymbol: false, smooth: true, lineStyle: { width: 2, color: colors.text },
          areaStyle: { opacity: 0.08 } },
      ],
    };
  };
  // 到期 Gamma 集中度水平条
  const buckets = v.buckets || {};
  const entries = Object.entries(buckets);
  const maxPct = Math.max(...entries.map(([, b]) => b.gex_pct ?? 0), 1);
  const dom = document.getElementById('buckets');
  let domLabel = null, domPct = 0;
  dom.innerHTML = entries.map(([k, b]) => {
    const pct = b.gex_pct ?? 0;
    if (pct > domPct) { domPct = pct; domLabel = k; }
    return `<div class="range-row">
      <span>${BUCKET_NAMES[k] || k}</span>
      <div class="range-track"><div class="range-fill" style="width:${(pct / maxPct * 100).toFixed(1)}%"></div></div>
      <span class="range-val"><b>${pct.toFixed(1)}%</b> · ${fmtNum(b.contracts, 0)} 合约</span>
    </div>`;
  }).join('');
  dom.insertAdjacentHTML('beforeend', `<p class="re-source" style="margin:8px 0 0">${domLabel && domPct ? `${BUCKET_NAMES[domLabel]} 占主导（${domPct.toFixed(1)}%）` : ''}</p>`);
}

// ── DEX tab ──
function pDex(panel, v) {
  const pos = v.net_dex >= 0;
  panel.innerHTML = `
    <h3>${S} · Net DEX</h3>
    <div class="re-cards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="re-card"><div class="re-corridor-label">Net DEX</div>
        <div class="re-corridor-value" style="color:${pos ? '#26a69a' : '#ef5350'}">${pos ? '+' : ''}${fmtNum(v.net_dex)} <span style="font-size:13px">B</span></div>
        <div class="re-card-sub">市场 dealer book 净${pos ? '做多' : '做空'}，delta 敞口偏向上行${pos ? '' : '下行'}。</div></div>
      <div class="re-card"><div class="re-corridor-label">Call 端 DEX</div>
        <div class="re-corridor-value">${v.net_dex >= 0 ? '+' : ''}${fmtNum(v.call_dex)} <span style="font-size:13px">B</span></div>
        <div class="re-card-sub">call 端按正向 delta 敞口折算</div></div>
      <div class="re-card"><div class="re-corridor-label">Put 端 DEX</div>
        <div class="re-corridor-value">${v.net_dex >= 0 ? '+' : ''}${fmtNum(v.put_dex)} <span style="font-size:13px">B</span></div>
        <div class="re-card-sub">put 端按卖保护口径翻号折算</div></div>
    </div>
    <p class="re-source" style="margin:10px 0 0">DEX = Σ(delta × OI × 100 × S)。模型口径：call 端按正向 delta 计入，put 端翻号后合并。P/C OI 比: ${fmtNum(v.pcr_oi)} · 成交量比: ${fmtNum(v.pcr_vol)}</p>`;
}

// ── IV 期限结构 tab ──
function pIv(panel, v) {
  const contango = (v.iv_slope ?? 0) > 0;
  panel.innerHTML = `
    <h3>${S} · ATM IV 期限结构</h3>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div class="re-badges">
        <span class="re-badge ${contango ? 'bull' : 'bear'}">${contango ? 'Contango（远月溢价 · 正常风险定价）' : 'Backwardation（近端升水）'}</span>
        <span class="re-spread">斜率 ${v.iv_slope == null ? '—' : fmtNum(v.iv_slope)} pt</span>
      </div>
      <div style="display:flex;gap:18px;font-size:13px">
        <span>Front (${v.iv_front?.dte || '—'}D) <b>${v.iv_front?.iv ?? '—'}%</b></span>
        <span>Back (${v.iv_back?.dte || '—'}D) <b>${v.iv_back?.iv ?? '—'}%</b></span>
      </div>
    </div>
    <div class="chart" id="iv-chart" style="height:240px"></div>
    <p class="re-source" style="margin:8px 0 0">Skew ${v.skew == null ? '—' : fmtNum(v.skew)} — ${Math.abs(v.skew ?? 0) < 0.5 ? 'Skew 平坦 — 市场对上下行风险定价相对均衡' : (v.skew < 0 ? 'Skew 偏负 — 市场为下行风险支付溢价' : 'Skew 偏正 — 市场为上行风险支付溢价')}</p>`;
  curChartOpt = colors => ({
    tooltip: { trigger: 'axis' },
    grid: { left: 40, right: 16, top: 20, bottom: 28 },
    xAxis: { type: 'category', data: v.iv_curve.map(x => (x.dte || '') + 'D'), axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 10 } },
    yAxis: { type: 'value', axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [{ type: 'line', data: v.iv_curve.map(x => x.iv), showSymbol: true, lineStyle: { width: 2, color: colors.blue } }],
  });
}

// ── Skew tab ──
function pSkew(panel, v) {
  const skew = v.skew;
  const flat = skew == null || Math.abs(skew) < 0.5;
  const verdict = skew == null ? '暂无数据' : flat ? 'Skew 平坦 — 市场对上下行风险定价相对均衡' : skew < 0 ? 'Skew 偏负 — 市场为下行风险支付溢价，保护需求偏强' : 'Skew 偏正 — 市场为上行风险支付溢价';
  panel.innerHTML = `
    <h3>${S} · 25Δ Skew</h3>
    <div class="re-cards" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
      <div class="re-card"><div class="re-corridor-label">25Δ Skew</div>
        <div class="re-corridor-value">${fmtNum(skew)}</div>
        <div class="re-card-sub">${v.skew_dte || '—'}D 期限</div></div>
      <div class="re-card"><div class="re-corridor-label">Put IV (25Δ)</div>
        <div class="re-corridor-value">${v.skew_put_iv ?? '—'}%</div>
        <div class="re-card-sub">${v.skew_dte || '—'}D</div></div>
      <div class="re-card"><div class="re-corridor-label">Call IV (25Δ)</div>
        <div class="re-corridor-value">${v.skew_call_iv ?? '—'}%</div>
        <div class="re-card-sub">${v.skew_dte || '—'}D</div></div>
      <div class="re-card"><div class="re-corridor-label">P/C IV 差</div>
        <div class="re-corridor-value">${v.skew_put_iv != null && v.skew_call_iv != null ? (v.skew_put_iv - v.skew_call_iv).toFixed(1) : '—'} pt</div>
        <div class="re-card-sub">正 = put 偏贵</div></div>
    </div>
    <p class="re-source" style="margin:10px 0 0">${verdict}。25Δ skew = 25Δ put IV − 25Δ call IV（vol skew），负值代表市场为下行风险支付更高溢价。</p>`;
}

// ── Vanna / Charm tab ──
function pVanna(panel, v) {
  const vpos = (v.net_vanna ?? 0) >= 0;
  const near7 = v.charm_near7;
  panel.innerHTML = `
    <h3>${S} · Vanna / Charm</h3>
    <div class="re-cards" style="grid-template-columns:1fr 1fr">
      <div class="re-card"><div class="re-corridor-label">Net Vanna (dealer)</div>
        <div class="re-corridor-value" style="color:${vpos ? '#26a69a' : '#ef5350'}">${vpos ? '+' : ''}${fmtNum(v.net_vanna)} <span style="font-size:13px">B</span></div>
        <div class="re-card-sub">${vpos ? '正 Vanna（IV 下降助推上涨）' : '负 Vanna（IV 下降削弱上涨）'}</div></div>
      <div class="re-card"><div class="re-corridor-label">Total Charm</div>
        <div class="re-corridor-value">${fmtNum(v.net_charm)} <span style="font-size:13px">B</span></div>
        <div class="re-card-sub">近 ${v.charm_near7_dte || 7} 天到期贡献 ${near7 ?? '—'}%</div></div>
    </div>
    <p class="re-source" style="margin:10px 0 0" id="vanna-desc"></p>
    <p class="re-source" style="margin:8px 0 0" id="charm-desc"></p>
    <p class="re-source" style="margin:8px 0 0">${vpos ? 'IV 回落时做市商将被迫买入现货，支撑价格。反之 IV 飙升时做市商减多。' : 'IV 回落时做市商被迫卖出，价格承压；IV 飙升时减仓平抑波动。'}</p>
    <p class="re-source" style="margin:8px 0 0">${near7 != null && near7 >= 40 ? `近 7 天到期合约贡献 ${near7.toFixed(0)}% 的 Charm — 盘中磁吸效应强，周到期前 delta 衰减快。` : ''}</p>
    <p class="re-source" style="margin:8px 0 0">Vanna ≈ −γ·S·√T·d1 × OI × 100（基于 BSM；d1 由 Φ⁻¹(delta) 反推）。Charm ≈ γ·S / (2√T) × OI × 100，近到期放大。符号采用 call 正向、put 翻号的统一估算口径。</p>`;
}

// ── OI 热力 tab ──
function pOi(panel, v) {
  panel.innerHTML = `<h3>OI 集中度 Top 20 · (Strike × 到期)</h3><p style="margin:0 0 8px;font-size:12px;color:var(--text-secondary)">按总 OI (call + put) 排序，观察 dealer 关键 pin 位。</p>`;
  const rows = v.oi_top || [];
  const tbl = R.table(['Strike', '到期', 'Call OI', 'Put OI', '总 OI', 'Call Vol', 'Put Vol'], rows, {
    call_oi: v2 => (Number(v2) / 1000).toFixed(1) + 'K',
    put_oi: v2 => (Number(v2) / 1000).toFixed(1) + 'K',
    total: v2 => (Number(v2) / 1000).toFixed(1) + 'K',
    call_vol: v2 => (Number(v2) / 1000).toFixed(1) + 'K',
    put_vol: v2 => (Number(v2) / 1000).toFixed(1) + 'K',
  });
  panel.appendChild(tbl);
}

// ── 结构解读 tab（后端规则引擎 narrative）──
function pNarrative(panel, v) {
  const n = v.narrative;
  if (!n) { panel.innerHTML = '<p class="re-source">暂无结构解读。</p>'; return; }
  const h = [];
  h.push(`<h3>${n.gamma.title}</h3><p style="font-size:13px;line-height:1.8;color:var(--text-secondary)">${n.gamma.text}</p>`);
  [n.range, n.vol].forEach(b => {
    h.push(`<div class="re-section" style="margin-bottom:12px">
      <h2 style="display:flex;align-items:center;justify-content:space-between;gap:8px">${b.title}<span class="vol-score" style="font-size:11px">确信度 · ${b.confidence}</span></h2>
      <div class="kv-row"><span class="kv-k">含义</span><span>${b.meaning}</span></div>
      <div class="kv-row"><span class="kv-k">观察</span><span>${b.watch}</span></div>
      ${b.direction ? `<div class="kv-row"><span class="kv-k">方向</span><span>${b.direction}</span></div>` : ''}
      ${b.invalid ? `<div class="kv-row"><span class="kv-k">失效</span><span>${b.invalid}</span></div>` : ''}
      <div class="kv-row"><span class="kv-k">风险</span><span>${b.risk}</span></div>
    </div>`);
  });
  h.push(`<div class="re-section" style="margin-bottom:12px">
    <h2>关键监控水平</h2>
    ${(n.levels || []).map(l => `<div class="kv-row"><span class="kv-k" style="font-weight:800">${l.value}</span><span><b>${l.label}</b> — ${l.desc}</span></div>`).join('')}
  </div>`);
  h.push(`<div class="re-section" style="margin-bottom:12px">
    <h2>当前环境下不宜</h2>
    ${(n.avoid || []).map(t => `<div class="re-check"><span class="no">✕</span><span>${t}</span></div>`).join('')}
  </div>`);
  h.push(`<div class="re-section" style="margin-bottom:12px">
    <h2>跨资产联动</h2>
    <p style="margin:0">${n.cross}</p>
  </div>`);
  panel.innerHTML = h.join('');
}

let curChartOpt = null;

load().catch(e => R.fail(['detail', 'board'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
