<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持仓追踪（CFTC COT） — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>持仓追踪（CFTC COT）</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <p class="pos-rules">基于 CFTC Commitments of Traders 周报，追踪投机方（对冲基金 / 资管）净持仓相对 2 年历史区间的百分位极端度；每周五收盘统计、周二 15:30 ET 发布，判读规则见下方卡片底部。</p>

  <div id="overview"></div>
  <div id="groups"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
const GNAMES = { index_vol: '股指 / 波动率', rates: '利率 / 美债', fx: '外汇', commodities: '商品' };
const charts = [];

function badgeClass(label) {
  if (label.startsWith('极度')) return 'extreme';
  if (label === '偏多') return 'bullish';
  return 'neutral';
}
function num(v) { return v == null ? '—' : Number(v).toLocaleString(); }

async function load() {
  const d = await R.get('/api/assets/positioning');
  if (!d.latest_report) { R.fail(['overview', 'groups'], new Error('COT 数据不足')); return; }
  document.getElementById('re-as-of').textContent = '最新报告日 ' + d.latest_report + ' · 投机方：股指/利率/外汇 = 对冲基金（Leveraged Money），商品 = 管理资金（Managed Money）';

  renderOverview(d);
  d.groups.forEach(g => renderGroup(g));
  document.getElementById('re-gen').textContent = '口径：CFTC COT · 判读规则见页首卡片底部 · 研究参考非投资建议';
}

// ── Positioning Readthrough（timsun 复刻）──
function renderOverview(d) {
  const o = d.overview || {};
  const c = d.crowding;
  const crowdLabel = c == null ? '数据不足' : c >= 50 ? '仓位偏拥挤' : c >= 30 ? '仓位中性' : '仓位分散';
  const extremes = (o.extremes || []).map(x => `${x.name}(${x.pct_2y.toFixed(1)})`).join('、');
  const desc = c == null ? ''
    : `当前 CFTC 投机仓位整体为「${crowdLabel}」，方向上${o.bias || '中性'}。最极端的合约是 ${extremes}。这说明仓位本身已经包含了一部分市场共识，后续更重要的是看价格是否继续确认，而不是只看净多净空绝对值。`;
  const el = document.getElementById('overview');
  el.innerHTML = `
  <div class="pos-hero">
    <div>
      <div class="ph-label">POSITIONING READTHROUGH</div>
      <div class="ph-title">${crowdLabel}<span class="ph-sub">拥挤度 ${c == null ? '—' : c.toFixed(1)}/100</span></div>
      <div class="ph-desc">${desc}</div>
    </div>
    <div class="ph-side">
      <div>偏多 ${o.counts?.bull ?? '—'} · 偏空 ${o.counts?.bear ?? '—'} · 极端 ${o.counts?.extreme ?? '—'} 个</div>
      <div>百分位越靠近 0 或 100，仓位越拥挤；拥挤不是反转信号，但会放大反向时的波动。</div>
      <div><b>读法：</b>价格涨且净仓增是趋势确认；价格涨但净仓降是早期背离。</div>
    </div>
    <div class="ph-rules">
      <span class="ph-rules-label">判读规则 · 净多头百分位（2 年）</span>
      <span class="ph-rules-text">≥90 极度看多 · ≥75 偏多 · ≤25 偏空 · ≤10 极度看空 · 其余中性</span>
    </div>
  </div>`;
}

// ── 分组合约卡 ──
function renderGroup(g) {
  const wrap = document.getElementById('groups');
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.style.marginBottom = '16px';
  sec.innerHTML = `<h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;font-size:13px">${GNAMES[g.name] || g.name}<span class="re-badge neutral" style="flex-shrink:0">${g.contracts.length} 合约</span></h2>`;
  const note = document.createElement('div');
  note.className = 'pos-group-note';
  note.innerHTML = `${TIPS[g.name] || ''}<br>${g.verdict || ''}<br><b>本组最需要关注：</b>${g.focus?.name || g.focus?.symbol || '—'}，2 年百分位 ${g.focus?.pct_2y ?? '—'}。`;
  sec.appendChild(note);
  const grid = document.createElement('div');
  grid.className = 'pos-contract-grid';
  const cards = g.contracts.map(c => contractCard(c));
  cards.forEach(x => grid.appendChild(x.el));
  sec.appendChild(grid);
  wrap.appendChild(sec);
  // 挂载后再建图（mkChart 依赖 dom 已在 document 中）
  cards.forEach(x => sparkChart(x.el.querySelector('.pos-chart'), x.spark));
}

const TIPS = {
  index_vol: '股指仓位主要看风险偏好是否拥挤。',
  rates: '美债仓位主要看市场是在押注利率下行，还是继续押注收益率上行。',
  fx: '外汇仓位看美元与非美货币的拥挤方向。',
  commodities: '商品仓位看再通胀交易是否拥挤，以及趋势资金有没有追随。',
};

function contractCard(c) {
  const card = document.createElement('div');
  card.className = 'pos-contract';
  const netColor = c.net >= 0 ? '#26a69a' : '#ef5350';
  const wkColor = c.week_dir == '增仓' ? '#26a69a' : (c.week_dir == '减仓' ? '#ef5350' : 'var(--text-secondary)');
  card.innerHTML = `
    <div class="pc-head">
      <div>
        <div class="pc-title">${c.name || c.symbol}</div>
        <div class="pc-code">${c.cme || ''}${c.code ? ' · ' + c.code : ''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;white-space:nowrap">
        <span class="pc-badge ${badgeClass(c.label)}">${c.label}</span>
        <div class="pc-pct">2y 百分位 ${c.pct_2y.toFixed(1)}</div>
      </div>
    </div>
    <div class="pos-cols">
      <div><div class="k">净持仓</div><div class="v" style="color:${netColor}">${c.net >= 0 ? '+' : ''}${num(c.net)}</div></div>
      <div><div class="k">多 / 空</div><div class="v"><span style="color:#26a69a">${num(c.long)}</span> / <span style="color:#ef5350">${num(c.short)}</span></div></div>
      <div><div class="k">周环比</div><div class="v" style="color:${wkColor}">${c.week_dir == '增仓' ? '▲ ' : (c.week_dir == '减仓' ? '▼ ' : '—')}${c.week_chg == null ? '' : (c.week_chg > 0 ? '+' : '') + Number(c.week_chg).toLocaleString()}</div></div>
    </div>
    <div class="pos-chart"></div>
    <div class="pos-reading">${c.reading || ''}</div>
    <div class="pos-foot"><span>${c.kind || ''}</span><span>OI ${c.oi == null ? '—' : num(c.oi)}</span></div>`;
  return { el: card, spark: c.spark || { dates: [], spec: [], asset: [] } };
}

function sparkChart(dom, s) {
  const hasAsset = (s.asset || []).some(v => v != null);
  // 纵轴标签宽度：大数值（如 3,836,283）会超出固定 left:50 被裁切，按最大绝对值动态扩左边距
  const maxAbs = Math.max(1, ...[...(s.spec || []), ...(s.asset || [])].filter(v => v != null).map(Math.abs));
  const yLeft = Math.max(50, maxAbs.toLocaleString('en-US').length * 6.5 + 12);
  R.mkChart(dom.id || (dom.id = 'spark-' + Math.random().toString(36).slice(2)), colors => ({
    tooltip: { trigger: 'axis' },
    legend: { data: hasAsset ? ['投机方净持仓', '资管净持仓'] : ['投机方净持仓'], textStyle: { color: '#9ca3af', fontSize: 10 }, top: 0, icon: 'rect', itemWidth: 14, itemHeight: 2, itemGap: 14 },
    grid: { left: yLeft, right: 12, top: 28, bottom: 24 },
    xAxis: {
      type: 'category', data: s.dates, boundaryGap: false,
      axisLine: { lineStyle: { color: colors.border } },
      axisLabel: { color: colors.muted, fontSize: 9, interval: Math.max(1, Math.floor((s.dates.length || 1) / 6)) },
      axisTick: { show: false },
    },
    yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, fontSize: 10, formatter: v => Number(v).toLocaleString('en-US') }, splitLine: { lineStyle: { color: colors.grid } } },
    series: [
      {
        name: '投机方净持仓', type: 'line', data: s.spec, showSymbol: false,
        color: '#60a5fa', lineStyle: { width: 2, color: '#60a5fa' },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(96,165,250,0.28)' }, { offset: 1, color: 'rgba(96,165,250,0.02)' }] } },
      },
      ...(hasAsset ? [{ name: '资管净持仓', type: 'line', data: s.asset, showSymbol: false, color: '#a3a3a3', lineStyle: { width: 1.5, color: '#a3a3a3' } }] : []),
    ],
  }));
}

load().catch(e => R.fail(['overview', 'groups'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
