<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信用压力仪表盘 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>信用压力仪表盘</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>

  <div class="score-card" id="score-card"></div>
  <div id="components"></div>
  <div id="history"></div>
  <div id="cross"></div>
  <div class="re-section">
    <h2>方法论</h2>
    <p style="margin:0">5 分量加权合成（0-100）：<b>HY OAS 百分位 30%</b>（压力最直接的度量）· <b>IG OAS 百分位 20%</b>（更「干净」的信用信号）· <b>HY 30 天变化速率 20%</b>（±200bp 满量程，拐点比绝对值更早）· <b>VIX 百分位 15%</b>（跨资产确认）· <b>股信用背离度 15%</b>（|HY 分位 − VIX 分位|，背离大 = 领先/滞后信号）。分位基于最长 10 年滚动历史（3650 天）计算（对齐 timsun v2），样本不足时按实际可用历史计算。</p>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/credit/stress');
  document.getElementById('re-as-of').textContent = '数据截至 ' + d.as_of;

  // ── 综合分数 ──
  const card = document.getElementById('score-card');
  card.innerHTML = `
    <div>
      <div class="label">COMPOSITE SCORE · 5 分量综合压力指数</div>
      <div class="value" style="color:${d.zone_color}">${d.composite}<span style="font-size:16px;color:var(--text-dim)">/100</span></div>
      <div class="scale">0-30 宽松 · 30-70 中性 · 70-100 压力</div>
    </div>
    <div class="badge" style="color:${d.zone_color};border-color:${d.zone_color}66;background:${d.zone_color}1a">${d.zone}</div>`;

  // ── 分量拆解 ──
  const csec = document.createElement('div');
  csec.className = 're-section';
  csec.innerHTML = '<h2>5 分量拆解</h2>';
  csec.appendChild(R.table(['分量', '权重', '得分', '原值'], d.components.map(c => ({
    分量: c.name, 权重: c.weight + '%', 得分: c.value, 原值: c.raw === null || c.raw === undefined ? '—' : (c.raw + (c.unit || '')),
  })), { 得分: v => `${v}/100` }));
  document.getElementById('components').appendChild(csec);

  // ── 历史曲线 ──
  if (d.history) {
    const hsec = document.createElement('div');
    hsec.className = 're-section';
    hsec.innerHTML = '<h2>压力指数历史曲线</h2><div class="chart" id="hist-chart"></div>';
    document.getElementById('history').appendChild(hsec);
    R.mkChart('hist-chart', colors => ({
      tooltip: { trigger: 'axis' },
      grid: { left: 44, right: 16, top: 24, bottom: 28 },
      xAxis: { type: 'category', data: d.history.dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', min: 0, max: 100, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
      series: [{
        name: '压力指数', type: 'line', data: d.history.values, showSymbol: false, smooth: true,
        lineStyle: { width: 2, color: colors.blue },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: colors.blue + '44' }, { offset: 1, color: colors.blue + '00' }] } },
        markLine: {
          silent: true, symbol: 'none',
          data: [{ yAxis: 30, lineStyle: { color: '#26a69a', type: 'dashed' } }, { yAxis: 70, lineStyle: { color: '#ef5350', type: 'dashed' } }],
          label: { formatter: ({ value }) => value, color: colors.muted, fontSize: 10 },
        },
      }],
    }));
  }

  // ── 跨资产对照 ──
  const xsec = document.createElement('div');
  xsec.className = 're-section';
  xsec.innerHTML = '<h2>跨资产对照（当前百分位 vs HY OAS）</h2>';
  xsec.appendChild(R.table(['指标', '当前百分位', '与 HY OAS 偏离', '含义'], d.cross.map(c => ({
    指标: c.metric, 百分位: c.pct, 偏离: c.dev, 含义: c.note + (c.obs && c.obs < 100 ? `（样本 ${c.obs} 条，积累中）` : ''),
  })), { 百分位: v => `${v}%`, 偏离: v => `${v > 0 ? '+' : ''}${v} pct` }));
  document.getElementById('cross').appendChild(xsec);

  document.getElementById('re-gen').textContent = `规则引擎生成（${d.generator}）· ${d.as_of} · 快照日期取 HY/IG OAS 与 VIX 共同最新交易日`;
}
load().catch(e => R.fail(['score-card', 'components', 'history', 'cross'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
