<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDS 专题 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  .re-root { max-width: 960px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
  .re-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .re-header h1 { font-size: 20px; font-weight: 700; }
  .re-as-of { font-size: 13px; color: var(--text-dim); }
  .re-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .re-nav a { color: var(--accent); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--btn-border); border-radius: 4px; }
  .re-nav a:hover { background: var(--surface-hover); }
  .re-section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 14px 18px; }
  .re-section h2 { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .re-section p { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .re-gen { font-size: 11px; color: var(--text-dim); text-align: right; }
  .re-error { text-align: center; padding: 40px 20px; color: #ef5350; }
  .proxy-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .proxy-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 16px 18px; }
  .proxy-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-dim); }
  .proxy-card .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 4px 0 6px; }
  .proxy-card .value .unit { font-size: 13px; color: var(--text-dim); font-weight: 500; }
  .proxy-card .sub { font-size: 12px; color: var(--text-secondary); }
  .proxy-card .date { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .chart { width: 100%; height: 300px; margin-top: 8px; }
  @media (max-width: 640px) { .proxy-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>CDS 专题 · 信用违约互换</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav">
    <a href="/credit/">总览</a>
    <a href="/credit/cds.html">CDS 专题</a>
    <a href="/credit/stress.html">压力仪表盘</a>
    <a href="/rates/">利率</a>
    <a href="/fed/">美联储</a>
    <a href="/volatility/">波动率</a>
    <a href="/">← 仪表盘</a>
  </div>

  <div id="proxy-row"></div>
  <div id="bank-chart-sec"></div>
  <div class="re-section">
    <h2>数据源与方法论</h2>
    <p style="margin:0">真实 Markit CDX IG / CDX HY / 主权 CDS 为付费数据源（Bloomberg / Refinitiv 授权）。本页第一版使用公开代理指标：</p>
    <ul style="font-size:13px;line-height:1.8;color:var(--text-secondary);margin:8px 0 0;padding-left:20px">
      <li><b>主权 CDS 代理</b>：FRED DGS10（10Y 美债收益率）——10Y 显著上行常反映美元信用 / 财政可持续性的定价变化</li>
      <li><b>银行系统风险代理</b>：KBWB（KBW 银行 ETF）14 日涨跌幅 − ^GSPC 14 日涨跌幅——负值越大代表银行板块相对承压越明显</li>
    </ul>
  </div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  const d = await R.get('/api/credit/cds');
  document.getElementById('re-as-of').textContent = '数据截至 ' + d.as_of;

  // 主权代理卡片
  let sov = '<div class="proxy-card"><div class="label">主权 CDS 代理（10Y UST 收益率）</div>';
  if (d.sovereign) {
    sov += `<div class="value">${d.sovereign.value}<span class="unit">%</span></div>
      <div class="sub">当 10Y 显著上行，通常反映市场对美元信用 / 财政可持续性的定价变化</div>
      <div class="date">${d.sovereign.as_of}</div>`;
  } else {
    sov += '<div class="sub">数据缺失</div>';
  }
  sov += '</div>';

  // 银行系统风险代理卡片
  let bank = '<div class="proxy-card"><div class="label">银行系统风险代理（KBWB vs ^GSPC）</div>';
  if (d.bank) {
    const dv = d.bank.divergence;
    const dir = dv < 0 ? '银行板块相对承压' : (dv > 0 ? '银行板块相对强势' : '持平');
    const color = dv < -0.5 ? 'var(--accent)' : 'var(--text)';
    bank += `<div class="value" style="color:${color}">${dv > 0 ? '+' : ''}${dv.toFixed(2)}<span class="unit">pct</span></div>
      <div class="sub">KBWB ${d.bank.days} 日 ${d.bank.kbwb_chg > 0 ? '+' : ''}${d.bank.kbwb_chg.toFixed(2)}% · ^GSPC ${d.bank.spx_chg > 0 ? '+' : ''}${d.bank.spx_chg.toFixed(2)}% · ${dir}</div>
      <div class="date">近 ${d.bank.days} 个交易日（快照数据积累中，14 日口径需约 15 个交易日）</div>`;
  } else {
    bank += '<div class="sub">KBWB / SPX 快照不足（需 ≥2 个交易日）</div>';
  }
  bank += '</div>';

  const row = document.createElement('div');
  row.className = 'proxy-row';
  row.innerHTML = sov + bank;
  document.getElementById('proxy-row').appendChild(row);

  // 归一化双线图
  if (d.bank && d.bank.chart) {
    const sec = document.createElement('div');
    sec.className = 're-section';
    sec.innerHTML = '<h2>KBWB vs ^GSPC · 近 30 日归一化 = 100</h2><div class="chart" id="bank-chart"></div>';
    document.getElementById('bank-chart-sec').appendChild(sec);
    const c = d.bank.chart;
    R.mkChart('bank-chart', colors => ({
      tooltip: { trigger: 'axis' },
      legend: { data: ['KBWB', '^GSPC'], textStyle: { color: colors.text }, top: 0 },
      grid: { left: 48, right: 16, top: 32, bottom: 28 },
      xAxis: { type: 'category', data: c.dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
      series: [
        { name: 'KBWB', type: 'line', data: c.kbwb, smooth: true, showSymbol: false, lineStyle: { width: 2, color: colors.orange } },
        { name: '^GSPC', type: 'line', data: c.spx, smooth: true, showSymbol: false, lineStyle: { width: 2, color: colors.blue } },
      ],
    }));
  }

  document.getElementById('re-gen').textContent = `规则引擎生成（${d.generator}）· 真实 Markit CDX 数据待接入`;
}
load().catch(e => R.fail(['proxy-row'], e));
</script>
</body>
</html>
