<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>信用 — US Macro</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/special.css">
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="re-root">
  <div class="re-header">
    <h1>信用</h1>
    <span class="re-as-of" id="re-as-of"></span>
  </div>

  <div class="re-nav" id="re-nav"></div>
  <div class="page-toc" id="page-toc"></div>

  <div id="regime"></div>
  <div id="oas-row"></div>
  <div id="re-signals"></div>
  <div id="layers"></div>
  <div id="funding"></div>
  <div id="sloos"></div>
  <div id="quality"></div>
  <div id="fincond"></div>
  <div id="liq-etf"></div>
  <div id="cds-sec"></div>
  <div id="stress-sec"></div>
  <div class="re-gen" id="re-gen"></div>
</div>

<script src="/js/rates-common.js"></script>
<script>
async function load() {
  // 小节锚点导航（长页快速跳转；sticky 见 special.css .page-toc）
  document.getElementById('page-toc').innerHTML = [
    ['概览', 'regime'], ['利差·研判', 'oas-row'], ['分层', 'layers'],
    ['融资成本', 'funding'], ['银行信贷', 'sloos'], ['贷款质量', 'quality'],
    ['金融条件', 'fincond'], ['ETF/CDS', 'liq-etf'], ['压力仪表盘', 'stress-sec'],
  ].map(([t, id]) => `<a href="#${id}">${t}</a>`).join('');

  const [d, cds, stress] = await Promise.all([
    R.get('/api/credit/overview'),
    R.get('/api/credit/cds'),
    R.get('/api/credit/stress'),
  ]);
  document.getElementById('re-as-of').textContent = '数据截至 ' + d.as_of;

  // ── Credit Regime Score 记分卡（对齐持仓页 pos-hero 骨架）──
  const rg = d.regime || { score: null, regime: '—', color: '#999', components: [], missing: [] };
  // 子分区间色：与后端 REGIME_ZONES 同口径（≤50 偏松绿 / 50-75 偏紧橙 / ≥75 收紧红）
  const rgColor = v => v === null || v === undefined ? 'var(--text-dim)' : v >= 75 ? '#ef5350' : v >= 50 ? '#ff9800' : '#26a69a';
  // 子分中文名（英文为 FRED/后端字段名，中文便于快速阅读）
  const RG_CN = { spread_level: '利差水平', spread_mom: '利差动量', funding_cost: '融资成本', credit_supply: '信贷供给', credit_quality: '贷款质量', market_liq: '市场流动性', cross_asset: '跨资产确认' };
  const bars = rg.components.map(c => {
    const v = c.value;
    const w = v === null || v === undefined ? 0 : v;
    const col = rgColor(v);
    return `
      <div class="rg-bar">
        <div class="rg-name">${c.name}<span class="rg-cn">${RG_CN[c.key] || ''}</span>
          <div class="track"><div class="fill" style="width:${w}%;background:${col};${v === null ? '' : 'min-width:2px'}"></div></div>
        </div>
        <span class="${v === null ? 'dim' : 'val'}" style="color:${col}">${v === null ? '—' : v}</span>
      </div>`;
  }).join('');
  const missingNote = rg.missing.length ? `子分数据不足（${rg.missing.join('、')}），综合分按可用子分降级计算。` : '';
  const rc = document.createElement('div');
  rc.className = 'pos-hero regime-hero';
  rc.style.setProperty('--rc-color', rg.color);
  rc.innerHTML = `
    <div class="rh-main">
      <div class="ph-label">CREDIT REGIME SCORE</div>
      <div class="rh-score">
        <span class="num">${rg.score === null ? '—' : rg.score}</span>
        <span class="of">/ 100</span>
        <span class="rh-badge" style="color:${rg.color};border:1px solid ${rg.color}66;background:${rg.color}1a">${rg.regime}</span>
      </div>
      <div class="rh-read">
        高分 = 信用压力更大，综合分为 7 子分等权平均。子分颜色随压力变化：<b style="color:#26a69a">绿</b>（≤50 偏松）→ <b style="color:#ff9800">橙</b>（50-75 偏紧）→ <b style="color:#ef5350">红</b>（≥75 收紧）。
        <span class="legend"><b>读法：</b>Spread Level 与 Cross-Asset Confirmation 同步走高时，压力信号更可信。</span>
      </div>
    </div>
    <div class="rh-bars">${bars}</div>
    <div class="ph-rules">
      <span class="ph-rules-label">口径 · 子分构成</span>
      <span class="ph-rules-text">Spread 10Y 分位 · Momentum 22 日变化 · Funding 3Y 分位 · Supply SLOOS 收紧净百分比 · Quality 逾期/核销 10Y 分位 · Liquidity ETF 动量 · Cross-Asset VIX/HY 均值${missingNote ? ' · ⚠ ' + missingNote : ''}</span>
    </div>`;
  document.getElementById('regime').appendChild(rc);

  // ── 利差卡片行 ──
  const pctStr = c => c.pct_10y === null || c.pct_10y === undefined
    ? '10Y 分位 —'
    : `10Y 分位 ${c.pct_10y}%` + (c.full_10y || c.obs == null ? '' : `（仅 ${c.obs} 条）`);
  const card = (label, c, unit) => `
    <div class="oas-card">
      <div class="label">${label}</div>
      <div class="value">${c.value}<span class="unit">${unit}</span></div>
      <div class="pcts">1Y ${c.pct_1y ?? '—'}% · 3Y ${c.pct_3y ?? '—'}% · ${pctStr(c)}</div>
      <div class="date">${c.as_of}</div>
    </div>`;
  const row = document.createElement('div');
  row.className = 'oas-row';
  row.innerHTML = card('IG OAS（投资级）', d.ig, 'bp') + card('HY OAS（高收益）', d.hy, 'bp') + card('HY − IG', d.hy_ig, 'bp');
  document.getElementById('oas-row').appendChild(row);

  // ── 研判（三段式） ──
  const sec = document.createElement('div');
  sec.className = 're-section';
  sec.innerHTML = '<h2>信用周期研判</h2>';
  const s = d.signals || { framework: '—', what_changed: '—', why_it_matters: '—', what_to_watch: '—' };
  const blocks = [
    ['发生了什么变化', s.what_changed],
    ['为什么重要', s.why_it_matters],
    ['接下来关注什么', s.what_to_watch],
  ];
  blocks.forEach(([title, text]) => {
    const b = document.createElement('div');
    b.className = 'sig-block';
    b.innerHTML = `<div class="sig-title">${title}</div><p>${text}</p>`;
    sec.appendChild(b);
  });
  sec.innerHTML += `<div class="note">框架：${s.framework} · rule-based · no direct price forecast</div>`;
  document.getElementById('re-signals').appendChild(sec);

  // ── OAS 分层表 ──
  const layers = d.layers.map(l => ({
    层级: l.name, 当前bp: l.value, '1Y 分位': l.pct_1y, '3Y 分位': l.pct_3y, '10Y 分位': l.pct_10y, 观测期: l.as_of, 发布: l.released || '—',
  }));
  layers.push({ 层级: 'CCC − BB', 当前bp: d.spreads.ccc_bb?.value ?? '—', '1Y 分位': '—', '3Y 分位': '—', '10Y 分位': '—', 观测期: d.spreads.ccc_bb?.as_of ?? '—', 发布: '—' });
  layers.push({ 层级: 'BBB − IG', 当前bp: d.spreads.bbb_ig?.value ?? '—', '1Y 分位': '—', '3Y 分位': '—', '10Y 分位': '—', 观测期: d.spreads.bbb_ig?.as_of ?? '—', 发布: '—' });
  const lsec = document.createElement('div');
  lsec.className = 're-section';
  lsec.innerHTML = '<h2>信用利差分层（ICE BofA OAS）</h2><p style="margin:0">越低评级越暴露尾部风险：CCC−BB 快速走阔 = 压力从指数层面向弱资质发行人扩散。</p>';
  lsec.appendChild(R.table(['层级', '当前bp', '1Y 分位', '3Y 分位', '10Y 分位', '观测期', '发布'], layers, {
    当前bp: v => v === '—' ? '—' : `${v}bp`,
    '1Y 分位': v => typeof v === 'number' ? `${v}%` : '—',
    '3Y 分位': v => typeof v === 'number' ? `${v}%` : '—',
    '10Y 分位': v => typeof v === 'number' ? `${v}%` : '—',
  }));
  document.getElementById('layers').appendChild(lsec);

  // ── All-in 融资成本 ──
  const f = d.funding;
  const fsec = document.createElement('div');
  fsec.className = 're-section';
  fsec.innerHTML = '<h2>All-in 融资成本</h2><p style="margin:0">利差是风险补偿，effective yield 是企业面对的绝对借钱成本；两者可同时出现「spread 低、融资成本高」。</p>';
  if (f.ig && f.hy) {
    fsec.appendChild(R.table(['指标', '当前', '发布'], [
      { 指标: 'IG 有效收益率', 当前: f.ig.value, 发布: f.ig.released || '—' },
      { 指标: 'HY 有效收益率', 当前: f.hy.value, 发布: f.hy.released || '—' },
      { 指标: 'HY − 联邦基金利率', 当前: f.hy_ff == null ? '—' : `${f.hy_ff.toFixed(0)}bp`, 发布: f.hy.released || '—' },
      { 指标: 'HY − 10Y 国债', 当前: f.hy_10y == null ? '—' : `${f.hy_10y.toFixed(0)}bp`, 发布: f.hy.released || '—' },
    ], { 当前: (v) => v === null || v === undefined ? '—' : typeof v === 'number' ? `${(v / 100).toFixed(2)}%` : String(v) }));
  }
  document.getElementById('funding').appendChild(fsec);

  // ── SLOOS ──
  const ssec = document.createElement('div');
  ssec.className = 're-section';
  ssec.innerHTML = '<h2>银行信贷 · SLOOS（净百分比，季度）</h2><p style="margin:0">正值 = 收紧标准 / 需求走强。</p>';
  ssec.appendChild(R.table(['指标', '净百分比', '观测期', '发布'],
    d.sloos.map(s => ({ 指标: s.name, 净百分比: s.value, 观测期: s.as_of, 发布: s.released || '—' })),
    { 净百分比: v => v === null || v === undefined ? '—（停更）' : `${v > 0 ? '+' : ''}${v.toFixed(1)}%` }));
  document.getElementById('sloos').appendChild(ssec);

  // ── 贷款质量 ──
  const qsec = document.createElement('div');
  qsec.className = 're-section';
  qsec.innerHTML = '<h2>贷款质量（逾期率 / 核销率，季度）</h2><p style="margin:0">滞后但更硬的信用质量指标，验证利差是否低估基本面损伤。</p>';
  qsec.appendChild(R.table(['指标', '当前', '10Y 分位', '观测期', '发布'],
    d.quality.map(q => ({ 指标: q.name, 当前: q.value, 分位: q.pct_10y, 观测期: q.as_of, 发布: q.released || '—' })),
    { 当前: v => `${v.toFixed(2)}%`, 分位: v => v === null || v === undefined ? '—' : `${v}%` }));
  document.getElementById('quality').appendChild(qsec);

  // ── 金融条件 ──
  const fc = d.fincond;
  const fsec2 = document.createElement('div');
  fsec2.className = 're-section';
  fsec2.innerHTML = '<h2>金融条件与压力指数</h2><p style="margin:0">NFCI 及子指数上行 = 条件收紧；与 HY OAS 同步上行时信用压力更可信。</p>';
  fsec2.appendChild(R.table(['指标', '当前', '观测期', '发布'], [
    { 指标: 'NFCI', 当前: fc.nfci?.value, 观测期: fc.nfci?.as_of, 发布: fc.nfci?.released || '—' },
    { 指标: 'ANFCI（调整后）', 当前: fc.anfci?.value, 观测期: fc.anfci?.as_of, 发布: fc.anfci?.released || '—' },
    { 指标: 'NFCI 风险子指数', 当前: fc.nfci_risk?.value, 观测期: fc.nfci_risk?.as_of, 发布: fc.nfci_risk?.released || '—' },
    { 指标: 'NFCI 信用子指数', 当前: fc.nfci_credit?.value, 观测期: fc.nfci_credit?.as_of, 发布: fc.nfci_credit?.released || '—' },
    { 指标: 'NFCI 杠杆子指数', 当前: fc.nfci_leverage?.value, 观测期: fc.nfci_leverage?.as_of, 发布: fc.nfci_leverage?.released || '—' },
    { 指标: 'STLFSI（圣路易斯压力指数）', 当前: fc.stlfsi?.value, 观测期: fc.stlfsi?.as_of, 发布: fc.stlfsi?.released || '—' },
    { 指标: 'OFR 金融压力指数', 当前: fc.ofr_fsi?.value, 观测期: fc.ofr_fsi?.as_of, 发布: '—' },
  ], { 当前: v => v === null || v === undefined ? '—' : `${v > 0 ? '+' : ''}${v.toFixed(2)}` }));
  document.getElementById('fincond').appendChild(fsec2);

  // ── 市场流动性代理 ──
  const lsec2 = document.createElement('div');
  lsec2.className = 're-section';
  lsec2.innerHTML = '<h2>信用 ETF 二级市场流动性代理</h2>';
  const hyg = d.liq_etf.hyg, lqd = d.liq_etf.lqd;
  const etfStr = (e, name) => e
    ? `$<b>${name}</b> ${'$' + e.value} · vol ${e.volume != null ? e.volume.toLocaleString() : '—'}`
    : `${name} —`;
  lsec2.innerHTML += `<p style="margin:0">${etfStr(hyg, 'HYG')} · ${etfStr(lqd, 'LQD')}（Yahoo Finance 日频快照，TRACE 真实成交量预留）</p>`;
  document.getElementById('liq-etf').appendChild(lsec2);

  // ── CDS 专题（原 cds.html 并入）──
  renderCds(document.getElementById('cds-sec'), cds);

  // ── 信用压力仪表盘（原 stress.html 并入）──
  renderStress(document.getElementById('stress-sec'), stress);

  document.getElementById('re-gen').textContent = `研判生成：${R.genText(d.generator)} · ${d.as_of} · ICE BofA 系列经 FRED API 仅提供近 ~3 年，10Y 分位按可用历史计算`;
}

// ── CDS 专题：主权/银行系统风险代理 + 归一化双线 ──
function renderCds(root, d) {
  const sec = document.createElement('div');
  sec.className = 're-section';
  root.appendChild(sec);  // 先挂文档再建图（R.mkChart 按 id 查 DOM，detached 时查不到）
  sec.innerHTML = '<h2>CDS 专题 · 信用违约互换</h2>';
  let sov = '<div class="proxy-card"><div class="label">主权 CDS 代理（10Y UST 收益率）</div>';
  if (d.sovereign) {
    sov += `<div class="value">${d.sovereign.value}<span class="unit">%</span></div>
      <div class="sub">当 10Y 显著上行，通常反映市场对美元信用 / 财政可持续性的定价变化</div>
      <div class="date">${d.sovereign.as_of}</div>`;
  } else {
    sov += '<div class="sub">数据缺失</div>';
  }
  sov += '</div>';
  let bank = '<div class="proxy-card"><div class="label">银行系统风险代理（KBWB vs ^GSPC）</div>';
  if (d.bank) {
    const dv = d.bank.divergence;
    const dir = dv < 0 ? '银行板块相对承压' : (dv > 0 ? '银行板块相对强势' : '持平');
    const color = dv < -0.5 ? 'var(--accent)' : 'var(--text)';
    bank += `<div class="value" style="color:${color}">${dv > 0 ? '+' : ''}${dv.toFixed(2)}<span class="unit">pct</span></div>
      <div class="sub">KBWB ${d.bank.days} 日 ${d.bank.kbwb_chg > 0 ? '+' : ''}${d.bank.kbwb_chg.toFixed(2)}% · ^GSPC ${d.bank.spx_chg > 0 ? '+' : ''}${d.bank.spx_chg.toFixed(2)}% · ${dir}</div>
      <div class="date">近 ${d.bank.days} 个交易日（快照数据积累中，14 日口径需约 15 个交易日）</div>`;
  } else {
    bank += '<div class="sub">KBWB / SPX 快照不足（需 ≥2 个交易日）</div>';
  }
  bank += '</div>';
  const row = document.createElement('div');
  row.className = 'proxy-row';
  row.innerHTML = sov + bank;
  sec.appendChild(row);

  if (d.bank && d.bank.chart) {
    sec.innerHTML += '<h3 style="margin:12px 0 6px">KBWB vs ^GSPC · 近 30 日归一化 = 100</h3><div class="chart" id="bank-chart"></div>';
    const c = d.bank.chart;
    R.mkChart('bank-chart', colors => ({
      tooltip: { trigger: 'axis' },
      legend: { data: ['KBWB', '^GSPC'], textStyle: { color: colors.text }, top: 0 },
      grid: { left: 48, right: 16, top: 32, bottom: 28 },
      xAxis: { type: 'category', data: c.dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', scale: true, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
      series: [
        { name: 'KBWB', type: 'line', data: c.kbwb, smooth: true, showSymbol: false, lineStyle: { width: 2, color: colors.orange } },
        { name: '^GSPC', type: 'line', data: c.spx, smooth: true, showSymbol: false, lineStyle: { width: 2, color: colors.blue } },
      ],
    }));
  }
  // 用 insertAdjacentHTML 追加，不能 innerHTML +=（会重建全部子节点，把上面已建好的 bank-chart 图表 div 换成一个空白新节点）
  sec.insertAdjacentHTML('beforeend', '<p style="margin:0;font-size:12px">真实 Markit CDX IG / CDX HY / 主权 CDS 为付费数据源（Bloomberg / Refinitiv 授权），本页使用公开代理指标。</p>');
}

// ── 信用压力仪表盘：综合分 + 5 分量 + 历史 + 跨资产 ──
function renderStress(root, d) {
  const wrap = document.createElement('div');
  root.appendChild(wrap);  // 先挂文档再建图（同 renderCds）
  const card = document.createElement('div');
  card.className = 'score-card';
  card.innerHTML = `
    <div>
      <div class="label">COMPOSITE SCORE · 5 分量综合压力指数</div>
      <div class="value" style="color:${d.zone_color}">${d.composite}<span style="font-size:16px;color:var(--text-dim)">/100</span></div>
      <div class="scale">0-30 宽松 · 30-70 中性 · 70-100 压力</div>
    </div>
    <div class="badge" style="color:${d.zone_color};border-color:${d.zone_color}66;background:${d.zone_color}1a">${d.zone}</div>`;
  wrap.appendChild(card);

  const csec = document.createElement('div');
  csec.className = 're-section';
  csec.innerHTML = '<h2>5 分量拆解</h2>';
  csec.appendChild(R.table(['分量', '权重', '得分', '原值'], d.components.map(c => ({
    分量: c.name, 权重: c.weight + '%', 得分: c.value, 原值: c.raw === null || c.raw === undefined ? '—' : (c.raw + (c.unit || '')),
  })), { 得分: v => `${v}/100` }));
  wrap.appendChild(csec);

  if (d.history) {
    const hsec = document.createElement('div');
    hsec.className = 're-section';
    hsec.innerHTML = '<h2>压力指数历史曲线</h2><div class="chart" id="hist-chart"></div>';
    wrap.appendChild(hsec);
    R.mkChart('hist-chart', colors => ({
      tooltip: { trigger: 'axis' },
      grid: { left: 44, right: 16, top: 24, bottom: 28 },
      xAxis: { type: 'category', data: d.history.dates, axisLine: { lineStyle: { color: colors.border } }, axisLabel: { color: colors.muted, fontSize: 11 } },
      yAxis: { type: 'value', min: 0, max: 100, axisLabel: { color: colors.muted, fontSize: 11 }, splitLine: { lineStyle: { color: colors.grid } } },
      series: [{
        name: '压力指数', type: 'line', data: d.history.values, showSymbol: false, smooth: true,
        lineStyle: { width: 2, color: colors.blue },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: colors.blue + '44' }, { offset: 1, color: colors.blue + '00' }] } },
        markLine: {
          silent: true, symbol: 'none',
          data: [{ yAxis: 30, lineStyle: { color: '#26a69a', type: 'dashed' } }, { yAxis: 70, lineStyle: { color: '#ef5350', type: 'dashed' } }],
          label: { formatter: ({ value }) => value, color: colors.muted, fontSize: 10 },
        },
      }],
    }));
  }

  const xsec = document.createElement('div');
  xsec.className = 're-section';
  xsec.innerHTML = '<h2>跨资产对照（当前百分位 vs HY OAS）</h2>';
  xsec.appendChild(R.table(['指标', '当前百分位', '与 HY OAS 偏离', '含义'], d.cross.map(c => ({
    指标: c.metric, 百分位: c.pct, 偏离: c.dev, 含义: c.note + (c.obs && c.obs < 100 ? `（样本 ${c.obs} 条，积累中）` : ''),
  })), { 百分位: v => `${v}%`, 偏离: v => `${v > 0 ? '+' : ''}${v} pct` }));
  wrap.appendChild(xsec);
}

load().catch(e => R.fail(['regime', 'oas-row', 're-signals', 'layers', 'funding', 'sloos', 'quality', 'fincond', 'liq-etf', 'cds-sec', 'stress-sec'], e));
</script>
<script src="/js/nav.js"></script>
</body>
</html>
